<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VMOS 4.7 — Virtual Machine Shell</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0a1a0a; --scr:#071307; --fg:#7dff7d; --fg-dim:#3fa93f; --fg-bright:#b6ffb6;
  --accent:#7dff7d; --shadow:#033603; --panel:#0e2a0e; --panel-hi:#164116; --panel-lo:#051805;
  --bevel-hi:#2fbe2f; --bevel-lo:#031e03; --title-a:#7dff7d; --title-b:#1b641b; --title-fg:#071307;
  --danger:#ff5c5c; --warn:#ffd76b; --link:#b6ffff;
  --font-mono:'VT323','Courier New',ui-monospace,monospace;
  --font-ui:'VT323','Courier New',ui-monospace,monospace;
  --scanline-a:rgba(0,0,0,0.35); --scanline-b:rgba(0,0,0,0); --grid-lines:rgba(80,255,80,0.05);
}
body[data-theme="amber"]{--bg:#1a0e02;--scr:#170a01;--fg:#ffbf5a;--fg-dim:#a8792f;--fg-bright:#ffe1a0;--accent:#ffbf5a;--shadow:#3a2100;--panel:#2a1a03;--panel-hi:#412705;--panel-lo:#150a01;--bevel-hi:#c0842a;--bevel-lo:#180d02;--title-a:#ffbf5a;--title-b:#5a3a05;--title-fg:#170a01;--link:#fff2c8;--grid-lines:rgba(255,190,80,0.05)}
body[data-theme="ice"]{--bg:#04121e;--scr:#03101a;--fg:#8fd8ff;--fg-dim:#3f7ba9;--fg-bright:#d0ecff;--accent:#8fd8ff;--shadow:#031f34;--panel:#0a2036;--panel-hi:#0f3050;--panel-lo:#031421;--bevel-hi:#3f8bbe;--bevel-lo:#031423;--title-a:#8fd8ff;--title-b:#123a58;--title-fg:#03101a;--link:#c8f4ff;--grid-lines:rgba(120,200,255,0.05)}
body[data-theme="mono"]{--bg:#111;--scr:#0b0b0b;--fg:#e0e0e0;--fg-dim:#8a8a8a;--fg-bright:#fff;--accent:#e0e0e0;--shadow:#000;--panel:#1a1a1a;--panel-hi:#2c2c2c;--panel-lo:#0a0a0a;--bevel-hi:#8a8a8a;--bevel-lo:#000;--title-a:#e0e0e0;--title-b:#333;--title-fg:#0b0b0b;--link:#c8c8ff;--grid-lines:rgba(255,255,255,0.05)}
body[data-theme="magenta"]{--bg:#150318;--scr:#0f0212;--fg:#ff8bff;--fg-dim:#a83fa8;--fg-bright:#ffd4ff;--accent:#ff8bff;--shadow:#360036;--panel:#280228;--panel-hi:#3a053a;--panel-lo:#100210;--bevel-hi:#c02fc0;--bevel-lo:#180318;--title-a:#ff8bff;--title-b:#5a0a5a;--title-fg:#0f0212;--link:#c8c8ff;--grid-lines:rgba(255,120,255,0.05)}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:var(--font-ui);color:var(--fg)}
body{font-size:18px;line-height:1.15;image-rendering:pixelated;-webkit-font-smoothing:none;user-select:none;cursor:default}
@font-face{font-family:'VT323';src:local('VT323');font-display:swap}

#crt{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,0.55) 100%),var(--bg);overflow:hidden;perspective:1200px}
#crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(to bottom,var(--scanline-a) 0px,var(--scanline-a) 1px,var(--scanline-b) 1px,var(--scanline-b) 3px);mix-blend-mode:multiply;animation:crtRoll 8s linear infinite}
#crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(ellipse at center,rgba(255,255,255,0.02),rgba(0,0,0,0.35));animation:crtFlicker 0.15s steps(2) infinite}
@keyframes crtRoll{0%{background-position:0 0}100%{background-position:0 100px}}
@keyframes crtFlicker{0%{opacity:0.85}50%{opacity:1}100%{opacity:0.9}}
.screen{position:absolute;inset:0;background:var(--scr);box-shadow:inset 0 0 120px rgba(0,0,0,0.8),inset 0 0 20px rgba(0,0,0,0.6)}

#boot{position:absolute;inset:0;padding:24px 36px;color:var(--fg-bright);font-family:var(--font-mono);white-space:pre-wrap;overflow:hidden;text-shadow:0 0 6px var(--fg);z-index:50}
#boot .cursor{background:var(--fg);color:var(--scr);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#desktop{position:absolute;inset:0;display:none;background:linear-gradient(var(--grid-lines) 1px,transparent 1px) 0 0 / 32px 32px,linear-gradient(90deg,var(--grid-lines) 1px,transparent 1px) 0 0 / 32px 32px,radial-gradient(ellipse at 20% 20%,rgba(125,255,125,0.06),transparent 60%),var(--scr);overflow:hidden}
#desktop.on{display:block}
#icons{position:absolute;inset:8px 8px 40px 8px;display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:96px;gap:8px;align-content:start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.icon{width:96px;height:96px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;cursor:pointer;color:var(--fg-bright);text-shadow:0 0 6px var(--fg);border:1px dashed transparent}
.icon.selected{border-color:var(--fg-dim);background:rgba(125,255,125,0.08)}
.icon .glyph{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--fg);background:var(--panel);box-shadow:inset -2px -2px 0 var(--bevel-lo),inset 2px 2px 0 var(--bevel-hi);font-size:26px}
.icon .label{font-size:16px;text-align:center;max-width:88px;line-height:1.05;word-break:break-word;padding:1px 3px}

#taskbar{position:absolute;left:0;right:0;bottom:0;height:32px;background:var(--panel);border-top:2px solid var(--bevel-hi);box-shadow:inset 0 -2px 0 var(--bevel-lo);display:flex;align-items:center;gap:4px;padding:2px 4px;z-index:1000}
#startBtn{height:26px;padding:0 10px;background:var(--panel-hi);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
#startBtn:active,#startBtn.open{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
#startBtn .sq{display:inline-block;width:12px;height:12px;background:var(--fg);box-shadow:4px 0 0 var(--scr),0 4px 0 var(--scr),4px 4px 0 var(--scr)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;padding:0 4px}
.task{height:26px;padding:0 8px;max-width:180px;background:var(--panel-hi);color:var(--fg-bright);border:none;font-family:var(--font-ui);font-size:16px;cursor:pointer;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);background:var(--panel-lo)}
#tray{height:26px;padding:0 8px;background:var(--panel-lo);box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);display:flex;align-items:center;gap:8px;color:var(--fg-bright);font-size:16px}
#tray .led{display:inline-block;width:8px;height:8px;background:var(--fg);box-shadow:0 0 6px var(--fg);animation:blink 2s steps(2) infinite}
#clock{cursor:pointer}

#startMenu{position:absolute;left:4px;bottom:34px;width:260px;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6);padding:6px;z-index:1500;display:none;font-size:18px}
#startMenu.open{display:block}
#startMenu .sm-header{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg);padding:4px 8px;margin:-6px -6px 6px -6px;font-weight:bold;letter-spacing:1px}
#startMenu .sm-item{padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:10px}
#startMenu .sm-item:hover{background:var(--title-b);color:var(--title-fg)}
#startMenu .sm-sep{height:2px;background:var(--bevel-lo);margin:4px 0;box-shadow:0 1px 0 var(--bevel-hi)}
#startMenu .sm-item .g{width:20px;text-align:center}

.win{position:absolute;min-width:240px;min-height:120px;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),6px 6px 0 rgba(0,0,0,0.55);display:flex;flex-direction:column;color:var(--fg-bright);z-index:100}
.win.max{inset:0 0 32px 0 !important;width:auto !important;height:auto !important;box-shadow:none}
.win .titlebar{height:24px;background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg);display:flex;align-items:center;padding:0 4px;cursor:move;user-select:none;font-weight:bold;letter-spacing:1px}
.win.inactive .titlebar{background:linear-gradient(90deg,var(--panel-hi),var(--panel-lo));color:var(--fg-dim)}
.win .titlebar .t-icon{margin-right:6px}
.win .titlebar .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.win .titlebar .t-btns{display:flex;gap:2px}
.win .titlebar button{width:22px;height:18px;background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:14px;cursor:pointer;padding:0;display:grid;place-items:center}
.win .titlebar button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.win .menubar{display:flex;gap:0;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo);font-size:16px}
.win .menubar .mi{padding:2px 10px;cursor:pointer}
.win .menubar .mi:hover{background:var(--title-b);color:var(--title-fg)}
.win .body{flex:1;overflow:auto;background:var(--panel-lo);position:relative}
.win .statusbar{height:20px;background:var(--panel-hi);border-top:1px solid var(--bevel-lo);padding:0 6px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fg-bright)}
.win .resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 60%,var(--fg-dim) 60% 70%,transparent 70% 75%,var(--fg-dim) 75% 85%,transparent 85% 90%,var(--fg-dim) 90%)}

.term{padding:8px 10px;height:100%;overflow:auto;background:var(--scr);color:var(--fg-bright);font-family:var(--font-mono);font-size:18px;text-shadow:0 0 6px var(--fg);white-space:pre-wrap;word-break:break-word}
.term .line{padding:0}
.term .prompt{color:var(--fg)}
.term .in{background:transparent;border:none;color:var(--fg-bright);font-family:inherit;font-size:inherit;outline:none;width:80%;caret-color:var(--fg)}
.term a{color:var(--link);text-decoration:underline;cursor:pointer}

.expl{display:grid;grid-template-columns:180px 1fr;height:100%;background:var(--panel-lo)}
.expl .side{border-right:1px solid var(--bevel-lo);background:var(--panel);overflow:auto;padding:4px 0}
.expl .side .tn{padding:2px 8px;cursor:pointer;font-size:16px}
.expl .side .tn.sel{background:var(--title-b);color:var(--title-fg)}
.expl .side .tn .ch{display:inline-block;width:14px}
.expl .main{display:flex;flex-direction:column;overflow:hidden}
.expl .nav{display:flex;gap:4px;padding:3px;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo);align-items:center}
.expl .nav button{background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:15px;cursor:pointer;padding:1px 7px}
.expl .nav button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.expl .nav button:disabled{opacity:0.4;cursor:default}
.expl .nav .addr{flex:1;background:var(--scr);color:var(--fg-bright);border:2px inset var(--bevel-lo);padding:1px 6px;font-family:var(--font-ui);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expl .files{overflow:auto;padding:6px;align-content:start;display:grid;grid-template-columns:repeat(auto-fill,80px);grid-auto-rows:88px;gap:6px}
.expl .f{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 2px;cursor:pointer;border:1px dashed transparent;color:var(--fg-bright);text-align:center;font-size:14px;word-break:break-word;line-height:1.05}
.expl .f.sel{border-color:var(--fg-dim);background:rgba(125,255,125,0.08)}
.expl .f.cut{opacity:0.5}
.expl .f .g{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -2px -2px 0 var(--bevel-lo),inset 2px 2px 0 var(--bevel-hi);font-size:22px;margin-bottom:2px}

.ctxmenu{position:absolute;z-index:6000;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6);padding:4px;min-width:160px;font-family:var(--font-ui);font-size:16px}
.ctxmenu .ci{padding:4px 10px;cursor:pointer;color:var(--fg-bright);display:flex;gap:8px;align-items:center}
.ctxmenu .ci:hover{background:var(--title-b);color:var(--title-fg)}
.ctxmenu .ci.dis{opacity:0.5;cursor:default}
.ctxmenu .ci.dis:hover{background:transparent;color:var(--fg-bright)}
.ctxmenu .sep{height:2px;background:var(--bevel-lo);margin:3px 0;box-shadow:0 1px 0 var(--bevel-hi)}
.ctxmenu .ci .g{width:16px;text-align:center}

.pad{width:100%;height:100%;padding:8px;background:var(--scr);color:var(--fg-bright);border:none;outline:none;resize:none;font-family:var(--font-mono);font-size:18px;text-shadow:0 0 3px var(--fg)}

.imgv{width:100%;height:100%;background:repeating-conic-gradient(var(--panel-lo) 0% 25%,var(--panel) 0% 50%) 50% 50% / 20px 20px;display:grid;place-items:center;overflow:auto;padding:10px}
.imgv img{max-width:100%;max-height:100%;image-rendering:pixelated;border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6)}

.net{display:flex;flex-direction:column;height:100%}
.net .bar{display:flex;gap:4px;padding:4px;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo)}
.net .bar input{flex:1;background:var(--scr);color:var(--fg-bright);border:2px inset var(--bevel-lo);padding:2px 6px;font-family:var(--font-ui);font-size:16px}
.net .bar button{background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:2px 8px;font-family:var(--font-ui);font-size:16px;cursor:pointer}
.net .bar button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.net .view{flex:1;background:var(--scr);overflow:auto;padding:10px;font-size:18px;line-height:1.35}
.net .view h1,.net .view h2,.net .view h3{color:var(--fg);text-shadow:0 0 6px var(--fg);margin:6px 0}
.net .view a{color:var(--link);text-decoration:underline;cursor:pointer}
.net .view .result{border-bottom:1px dashed var(--bevel-lo);padding:6px 0}
.net .view .result .u{color:var(--fg-dim);font-size:14px}
.net iframe{width:100%;height:100%;border:none;background:#fff}

.cfg{padding:12px;height:100%;overflow:auto;font-size:18px}
.cfg h2{color:var(--fg);margin:6px 0;text-shadow:0 0 6px var(--fg)}
.cfg .row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.cfg .sw{width:56px;height:56px;cursor:pointer;border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);display:grid;place-items:center;font-size:14px}
.cfg .sw.sel{outline:2px dashed var(--fg-bright);outline-offset:2px}
.cfg button,.cfg select,.cfg input[type=range]{background:var(--panel);color:var(--fg-bright);border:none;padding:4px 10px;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:16px;cursor:pointer}

.modal-back{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:grid;place-items:center;z-index:5000}
.modal{min-width:340px;max-width:520px;background:var(--panel);color:var(--fg-bright);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),8px 8px 0 rgba(0,0,0,0.6)}
.modal .h{background:linear-gradient(90deg,var(--danger),#7a1414);color:#fff;padding:4px 8px;font-weight:bold;letter-spacing:1px}
.modal.info .h{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg)}
.modal .b{padding:14px;font-size:18px;line-height:1.35}
.modal .b .sig{color:var(--fg-dim);font-size:14px;margin-top:8px}
.modal .f{padding:8px;display:flex;justify-content:flex-end;gap:6px;background:var(--panel-hi)}
.modal .f button{background:var(--panel);color:var(--fg-bright);border:none;padding:4px 14px;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:16px;cursor:pointer}
.modal .f button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}

#saver{position:absolute;inset:0;background:#000;z-index:8000;display:none;color:var(--fg-bright);font-family:var(--font-mono);overflow:hidden}
#saver.on{display:block}
#saver canvas{width:100%;height:100%}

.mono{font-family:var(--font-mono)}
.dim{color:var(--fg-dim)}
.bright{color:var(--fg-bright);text-shadow:0 0 6px var(--fg)}
.err{color:var(--danger)}
.warn{color:var(--warn)}
::selection{background:var(--fg);color:var(--scr)}
*::-webkit-scrollbar{width:14px;height:14px}
*::-webkit-scrollbar-track{background:var(--panel-lo);box-shadow:inset 1px 1px 0 var(--bevel-lo)}
*::-webkit-scrollbar-thumb{background:var(--panel-hi);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi)}
*::-webkit-scrollbar-thumb:hover{background:var(--fg-dim)}
*::-webkit-scrollbar-corner{background:var(--panel-lo)}
body.noflick #crt::after{animation:none !important}
body.novign #crt{background:var(--bg)}
body.nogrid #desktop{background:radial-gradient(ellipse at 20% 20%,rgba(125,255,125,0.06),transparent 60%),var(--scr)}
body.busy,body.busy *{cursor:progress !important}

/* ================= RESOURCE OVERLOAD (real symptom) ================= */
/* when the emulated CPU is oversubscribed the whole picture strains */
body.vm-thrash #desktop{animation:vmThrash .18s steps(2) infinite}
@keyframes vmThrash{0%{transform:translateY(0)}50%{transform:translateY(-1px)}51%{transform:translateY(1px)}100%{transform:translateY(0)}}
body.vm-thrash #crt::after{opacity:1;animation-duration:.09s}
/* oversubscribed past ~140%: the scheduler can't keep up and the picture
   nearly freezes - coarse horizontal-hold judder and a dimmed, strained tube */
body.vm-hang #desktop{animation:vmHang .5s steps(1) infinite;filter:brightness(0.92) contrast(1.08)}
@keyframes vmHang{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}26%{transform:translate(3px,-1px)}55%{transform:translate(0,0)}56%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
body.vm-hang{cursor:progress}

/* ================= GREEN SCREEN OF DEATH ================= */
#gsod{position:absolute;inset:0;z-index:10000;background:#020a02;overflow:hidden;font-family:var(--font-mono)}
#gsod .gsod-noise{position:absolute;inset:-20%;pointer-events:none;background:
  repeating-linear-gradient(0deg,rgba(125,255,125,0.10) 0 1px,transparent 1px 2px),
  repeating-linear-gradient(90deg,rgba(125,255,125,0.05) 0 2px,transparent 2px 5px);
  mix-blend-mode:screen;animation:gsodStatic .08s steps(3) infinite}
#gsod .gsod-tear{position:absolute;left:-10%;width:120%;height:34px;background:rgba(125,255,125,0.14);box-shadow:0 0 30px rgba(125,255,125,0.5);top:22%;animation:gsodTear 1.3s steps(6) infinite}
#gsod .gsod-tear.t2{top:64%;height:18px;animation-duration:.7s;animation-direction:reverse;background:rgba(125,255,125,0.22)}
#gsod .gsod-text{position:relative;z-index:2;margin:0;padding:40px 46px;color:#c6ffc6;font-size:19px;line-height:1.28;white-space:pre-wrap;
  text-shadow:0 0 8px #7dff7d,0 0 2px #7dff7d;animation:gsodTextJitter .12s steps(2) infinite}
@keyframes gsodStatic{0%{transform:translate(0,0)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-2px)}100%{transform:translate(-1px,1px)}}
@keyframes gsodTear{0%{transform:translateX(0)}20%{transform:translateX(-40px)}40%{transform:translateX(60px)}60%{transform:translateX(-20px)}80%{transform:translateX(30px)}100%{transform:translateX(0)}}
@keyframes gsodTextJitter{0%{transform:translate(0,0) skewX(0)}50%{transform:translate(-1px,1px) skewX(-0.4deg)}100%{transform:translate(1px,-1px) skewX(0.3deg)}}
body.gsod-break #crt{animation:gsodVHold .28s linear infinite}

const VFS = {
  root: freshTree(),
  cwd: ['C:'],
  env: { PATH:'C:\\PROGRAMS', TEMP:'C:\\TEMP', PROMPT:'$P$G', OPERATOR:'local' },
  recycle: [],
  listeners: new Set(),

  onChange(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
  clearListeners(){ this.listeners.clear(); },
  notify(){ this.listeners.forEach(fn=>{ try{ fn(); }catch(e){} }); },

  join(parts){ return parts.join('\\') },
  parsePath(p){
    if(!p) return null;
    p = p.replace(/\//g,'\\');
    let parts = p.split('\\').filter(Boolean);
    if(!/^C:/i.test(parts[0])) parts = [...this.cwd, ...parts];
    return parts;
  },
  resolve(parts){
    if(!parts) return null;
    let node = this.root;
    if(parts[0].toUpperCase()!=='C:') return null;
    for(let i=1;i<parts.length;i++){
      const seg = parts[i];
      if(seg==='..') continue;
      if(!node.children) return null;
      const key = Object.keys(node.children).find(k=>k.toLowerCase()===seg.toLowerCase());
      if(!key) return null;
      node = node.children[key];
    }
    return node;
  },
  ls(parts){
    const node = this.resolve(parts);
    if(!node || node.type!=='dir') return null;
    return Object.entries(node.children).map(([n,v])=>({name:n, ...v}));
  },
  read(parts){ return this.resolve(parts); },
  write(parts, content, opts={}){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const name = parts[parts.length-1];
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===name.toLowerCase());
    const existing = key ? parent.children[key] : null;
    if(existing && existing.type==='sys') return {ok:false, reason:'protected system object'};
    if(existing && existing.type==='dir') return {ok:false, reason:'target is a directory'};
    const type = opts.type || existing?.type || 'txt';
    const useName = key || name;
    parent.children[useName] = { type, content, ...(opts.extra||{}) };
    this.notify();
    return {ok:true, name:useName};
  },
  remove(parts, opts={}){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===parts[parts.length-1].toLowerCase());
    if(!key) return {ok:false, reason:'not found'};
    const node = parent.children[key];
    if(node.type==='sys') return {ok:false, reason:'protected system object'};
    if(parts.length===2 && key.toUpperCase()==='SYSTEM') return {ok:false, reason:'protected system directory'};
    const isBootCfg = parts.length===3 && parts[1].toUpperCase()==='SYSTEM' && key.toUpperCase()==='BOOT.VMCFG';
    const origin = [...parts.slice(0,-1), key];
    delete parent.children[key];
    if(!opts.permanent){ this.recycle.push({ name:key, node, origin, when:Date.now() }); }
    this.notify();
    if(isBootCfg && typeof triggerGSOD==='function'){ triggerGSOD('BOOT.VMCFG'); }
    return {ok:true};
  },
  restoreRecycle(idx){
    const item = this.recycle[idx];
    if(!item) return {ok:false, reason:'not found'};
    let path = item.origin.slice(0,-1);
    for(let i=2;i<=path.length;i++){ const seg = path.slice(0,i); if(!this.resolve(seg)) this.mkdir(seg); }
    const parent = this.resolve(item.origin.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'origin gone'};
    let name = item.name;
    while(parent.children[name]) name = name.replace(/(\.[^.]+)?$/, '_RESTORED$1');
    parent.children[name] = item.node;
    this.recycle.splice(idx,1);
    this.notify();
    return {ok:true, name};
  },
  purgeRecycle(idx){ if(idx==null){ this.recycle = []; } else this.recycle.splice(idx,1); this.notify(); return {ok:true}; },
  mkdir(parts){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const name = parts[parts.length-1];
    if(parent.children[name]) return {ok:false, reason:'already exists'};
    parent.children[name] = { type:'dir', children:{} };
    this.notify();
    return {ok:true};
  },
  rename(parts, newName){
    if(!parts || parts.length<2 || !newName) return {ok:false, reason:'invalid'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent) return {ok:false, reason:'parent not found'};
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===parts[parts.length-1].toLowerCase());
    if(!key) return {ok:false, reason:'not found'};
    if(parent.children[key].type==='sys') return {ok:false, reason:'protected system object'};
    if(parent.children[newName] && newName.toLowerCase()!==key.toLowerCase()) return {ok:false, reason:'name already exists'};
    parent.children[newName] = parent.children[key];
    if(newName!==key) delete parent.children[key];
    this.notify();
    return {ok:true};
  },
  clone(node){
    if(node.type==='dir'){ const c={type:'dir',children:{}}; for(const[k,v] of Object.entries(node.children||{})) c.children[k]=this.clone(v); return c; }
    return JSON.parse(JSON.stringify(node));
  },
  copy(srcParts, dstDirParts, newName){
    const src = this.resolve(srcParts);
    if(!src) return {ok:false, reason:'source not found'};
    const dstDir = this.resolve(dstDirParts);
    if(!dstDir || dstDir.type!=='dir') return {ok:false, reason:'destination not a directory'};
    let name = newName || srcParts[srcParts.length-1];
    while(dstDir.children[name]) name = name.replace(/(\.[^.]+)?$/, '_COPY$1');
    dstDir.children[name] = this.clone(src);
    this.notify();
    return {ok:true, name};
  },
  move(srcParts, dstDirParts){
    const src = this.resolve(srcParts);
    if(!src) return {ok:false, reason:'source not found'};
    if(src.type==='sys') return {ok:false, reason:'protected system object'};
    const dstDir = this.resolve(dstDirParts);
    if(!dstDir || dstDir.type!=='dir') return {ok:false, reason:'destination not a directory'};
    const srcParent = this.resolve(srcParts.slice(0,-1));
    const key = Object.keys(srcParent.children).find(k=>k.toLowerCase()===srcParts[srcParts.length-1].toLowerCase());
    let name = key;
    while(dstDir.children[name] && this.resolve([...dstDirParts,name])!==src) name = name.replace(/(\.[^.]+)?$/, '_MOVED$1');
    dstDir.children[name] = srcParent.children[key];
    delete srcParent.children[key];
    this.notify();
    return {ok:true, name};
  }
};

/* =========================================================
   RESOURCE GOVERNOR  (real emulation of the 33 MHz / 32M box)

   The stated specs are now a hard budget. Every process (the
   system baseline + each open program window) consumes a real
   slice of emulated RAM and CPU cycles. When demand exceeds the
   33,000,000 cycles/sec ceiling the whole machine time-shares
   and genuinely slows down; when RAM runs out, new programs
   refuse to load. NETLINK's fetches are exempt - that lifting
   is done on the far side of the bridge, not on this hardware.
   ========================================================= */
const APP_MEM = { // KB resident per program
  terminal:512, notepad:640, explorer:1280, netlink:3072, config:640,
  sysinfo:384, paint:2560, mines:512, taskmgr:768, calc:256, clock:512,
  charmap:640, player:1792, solitaire:1280, defrag:1024, findfiles:640,
  basic:768, help:640, recyclebin:384, imgview:1536
};
const APP_CPU = { // idle load as a fraction of the 33 MHz core
  terminal:0.02, notepad:0.02, explorer:0.04, netlink:0.05, config:0.02,
  sysinfo:0.01, paint:0.05, mines:0.03, taskmgr:0.05, calc:0.01, clock:0.03,
  charmap:0.02, player:0.06, solitaire:0.03, defrag:0.04, findfiles:0.02,
  basic:0.02, help:0.01, recyclebin:0.02, imgview:0.02
};
const VMRES = {
  cpuHz: 33e6,
  ramKB: 640 + 32768,          // 33,408 KB = stated 640K base + 32,768K extended
  pageKB: 16,                  // allocation granularity -> 2088 pages
  nPages: 0,
  _pages: null,                // page table: index -> owner string | null
  sysProcs: [
    // trimmed so an idle box sits at ~8% CPU, like a real quiet 486
    {pid:1,  name:'KERNEL.VMSY',    mem:2560, cpu:0.030, sys:true},
    {pid:4,  name:'DESKTOP.VMXE',   mem:1536, cpu:0.015, sys:true},
    {pid:7,  name:'WINMGR.VMSY',    mem:1024, cpu:0.010, sys:true},
    {pid:11, name:'NETBRIDGE.VMSY', mem:1024, cpu:0.005, sys:true},
    {pid:14, name:'PHOSPHOR.VMDRV', mem:1280, cpu:0.020, sys:true},
  ],
  procs: new Map(),            // winid -> {name, mem, cpuIdle, active, heap}
  extraActive: 0,              // non-window load (e.g. screensaver)
  _pending: null,
  govTimer: null,

  /* -------- page allocator (first-fit, contiguous => real fragmentation) -------- */
  initMem(){
    this.nPages=Math.floor(this.ramKB/this.pageKB);
    this._pages=new Array(this.nPages).fill(null);
    this.procs.clear();
    // the resident kernel image occupies one contiguous block at the bottom
    const sysKB=this.sysProcs.reduce((a,p)=>a+p.mem,0);
    this._alloc('SYS#base', sysKB);
  },
  _ensure(){ if(!this._pages) this.initMem(); },
  _pagesFor(kb){ return Math.max(1, Math.ceil(kb/this.pageKB)); },
  _alloc(owner, kb){
    this._ensure();
    const need=this._pagesFor(kb);
    let run=0, start=-1;
    for(let i=0;i<this.nPages;i++){
      if(this._pages[i]===null){
        if(run===0) start=i;
        if(++run===need){ for(let j=start;j<start+need;j++) this._pages[j]=owner; return {ok:true,base:start,count:need}; }
      } else run=0;
    }
    return {ok:false};        // no single contiguous run big enough (fragmentation/OOM)
  },
  _freeOwner(prefix){ this._ensure(); for(let i=0;i<this.nPages;i++){ const o=this._pages[i]; if(o!==null && (o===prefix || o.startsWith(prefix))) this._pages[i]=null; } },
  usedKB(){ this._ensure(); let n=0; for(let i=0;i<this.nPages;i++) if(this._pages[i]!==null) n++; return n*this.pageKB; },
  freeKB(){ this._ensure(); return this.nPages*this.pageKB - this.usedKB(); },
  largestFreeKB(){ this._ensure(); let run=0,best=0; for(let i=0;i<this.nPages;i++){ if(this._pages[i]===null){ if(++run>best) best=run; } else run=0; } return best*this.pageKB; },
  fragKB(){ return this.freeKB()-this.largestFreeKB(); },   // free memory that is unusable in one block
  // fragmentation-aware: a request must fit in ONE contiguous run, not just total free
  canAlloc(kb){ return this.largestFreeKB() >= kb; },

  /* -------- CPU model: a 486 has NO frequency scaling. It runs flat-out and
     time-slices, so the SAME work simply takes longer as demand rises. There is
     almost no headroom: contention is felt early, and once oversubscribed the
     box effectively hangs until load drops. -------- */
  demand(){
    let d=this.sysProcs.reduce((a,p)=>a+p.cpu*this.cpuHz,0)+this.extraActive;
    this.procs.forEach(p=>d+=p.cpuIdle+(p.active||0));
    return d;
  },
  load(){ return this.demand()/this.cpuHz; },   // 1.0 == core saturated; >1 == oversubscribed
  speed(){
    const l=this.load();
    if(l<=0.10) return 1;                         // only a near-idle box feels instant
    if(l<1.0)  return Math.max(0.05, 1-(l-0.10)*0.9778);  // stutter starts ~30%, ~12% at saturation
    // oversubscribed: collapses toward a hard lock (~1% by 150% load)
    return Math.max(0.01, 0.12-(l-1.0)*0.22);
  },
  hung(){ return this.load()>=1.5; },            // scheduler cannot keep up -> effectively frozen

  footprint(app){ return APP_MEM[app]||512; },
  cpuIdleFor(app){ return (APP_CPU[app]||0.02)*this.cpuHz; },
  register(winid,name,mem,cpuIdle){ const r=this._alloc(winid+'#base', mem); this.procs.set(winid,{name,mem,cpuIdle,active:0,heap:0}); return r.ok; },
  free(winid){ this._freeOwner(winid+'#'); this.procs.delete(winid); },
  // dynamic heap for a running program (canvas, text buffer, BASIC vars...).
  // Reallocating heap frees the old block first, so churn genuinely fragments RAM.
  setHeap(winid, kb){
    const p=this.procs.get(winid); if(!p) return false;
    this._freeOwner(winid+'#heap'); p.heap=0;
    if(kb<=0) return true;
    const r=this._alloc(winid+'#heap', kb);
    if(r.ok){ p.heap=kb; return true; }
    // could not find a contiguous hole big enough -> real OOM/fragmentation failure
    return false;
  },
  procMem(winid){ const p=this.procs.get(winid); return p?p.mem+(p.heap||0):0; },
  setActive(winid,frac){ const p=this.procs.get(winid); if(p) p.active=(frac||0)*this.cpuHz; },
  startGovernor(){
    if(this.govTimer) clearInterval(this.govTimer);
    this.govTimer=setInterval(()=>{
      const l=this.load();
      document.body.classList.toggle('vm-thrash', l>1.0);   // contended
      document.body.classList.toggle('vm-hang',   l>1.4);   // near-frozen
    }, 700);
  }
};
// real emulated animation pacing: under load we genuinely drop frames
function vmDropFrame(){ const s=VMRES.speed(); return s<1 && Math.random() > s; }
// wall-clock time a fixed amount of virtual work takes at the current speed
function vmScale(ms){ return ms / VMRES.speed(); }

/* =========================================================
   Icons / glyphs
   ========================================================= */
function iconFor(name, type, extra){
  if(extra?.icon) return extra.icon;
  if(type==='dir'){
    const up=name.toUpperCase();
    if(up==='MAIL') return '\u2709';
    if(up==='PROGRAMS') return '\u25A3';
    if(up==='DOWNLOADS') return '\u21E9';
    if(up==='TEMP') return '\u29B0';
    if(up==='DOCS') return '\u25A4';
    if(up==='MUSIC') return '\u266B';
    if(up==='SYSTEM') return '\u2699';
    return '\u25A4';
  }
  if(type==='app') return '\u25A3';
  if(type==='sys') return '\u2699';
  if(type==='img') return '\u25A9';
  if(type==='wav'||type==='mp3') return '\u266A';
  if(type==='vmzip') return '\u25A6';
  if(/\.(vmtxt|vmmd|vmbat|txt|md)$/i.test(name)) return '\u2261';
  if(/\.(png|jpg|jpeg|bmp)$/i.test(name)) return '\u25A9';
  if(/\.(wav|mp3)$/i.test(name)) return '\u266A';
  return '\u2022';
}

/* =========================================================
   Desktop
   ========================================================= */
function getDesktopItems(){
  const items=[];
  const rootList = VFS.ls(['C:'])||[];
  for(const e of rootList){
    if(e.type==='dir' && e.name.toUpperCase()!=='SYSTEM'){
      items.push({name:e.name, icon:iconFor(e.name,'dir'), kind:'folder', path:['C:',e.name]});
    }
  }
  const progs = VFS.ls(['C:','PROGRAMS'])||[];
  for(const e of progs){ if(e.type==='app') items.push({name:e.name, icon:e.icon||'\u25A3', kind:'app', app:e.app}); }
  items.push({name:'RECYCLE.BIN', icon: VFS.recycle.length?'\u2298':'\u2297', kind:'bin'});
  return items;
}
function renderDesktop(){
  const box=$('#icons'); if(!box) return;
  box.innerHTML='';
  for(const it of getDesktopItems()){

/* =========================================================

const WM = {
  wins:new Map(), z:100, active:null,
  open(opts){
    const id='w'+uid();
    const w=el('div','win'); w.dataset.id=id;
    const {title='Untitled',icon='\u25C7',width=520,height=340,x,y,resizable=true,menubar=null,status=''}=opts;
    const cx=x??(60+(WM.wins.size*24)%180), cy=y??(40+(WM.wins.size*22)%160);
    w.style.left=cx+'px'; w.style.top=cy+'px'; w.style.width=width+'px'; w.style.height=height+'px';
    w.innerHTML=`
      <div class="titlebar">
        <span class="t-icon">${esc(icon)}</span>
        <span class="t-title">${esc(title)}</span>
        <span class="t-btns">
          <button data-a="min" title="Minimize">_</button>
          <button data-a="max" title="Maximize">\u25A2</button>
          <button data-a="close" title="Close">\u2715</button>
        </span>
      </div>
      ${menubar?`<div class="menubar">${menubar}</div>`:''}
      <div class="body"></div>
      <div class="statusbar"><span class="s-text">${esc(status)}</span></div>
      ${resizable?'<div class="resize"></div>':''}`;
    $('#windows').appendChild(w);
    const handle={ id, el:w, body:w.querySelector('.body'),
      setTitle(t){ w.querySelector('.t-title').textContent=t; setTaskTitle(id,t); },
      setStatus(t){ w.querySelector('.s-text').textContent=t; },
      close(){ WM.close(id); }, onClose:null,
      setLoad(frac){ VMRES.setActive(id,frac); } };
    WM.wins.set(id,{id,el:w,opts,handle});
    // attach the resource footprint reserved by openApp()
    const _rec=WM.wins.get(id);
    if(VMRES._pending){ _rec.proc=VMRES._pending; VMRES.register(id,_rec.proc.name,_rec.proc.mem,_rec.proc.cpuIdle); VMRES._pending=null; }
    WM.focus(id); WM.wireWindow(id); addTask(id,title,icon); beep(900,0.02);
    return handle;
  },
  wireWindow(id){
    const {el:w}=WM.wins.get(id);
    const tb=w.querySelector('.titlebar');
    w.addEventListener('mousedown',()=>WM.focus(id));
    tb.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const a=b.dataset.a; if(a==='close') WM.close(id); else if(a==='max') WM.toggleMax(id); else if(a==='min') WM.minimize(id); });
    tb.addEventListener('dblclick',e=>{ if(!e.target.closest('button')) WM.toggleMax(id); });
    let dragging=false,sx,sy,ox,oy,lastMove=0;
    tb.addEventListener('mousedown',e=>{ if(e.target.closest('button')) return; if(w.classList.contains('max')) return; dragging=true; sx=e.clientX; sy=e.clientY; ox=parseInt(w.style.left); oy=parseInt(w.style.top); VMRES.setActive(id,0.05); e.preventDefault(); });
    document.addEventListener('mousemove',e=>{ if(!dragging) return;
      // the scheduler can only refresh the window position so often; when the
      // core is busy that budget grows, so dragging visibly stutters.
      const now=Date.now(), budget=16/Math.max(0.05,VMRES.speed());
      w.dataset.snap = e.clientX<8?'L':(e.clientX>window.innerWidth-8?'R':(e.clientY<8?'T':''));
      if(now-lastMove < budget) return; lastMove=now;
      let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy; w.style.left=Math.max(0,nx)+'px'; w.style.top=Math.max(0,ny)+'px'; });
    document.addEventListener('mouseup',()=>{ if(dragging){ VMRES.setActive(id,0); if(w.dataset.snap){ WM.snap(id,w.dataset.snap); } } dragging=false; w.dataset.snap=''; });
    const rz=w.querySelector('.resize');
    if(rz){ let rs=false,rx,ry,rw,rh; rz.addEventListener('mousedown',e=>{ rs=true; rx=e.clientX; ry=e.clientY; rw=w.offsetWidth; rh=w.offsetHeight; e.preventDefault(); }); document.addEventListener('mousemove',e=>{ if(!rs) return; w.style.width=Math.max(220,rw+e.clientX-rx)+'px'; w.style.height=Math.max(140,rh+e.clientY-ry)+'px'; }); document.addEventListener('mouseup',()=>rs=false); }
  },
  snap(id,side){
    const {el:w}=WM.wins.get(id); if(!w) return;
    w.classList.remove('max');
    const H=window.innerHeight-32;
    if(side==='L'){ w.style.left='0px'; w.style.top='0px'; w.style.width=(window.innerWidth/2)+'px'; w.style.height=H+'px'; }
    else if(side==='R'){ w.style.left=(window.innerWidth/2)+'px'; w.style.top='0px'; w.style.width=(window.innerWidth/2)+'px'; w.style.height=H+'px'; }
    else if(side==='T'){ WM.toggleMax(id); }
  },
  focus(id){
    const rec=WM.wins.get(id); if(!rec) return;
    if(rec.el.style.display==='none') rec.el.style.display='';
    WM.z++; rec.el.style.zIndex=WM.z;
    WM.wins.forEach(({el})=>el.classList.add('inactive'));
    rec.el.classList.remove('inactive'); WM.active=id; updateTasks();
  },
  close(id){
    const rec=WM.wins.get(id); if(!rec) return;
    if(rec.handle.onClose){ try{ rec.handle.onClose(); }catch(e){} }
    VMRES.free(id);
    rec.el.remove(); WM.wins.delete(id); removeTask(id); beep(500,0.03,'sawtooth');
    let top=null,tz=-1; WM.wins.forEach(r=>{ const z=+r.el.style.zIndex||0; if(z>tz){ tz=z; top=r.id; } });
    if(top) WM.focus(top); else WM.active=null;
  },
  toggleMax(id){ const rec=WM.wins.get(id); if(rec) rec.el.classList.toggle('max'); },
  minimize(id){ const rec=WM.wins.get(id); if(rec){ rec.el.style.display='none'; updateTasks(); } },
  cascade(){ let i=0; WM.wins.forEach(({el})=>{ el.classList.remove('max'); el.style.left=(40+i*26)+'px'; el.style.top=(30+i*24)+'px'; el.style.display=''; i++; }); },
  tile(){ const arr=[...WM.wins.values()].filter(r=>r.el.style.display!=='none'); const n=arr.length; if(!n) return; const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols); const W=window.innerWidth, H=window.innerHeight-32; arr.forEach((r,i)=>{ const c=i%cols, rr=Math.floor(i/cols); r.el.classList.remove('max'); r.el.style.left=(c*W/cols)+'px'; r.el.style.top=(rr*H/rows)+'px'; r.el.style.width=(W/cols)+'px'; r.el.style.height=(H/rows)+'px'; }); }
};

/* =========================================================
   Downloads capture (host isolation)
   ========================================================= */
function uniqueName(parent, base){
  if(!parent.children[base]) return base;
  const m=base.match(/^(.*?)(?:\((\d+)\))?(\.[^.]+)?$/);
  const stem=m?m[1]:base; const ext=m&&m[3]?m[3]:'';
  let n=1; while(parent.children[`${stem}(${n})${ext}`]) n++;
  return `${stem}(${n})${ext}`;
}
function saveToDownloads(filename,content,opts={}){
  if(!VFS.resolve(['C:','DOWNLOADS'])) VFS.mkdir(['C:','DOWNLOADS']);
  const parent=VFS.resolve(['C:','DOWNLOADS']);
  const name=uniqueName(parent,filename);
  parent.children[name]={type:opts.type||'txt',content,...(opts.extra||{})};
  VFS.notify(); return name;
}
async function interceptedDownload(filename,content,opts={}){
  const name=saveToDownloads(filename,content,opts);
  await showInfo('DOWNLOAD CAPTURED',
`The host bridge intercepted this download.

File   : ${name}
Target : C:\\DOWNLOADS\\${name}
Size   : ${(opts.size||(content?.length||0))} bytes

Files never leave this VM. Open EXPLORER to view.`);
  return name;
}

/* =========================================================
   App launcher  (now enforces the RAM/CPU budget)
   ========================================================= */
const APPS = {};
async function openApp(name,opts){
  const fn=APPS[name];
  if(!fn) return showSecurity('No handler for '+name);
  const mem=VMRES.footprint(name);
  if(!VMRES.canAlloc(mem)){ await showMemoryError(name,mem); return; }
  // reserve the footprint; the window created inside fn() picks it up
  VMRES._pending={name, mem, cpuIdle:VMRES.cpuIdleFor(name)};
  // real emulated load latency: fixed init work / current effective speed.
  // a fresh, idle box loads instantly; a saturated one crawls.
  const initMs = Math.min(60, 12 + mem/64);
  await sleep(Math.min(2500, vmScale(initMs)));
  try{ return await withBusy(async()=>fn(opts)); }
  finally{ VMRES._pending=null; }
}
/* =========================================================
   Real-web helpers  (unique URL per call -> a repeat/back
   request can never become a conditional 304 that drops its
   CORS headers, which was the real "failed to fetch" cause)
   ========================================================= */
async function wikiSummary(topic){
  const clean=topic.trim().replace(/\s+/g,'_');
  const bust=()=>'https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(clean)+'?redirect=true&_='+Date.now()+Math.random().toString(36).slice(2);
  let lastErr;
  for(let attempt=0;attempt<2;attempt++){
    try{
      const r=await fetch(bust(),{cache:'no-store',mode:'cors',headers:{'accept':'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('fetch failed');
}
async function ddgSearch(q){
  const fallback=[{title:'Wikipedia article: '+q,href:'https://en.wikipedia.org/wiki/'+encodeURIComponent(q.replace(/\s+/g,'_')),snippet:'Open direct Wikipedia article for \u201C'+q+'\u201D.'}];
  const u='https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1&_='+Date.now()+Math.random().toString(36).slice(2);
  let j;
  try{
    const r=await fetch(u,{cache:'no-store',mode:'cors'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){ return fallback; }
  const results=[];
  if(j.AbstractText && j.AbstractURL) results.push({title:j.Heading||q,href:j.AbstractURL,snippet:j.AbstractText});
  const flatten=arr=>{ for(const it of arr||[]){ if(it.Topics) flatten(it.Topics); else if(it.FirstURL && it.Text) results.push({title:it.Text.split(' - ')[0],href:it.FirstURL,snippet:it.Text}); } };
  flatten(j.RelatedTopics);
  results.push(fallback[0]);
  return results;
}
