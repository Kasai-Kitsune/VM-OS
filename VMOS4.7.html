   Terminal (VMSH)
   ========================================================= */
const CMD_HELP = {
  help:'help [cmd]            Show command list or help for one command',
  cls:'cls | clear           Clear the screen',
  ver:'ver                   Show VMOS version',
  date:'date                  Show current date/time',
  echo:'echo <text>           Print text (supports %VAR%)',
  dir:'dir | ls [path]       List directory',
  cd:'cd [path]             Change directory (.. for parent)',
  pwd:'pwd                   Show current directory',
  tree:'tree [path]           Recursive directory tree',
  cat:'cat | type <file>     Show file contents',
  more:'more                  Pager (usually via a pipe)',
  find:'find "text"           Filter piped lines / search a file',
  edit:'edit <file>           Open file in NOTEPAD.VMXE',
  run:'run <name>            Launch a program or run a .VMBAT script',
  mkdir:'mkdir <name>          Create directory',
  touch:'touch <name>          Create empty text file',
  del:'del | rm <file>       Delete (moves to Recycle Bin)',
  mv:'mv <src> <dst>        Move/rename (cross-folder ok)',
  cp:'cp <src> <dst>        Copy (cross-folder ok)',
  set:'set [NAME=VALUE]      Show or set environment variables',
  path:'path                  Show PATH',
  mem:'mem                   Show emulated memory/CPU usage',
  search:'search <query>        NetLink search (real web)',
  fetch:'fetch <topic>         Fetch encyclopedia article',
  ping:'ping <host>           Ping bridge (simulated)',
  theme:'theme <name>          phosphor|amber|ice|mono|magenta',
  color:'color <name>          Alias of theme',
  basic:'basic                 Launch VMBASIC interpreter',
  saver:'saver                 Lock screen / screensaver',
  shutdown:'shutdown | exit       Power down VM'
};

APPS.terminal=function(opts={}){
  const win=WM.open({title:'C:\\SYSTEM\\VMSH.VMXE',icon:'>_',width:660,height:410,status:'VMSH 4.7 ready'});
  const term=el('div','term'); win.body.appendChild(term);
  const state={cwd:[...VFS.cwd],history:[],hIdx:0};
  const print=(html,cls)=>{ const d=el('div','line'); if(cls) d.className+=' '+cls; d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; };
  const prompt=()=>VFS.join(state.cwd)+'>';
  const banner=()=>{ print(`<span class="bright">VMOS 4.7 - Virtual Machine Shell (VMSH)</span>`); print(`<span class="dim">(c) 1998-2008 Kasai Kitsune Corp. Type 'help' for commands.</span>`); print(''); };

  function expandVars(s){ return s.replace(/%([A-Za-z_][A-Za-z0-9_]*)%/g,(m,n)=>{ const k=Object.keys(VFS.env).find(k=>k.toLowerCase()===n.toLowerCase()); return k?VFS.env[k]:m; }); }

  function showInput(){
    const line=el('div','line'); line.innerHTML=`<span class="prompt">${esc(prompt())}</span> `;
    const input=el('input','in'); input.type='text'; input.spellcheck=false; input.autocomplete='off';
    line.appendChild(input); term.appendChild(line); input.focus(); term.scrollTop=term.scrollHeight;
    input.addEventListener('keydown',async e=>{
      if(e.key==='Enter'){ const cmd=input.value; input.disabled=true; line.innerHTML=`<span class="prompt">${esc(prompt())}</span> ${esc(cmd)}`;
        if(cmd.trim().length){ state.history.push(cmd); state.hIdx=state.history.length; }
        await runLine(cmd); showInput();
      } else if(e.key==='ArrowUp'){ e.preventDefault(); if(state.hIdx>0){ state.hIdx--; input.value=state.history[state.hIdx]||''; } }
      else if(e.key==='ArrowDown'){ e.preventDefault(); if(state.hIdx<state.history.length){ state.hIdx++; input.value=state.history[state.hIdx]||''; } }
      else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); term.innerHTML=''; banner(); showInput(); }
      else if(e.key==='Tab'){ e.preventDefault(); tabComplete(input); }
    });
  }
  function tabComplete(input){
    const val=input.value; const m=val.match(/(\S*)$/); const frag=m?m[1]:'';
    let pool;
    if(/\s/.test(val.trim())){ const list=VFS.ls(state.cwd)||[]; pool=list.map(e=>e.name); } else { pool=Object.keys(CMD_HELP); }
    const hits=pool.filter(x=>x.toLowerCase().startsWith(frag.toLowerCase()));
    if(hits.length===1){ input.value=val.slice(0,val.length-frag.length)+hits[0]; }
    else if(hits.length>1){ print(`<span class="dim">${hits.map(esc).join('   ')}</span>`); }
  }

  async function runStage(cmd,args,stdin,interactive,emit){
    switch(cmd){
      case 'help':
        if(args[0]){ const k=args[0].toLowerCase(); emit(CMD_HELP[k]?CMD_HELP[k]:'No help for '+args[0]); }
        else { emit('COMMANDS'); for(const k of Object.keys(CMD_HELP)) emit('  '+CMD_HELP[k]); }
        return;
      case 'ver': emit('VMOS 4.7.4 build 9 (VMSH 4.7)'); return;
      case 'date': emit(new Date().toString()); return;
      case 'echo': emit(args.join(' ')); return;
      case 'pwd': emit(VFS.join(state.cwd)); return;
      case 'path': emit('PATH='+VFS.env.PATH); return;
      case 'mem': {
        const used=VMRES.usedKB(), tot=VMRES.ramKB, free=VMRES.freeKB(), big=VMRES.largestFreeKB(), frag=VMRES.fragKB(), load=(VMRES.load()*100).toFixed(0);
        emit(`Memory : ${used} K used / ${tot} K total  (${free} K free)`);
        emit(`Blocks : largest free ${big} K  \u00B7  fragmented ${frag} K stranded  \u00B7  page ${VMRES.pageKB} K`);
        emit(`CPU    : VM-486 @ 33 MHz (no freq scaling) - load ${load}%  effective ${(VMRES.speed()*100).toFixed(0)}%${VMRES.hung()?'  [HUNG]':''}`);
        emit(`Procs  : ${VMRES.sysProcs.length+VMRES.procs.size} running`);
        return;
      }
      case 'set':
        if(!args.length){ for(const[k,v] of Object.entries(VFS.env)) emit(`${k}=${v}`); return; }
        { const kv=args.join(' '); const i=kv.indexOf('='); if(i<0){ const k=kv.trim(); const kk=Object.keys(VFS.env).find(x=>x.toLowerCase()===k.toLowerCase()); emit(kk?`${kk}=${VFS.env[kk]}`:`${k} not defined`); return; }
          const name=kv.slice(0,i).trim(), value=kv.slice(i+1); if(!value){ const kk=Object.keys(VFS.env).find(x=>x.toLowerCase()===name.toLowerCase()); if(kk) delete VFS.env[kk]; } else VFS.env[name]=value; return; }
      case 'dir': case 'ls': {
        const p=args[0]?VFS.parsePath(args[0]):state.cwd; const list=VFS.ls(p);
        if(!list){ emit('Path not found: '+(args[0]||'.')); return; }
        emit(' Directory of '+VFS.join(p)); emit('');
        for(const e of list){ const size=e.type==='dir'?'<DIR>      ':String(e.size||(e.content?.length||0)).padStart(9,' '); emit(` ${size}  ${e.name}`); }
        emit(`   ${list.length} item(s)`); return;
      }
      case 'tree': {
        const p=args[0]?VFS.parsePath(args[0]):state.cwd; const root=VFS.resolve(p);
        if(!root||root.type!=='dir'){ emit('Path not found'); return; }
        emit(VFS.join(p));
        const walk=(node,pre)=>{ const ents=Object.entries(node.children||{}); ents.forEach(([n,c],i)=>{ const last=i===ents.length-1; emit(pre+(last?'\u2514\u2500 ':'\u251C\u2500 ')+n); if(c.type==='dir') walk(c,pre+(last?'   ':'\u2502  ')); }); };
        walk(root,''); return;
      }
      case 'cat': case 'type': {
        if(stdin && !args[0]){ emit(stdin); return; }
        if(!args[0]){ emit('Usage: cat <file>'); return; }
        const node=VFS.resolve(VFS.parsePath(args[0]));
        if(!node||node.type==='dir'){ emit('File not found'); return; }
        if(node.type==='sys'){ emit('[SYSTEM FILE - HEADER ONLY]'); emit((node.content||'').split('\n').slice(0,5).join('\n')); return; }
        emit(node.content||''); return;
      }
      case 'more': emit(stdin!=null?stdin:''); return;
      case 'find': {
        const needle=(args.join(' ').replace(/^"|"$/g,''))||'';
        let hay = stdin!=null ? stdin : '';
        if(stdin==null && args.length>1){ const node=VFS.resolve(VFS.parsePath(args[args.length-1])); hay=node&&node.content||''; }
        const lines=hay.split('\n').filter(l=>l.toLowerCase().includes(needle.toLowerCase()));
        emit(lines.join('\n')); return;
      }
      default: emit('__NONTEXT__'); return;
    }
  }

  async function runLine(raw){
    raw=expandVars(raw.trim()); if(!raw) return;
    let redir=null; const rm=raw.match(/\s(>>?)\s*(\S+)\s*$/);
    if(rm){ redir={mode:rm[1],file:rm[2]}; raw=raw.slice(0,rm.index).trim(); }
    const stages=raw.split('|').map(s=>s.trim()).filter(Boolean);
    const single = stages.length===1 && !redir;
    if(single){
      const parts=raw.split(/\s+/); const cmd=(parts[0]||'').toLowerCase(); const args=parts.slice(1);
      if(await interactiveCommand(cmd,args)) return;
    }
    let pipeIn=null; let out='';
    for(let i=0;i<stages.length;i++){
      const parts=stages[i].split(/\s+/); const cmd=(parts[0]||'').toLowerCase(); const args=parts.slice(1);
      const buf=[]; await runStage(cmd,args,pipeIn,false,t=>buf.push(t));
      if(buf.length===1 && buf[0]==='__NONTEXT__'){ if(!(await interactiveCommand(cmd,args))) print(`<span class="err">Unknown command: ${esc(cmd)}</span>. Type <span class="bright">help</span>.`); return; }
      out=buf.join('\n'); pipeIn=out;
    }
    if(redir){
      const p=/[\\\/]/.test(redir.file)?VFS.parsePath(redir.file):[...state.cwd,redir.file];
      const existing=VFS.resolve(p); const prev=(redir.mode==='>>'&&existing&&existing.content)?existing.content+'\n':'';
      if(!/\.(vmtxt|vmmd|txt|md|vmbat)$/i.test(redir.file)){ await showSecurity('Redirection target must be a writable text file (.VMTXT/.VMMD/.VMBAT).'); return; }
      const r=VFS.write(p,prev+out,{type:'txt'}); if(!r.ok){ print(`<span class="err">${esc(r.reason)}</span>`); } else print(`<span class="dim">wrote ${out.split('\n').length} line(s) to ${esc(redir.file)}</span>`);
    } else { out.split('\n').forEach(l=>print(esc(l))); }
  }

  async function interactiveCommand(cmd,args){
    switch(cmd){
      case '': return true;
      case 'cls': case 'clear': term.innerHTML=''; banner(); return true;
      case 'cd': {
        if(!args[0]){ print(esc(VFS.join(state.cwd))); return true; }
        if(args[0]==='..'){ if(state.cwd.length>1) state.cwd.pop(); return true; }
        const p=VFS.parsePath(args[0]); const node=VFS.resolve(p);
        if(!node||node.type!=='dir'){ print(`<span class="err">Directory not found: ${esc(args[0])}</span>`); return true; }
        state.cwd=p; return true;
      }
      case 'edit': { if(!args[0]){ print(`<span class="err">Usage: edit <file></span>`); return true; } openApp('notepad',{path:VFS.parsePath(args[0])}); return true; }
      case 'run': {
        if(!args[0]){ print(`<span class="err">Usage: run <name></span>`); return true; }
        if(/\.vmbat$/i.test(args[0])){ await runBatch(VFS.parsePath(args[0])); return true; }
        const name=args[0].toUpperCase(); const list=VFS.ls(['C:','PROGRAMS'])||[]; const found=list.find(e=>e.name.toUpperCase()===name);
        if(!found||found.type!=='app'){ await showSecurity(`Executable not recognized: ${name}`); return true; }
        openApp(found.app); return true;
      }
      case 'mkdir': { if(!args[0]){ print(`<span class="err">Usage: mkdir <name></span>`); return true; } const r=VFS.mkdir([...state.cwd,args[0]]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); return true; }
      case 'touch': { if(!args[0]){ print(`<span class="err">Usage: touch <name></span>`); return true; } const r=VFS.write([...state.cwd,args[0]],'',{type:'txt'}); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); return true; }
      case 'del': case 'rm': {
        if(!args[0]){ print(`<span class="err">Usage: del <file></span>`); return true; }
        const p=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]]; const node=VFS.resolve(p);
        if(!node){ print(`<span class="err">Not found.</span>`); return true; }
        if(node.type==='dir'&&Object.keys(node.children||{}).length){ print(`<span class="err">Directory not empty.</span>`); return true; }
        const r=VFS.remove(p); if(!r.ok) await showSecurity(r.reason); else print(`<span class="dim">deleted (to Recycle Bin): ${esc(args[0])}</span>`); return true;
      }
      case 'mv': {
        if(args.length<2){ print(`<span class="err">Usage: mv <src> <dst></span>`); return true; }
        const srcP=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]];
        const dstNode=VFS.resolve(/[\\\/]/.test(args[1])?VFS.parsePath(args[1]):[...state.cwd,args[1]]);
        if(dstNode&&dstNode.type==='dir'){ const r=VFS.move(srcP,/[\\\/]/.test(args[1])?VFS.parsePath(args[1]):[...state.cwd,args[1]]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        else { const r=VFS.rename(srcP,args[1]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        return true;
      }
      case 'cp': {
        if(args.length<2){ print(`<span class="err">Usage: cp <src> <dst></span>`); return true; }
        const srcP=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]];
        const dstArg=args[1]; const dstFull=/[\\\/]/.test(dstArg)?VFS.parsePath(dstArg):[...state.cwd,dstArg];
        const dstNode=VFS.resolve(dstFull);
        if(dstNode&&dstNode.type==='dir'){ const r=VFS.copy(srcP,dstFull); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        else { const r=VFS.copy(srcP,dstFull.slice(0,-1),dstFull[dstFull.length-1]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        return true;
      }
      case 'search': {
        const q=args.join(' '); if(!q){ print(`<span class="err">Usage: search <query></span>`); return true; }
        print(`<span class="dim">[bridge] querying external index for: ${esc(q)}\u2026</span>`);
        await withBusy(async()=>{ try{ const res=await ddgSearch(q); if(!res.length){ print(`<span class="warn">No results.</span>`); return; }
          for(const r of res.slice(0,8)){ print(`  <a data-fetch="${esc(r.href)}">${esc(r.title)}</a>`); if(r.snippet) print(`   <span class="dim">${esc(r.snippet)}</span>`); } }
          catch(e){ print(`<span class="err">[bridge] signal lost: ${esc(e.message||e)}</span>`); } });
        return true;
      }
      case 'fetch': {
        const q=args.join(' '); if(!q){ print(`<span class="err">Usage: fetch <topic></span>`); return true; }
        await withBusy(async()=>{ try{ const s=await wikiSummary(q); if(!s){ print(`<span class="warn">No article.</span>`); return; }
          print(`<span class="bright">${esc(s.title)}</span>`); print(esc(s.extract||'')); print(`<span class="dim">source: ${esc(s.content_urls?.desktop?.page||'')}</span>`); }
          catch(e){ print(`<span class="err">[bridge] fetch failed: ${esc(e.message||e)}</span>`); } });
        return true;
      }
      case 'ping': { const host=args[0]||'bridge.local'; for(let i=0;i<4;i++){ await sleep(280); const ms=Math.floor(20+Math.random()*80); print(`Reply from ${esc(host)}: bytes=32 time=${ms}ms ttl=64`); } return true; }
      case 'theme': case 'color': {
        const t=(args[0]||'').toLowerCase(); if(!['phosphor','amber','ice','mono','magenta'].includes(t)){ print(`<span class="err">Usage: ${cmd} <phosphor|amber|ice|mono|magenta></span>`); return true; }
        setTheme(t); print(`<span class="dim">theme set to ${esc(t)}</span>`); return true;
      }
      case 'basic': openApp('basic'); return true;
      case 'saver': startSaver(); return true;
      case 'shutdown': case 'exit': doShutdown(); return true;
      case 'sudo': await showSecurity('This VM has no privilege ladder. Command refused.'); return true;
      case 'format': case 'rm-rf': await showSecurity('Destructive host command intercepted. Denied.'); return true;
    }
    if(/\.vmbat$/i.test(cmd)){ const p=/[\\\/]/.test(cmd)?VFS.parsePath(cmd):[...state.cwd,cmd]; if(VFS.resolve(p)){ await runBatch(p); return true; } }
    return false;
  }

  async function runBatch(parts){
    const node=VFS.resolve(parts);
    if(!node||node.type==='dir'){ print(`<span class="err">Batch file not found.</span>`); return; }
    print(`<span class="dim">[batch] ${esc(VFS.join(parts))}</span>`);
    const lines=(node.content||'').split('\n');
    for(let ln of lines){ ln=ln.trim(); if(!ln||ln.startsWith('::')||ln.toUpperCase().startsWith('REM ')) continue; if(/^echo\s+off$/i.test(ln)) continue; print(`<span class="prompt">${esc(prompt())}</span> ${esc(ln)}`); await runLine(ln); }
  }

  term.addEventListener('click',e=>{ const a=e.target.closest('a[data-fetch]'); if(!a) return; e.preventDefault(); openApp('netlink',{url:a.dataset.fetch}); });
  banner();
  if(opts.batch) runBatch(opts.batch).then(showInput); else showInput();
};

/* =========================================================
   Notepad
   ========================================================= */
APPS.notepad=function(opts={}){
  const path=opts.path||null;
  const title=path?'NOTEPAD - '+VFS.join(path):'NOTEPAD - untitled.VMTXT';
  const menubar=`<span class="mi" data-a="save">File &gt; Save</span><span class="mi" data-a="saveas">Save As\u2026</span><span class="mi" data-a="export">Export to Downloads</span>`;
  const win=WM.open({title,icon:'\u2261',width:520,height:360,menubar,status:'ready'});
  const ta=el('textarea','pad'); ta.spellcheck=false; let curPath=path;
  if(curPath){ const node=VFS.resolve(curPath); if(node&&node.type!=='dir'){ ta.value=(node.type==='img'||node.type==='wav'||node.type==='mp3')?'[binary object - open in its viewer]':(node.content||''); } else ta.value=''; }
  win.body.appendChild(ta); let dirty=false, lastVal=ta.value;
  // the text buffer is real heap (1 byte/char). Reserve it up front...
  VMRES.setHeap(win.id, Math.max(1,Math.ceil(lastVal.length/1024)));
  ta.addEventListener('input',()=>{
    const kb=Math.max(1,Math.ceil(ta.value.length/1024));
    if(!VMRES.setHeap(win.id, kb)){ ta.value=lastVal; showMemoryError('NOTEPAD', kb); return; }  // buffer can't grow
    lastVal=ta.value; dirty=true; win.setStatus('modified \u00B7 '+kb+' K');
  });
  const mb=win.body.parentElement.querySelector('.menubar');
  if(mb) mb.addEventListener('click',async e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='save'){ if(!curPath) return doSaveAs(); const r=VFS.write(curPath,ta.value); win.setStatus(r.ok?'saved':'error'); if(!r.ok) await showSecurity(r.reason); else dirty=false; }
    else if(a==='saveas') doSaveAs();
    else if(a==='export'){ const base=curPath?curPath[curPath.length-1]:'untitled.VMTXT'; const name=base.replace(/\.VMTXT$/i,'.txt').replace(/\.VMMD$/i,'.md'); const saved=await interceptedDownload(name,ta.value,{type:'txt',size:ta.value.length}); win.setStatus('exported: C:\\DOWNLOADS\\'+saved); }
  });
  async function doSaveAs(){
    const name=await promptModal('Save As','Enter filename (.VMTXT, .VMMD or .VMBAT):',(curPath?curPath[curPath.length-1]:'untitled.VMTXT'));
    if(!name) return;
    if(!/\.(vmtxt|vmmd|vmbat)$/i.test(name)){ await showSecurity('Only .VMTXT, .VMMD and .VMBAT are writable inside this VM.'); return; }
    const dest=[...VFS.cwd,name]; const r=VFS.write(dest,ta.value,{type:'txt'}); if(!r.ok){ await showSecurity(r.reason); return; }
    curPath=dest; win.setTitle('NOTEPAD - '+VFS.join(curPath)); win.setStatus('saved: '+name); dirty=false;
  }
};

/* -------- Image viewer -------- */
APPS.imgview=function(opts={}){
  const path=opts.path; if(!path){ showInfo('IMAGE VIEWER','No image specified.'); return; }
  const node=VFS.resolve(path); if(!node||node.type!=='img'){ showInfo('IMAGE VIEWER','Not a viewable image.'); return; }
  const win=WM.open({title:'IMAGE - '+VFS.join(path),icon:'\u25A9',width:520,height:420,status:node.width?`${node.width}x${node.height}`:''});
  const wrap=el('div','imgv'); const img=new Image(); img.src=node.content; wrap.appendChild(img); win.body.appendChild(wrap);
};
/* =========================================================
   Explorer
   ========================================================= */
APPS.explorer=function(opts={}){
  const startPath=opts.path||['C:'];
  const win=WM.open({title:'EXPLORER - '+VFS.join(startPath),icon:'\u25A4',width:660,height:440,status:''});
  const root=el('div','expl');
  root.innerHTML=`<div class="side"></div>
    <div class="main">
      <div class="nav">
        <button data-a="back" title="Back">\u25C4</button>
        <button data-a="fwd" title="Forward">\u25BA</button>
        <button data-a="up" title="Up">\u25B2</button>
        <input class="addr" spellcheck="false">
        <button data-a="go">GO</button>
      </div>
      <div class="files" tabindex="0"></div>
    </div>`;
  win.body.appendChild(root);
  const sideEl=root.querySelector('.side'), filesEl=root.querySelector('.files'), addr=root.querySelector('.addr');
  const navBar=root.querySelector('.nav');
  let cur=startPath, selected=null;
  const back=[], fwd=[];

  function renderSide(){
    sideEl.innerHTML='';
    (function walk(node,path,depth){
      if(node.type!=='dir') return;
      const it=el('div','tn'); it.style.paddingLeft=(6+depth*10)+'px';
      it.innerHTML=`<span class="ch">\u25B8</span>${esc(path[path.length-1])}`;
      if(JSON.stringify(path)===JSON.stringify(cur)) it.classList.add('sel');
      it.addEventListener('click',()=>navigate(path));
      sideEl.appendChild(it);
      for(const[n,c] of Object.entries(node.children||{})) if(c.type==='dir') walk(c,[...path,n],depth+1);
    })(VFS.root,['C:'],0);
  }
  function navigate(path,noHist){
    if(!VFS.resolve(path)) path=['C:'];
    if(!noHist && JSON.stringify(path)!==JSON.stringify(cur)){ back.push(cur); fwd.length=0; }
    cur=path; selected=null; addr.value=VFS.join(cur);
    renderSide(); renderFiles(); win.setTitle('EXPLORER - '+VFS.join(cur));
    navBar.querySelector('[data-a="back"]').disabled=!back.length;
    navBar.querySelector('[data-a="fwd"]').disabled=!fwd.length;
    navBar.querySelector('[data-a="up"]').disabled=cur.length<=1;
  }
  function openEntry(e){
    beep(1000,0.02);
    if(e.type==='dir') navigate([...cur,e.name]);
    else if(e.type==='app') openApp(e.app);
    else if(e.type==='sys') showSecurity('System object opened read-only in HEX viewer (not installed).');
    else if(e.type==='img') openApp('imgview',{path:[...cur,e.name]});
    else if(e.type==='wav'||e.type==='mp3') openApp('player',{path:[...cur,e.name]});
    else if(e.type==='vmzip') openArchive([...cur,e.name]);
    else openApp('notepad',{path:[...cur,e.name]});
  }
  async function doDelete(name){
    const node=VFS.resolve([...cur,name]); if(!node) return;
    let msg=`Delete <b>${esc(name)}</b>? It will go to the Recycle Bin.`;
    if(node.type==='dir'){ const n=Object.keys(node.children||{}).length; msg=`Delete folder <b>${esc(name)}</b>${n?` and its ${n} item(s)`:''}? (to Recycle Bin)`; }
    const ok=await showModal({title:'Delete',body:msg,buttons:[{label:'Cancel',value:false},{label:'Delete',value:true}]});
    if(!ok) return; const r=VFS.remove([...cur,name]); if(!r.ok) await showSecurity(r.reason);
  }
  async function doRename(name){ const nn=await promptModal('Rename','Enter a new name:',name); if(!nn||nn===name) return; const r=VFS.rename([...cur,name],nn); if(!r.ok) await showSecurity(r.reason); }
  async function doNew(kind){
    let defName=kind==='folder'?'NEW_FOLDER':'NEW_FILE.VMTXT';
    const nn=await promptModal(kind==='folder'?'New Folder':'New Text File','Enter a name:',defName); if(!nn) return;
    if(kind==='folder'){ const r=VFS.mkdir([...cur,nn]); if(!r.ok) await showSecurity(r.reason); }
    else { if(!/\.(vmtxt|vmmd|vmbat)$/i.test(nn)){ await showSecurity('Only .VMTXT/.VMMD/.VMBAT allowed for text files.'); return; } const r=VFS.write([...cur,nn],'',{type:'txt'}); if(!r.ok) await showSecurity(r.reason); }
  }
  function doPaste(){
    if(!CLIP.path) return;
    if(CLIP.mode==='copy'){ const r=VFS.copy(CLIP.path,cur); if(!r.ok) showSecurity(r.reason); }
    else if(CLIP.mode==='cut'){ const r=VFS.move(CLIP.path,cur); if(!r.ok) showSecurity(r.reason); else { CLIP.path=null; CLIP.mode=null; } }
  }
  async function makeArchive(name){
    const node=VFS.resolve([...cur,name]);
    const arcName=name.replace(/\.[^.]+$/,'')+'.VMZIP';
    const r=VFS.write([...cur,arcName],'[compressed archive]',{type:'vmzip',extra:{payload:VFS.clone(node),origName:name}});
    if(!r.ok) await showSecurity(r.reason); else notify('Archiver',`Compressed \u2192 ${arcName}`);
  }
  function openArchive(parts){
    const node=VFS.resolve(parts);
    showModal({title:'VMZIP ARCHIVE',body:`<pre style="margin:0;white-space:pre-wrap;font-family:var(--font-mono)">Archive : ${esc(parts[parts.length-1])}\nContains: ${esc(node.origName||'?')}\n\nExtract into the current folder?</pre>`,buttons:[{label:'Close',value:false},{label:'Extract',value:true}]}).then(ok=>{ if(ok&&node.payload){ const nm=(node.origName||'extracted'); const dest=VFS.resolve(cur); let use=nm; while(dest.children[use]) use=use.replace(/(\.[^.]+)?$/,'_X$1'); dest.children[use]=VFS.clone(node.payload); VFS.notify(); } });
  }

  function renderFiles(){
    filesEl.innerHTML=''; const list=VFS.ls(cur)||[]; win.setStatus(`${list.length} item(s)`);
    for(const e of list){
      const f=el('div','f'); f.dataset.name=e.name;
      if(CLIP.mode==='cut'&&CLIP.path&&JSON.stringify(CLIP.path)===JSON.stringify([...cur,e.name])) f.classList.add('cut');
      f.innerHTML=`<div class="g">${esc(iconFor(e.name,e.type,e))}</div><div>${esc(e.name)}</div>`;
      f.draggable=(e.type!=='sys');
      f.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/vmos-path',JSON.stringify([...cur,e.name])); });
      f.addEventListener('dragover',ev=>{ if(e.type==='dir'){ ev.preventDefault(); f.classList.add('sel'); } });
      f.addEventListener('dragleave',()=>f.classList.remove('sel'));
      f.addEventListener('drop',ev=>{ if(e.type!=='dir') return; ev.preventDefault(); ev.stopPropagation(); const s=ev.dataTransfer.getData('text/vmos-path'); if(!s) return; const r=VFS.move(JSON.parse(s),[...cur,e.name]); if(!r.ok) showSecurity(r.reason); });
      f.addEventListener('click',()=>{ $$('.expl .f.sel',root).forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); selected=e.name; });
      f.addEventListener('dblclick',()=>openEntry(e));
      f.addEventListener('contextmenu',ev=>{
        ev.preventDefault(); ev.stopPropagation();
        $$('.expl .f.sel',root).forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); selected=e.name;
        const items=[{label:'Open',glyph:'\u25B8',act:()=>openEntry(e)}];
        if(e.type!=='dir'&&e.type!=='app') items.push({label:'Open With\u2026',glyph:'\u2318',act:()=>openWith([...cur,e.name])});
        if(e.type!=='dir'&&e.type!=='sys'&&e.type!=='app'&&e.type!=='img') items.push({label:'Edit in Notepad',glyph:'\u2261',act:()=>openApp('notepad',{path:[...cur,e.name]})});
        items.push({sep:true});
        items.push({label:'Cut',glyph:'\u2702',disabled:e.type==='sys',act:()=>{ CLIP.path=[...cur,e.name]; CLIP.mode='cut'; renderFiles(); }});
        items.push({label:'Copy',glyph:'\u29C9',disabled:e.type==='sys',act:()=>{ CLIP.path=[...cur,e.name]; CLIP.mode='copy'; }});
        items.push({label:'Compress to .VMZIP',glyph:'\u25A6',disabled:e.type==='sys',act:()=>makeArchive(e.name)});
        if(e.type!=='sys'&&e.type!=='app') items.push({label:'Export to Downloads',glyph:'\u21E9',act:async()=>{ if(e.type==='img') await interceptedDownload(e.name,e.content,{type:'img',extra:{width:e.width,height:e.height},size:(e.content?.length||0)}); else await interceptedDownload(e.name,e.content||'',{type:e.type,size:(e.content||'').length}); }});
        items.push({sep:true});
        items.push({label:'Rename\u2026',glyph:'\u270E',act:()=>doRename(e.name),disabled:e.type==='sys'});
        items.push({label:'Delete',glyph:'\u2715',act:()=>doDelete(e.name),disabled:e.type==='sys'});
        items.push({label:'Properties',glyph:'\u2637',act:()=>showProperties([...cur,e.name])});
        showContextMenu(ev.clientX,ev.clientY,items);
      });
      filesEl.appendChild(f);
    }
  }
  filesEl.addEventListener('contextmenu',ev=>{
    if(ev.target.closest('.f')) return; ev.preventDefault(); ev.stopPropagation();
    showContextMenu(ev.clientX,ev.clientY,[
      {label:'New Folder',glyph:'\u25A4',act:()=>doNew('folder')},
      {label:'New Text File (.VMTXT)',glyph:'\u2261',act:()=>doNew('file')},
      {label:'Paste',glyph:'\u2398',disabled:!CLIP.path,act:doPaste},
      {sep:true},
      {label:'Properties',glyph:'\u2637',act:()=>showProperties(cur)},
      {label:'Refresh',glyph:'\u21BB',act:renderFiles},
    ]);
  });
  filesEl.addEventListener('dragover',ev=>ev.preventDefault());
  filesEl.addEventListener('drop',ev=>{ if(ev.target.closest('.f')) return; ev.preventDefault(); const s=ev.dataTransfer.getData('text/vmos-path'); if(!s) return; const r=VFS.move(JSON.parse(s),cur); if(!r.ok) showSecurity(r.reason); });
  filesEl.addEventListener('keydown',async e=>{
    if(e.key==='Delete'&&selected){ e.preventDefault(); doDelete(selected); }
    else if(e.key==='F2'&&selected){ e.preventDefault(); doRename(selected); }
    else if(e.key==='Enter'&&selected){ e.preventDefault(); const entry=(VFS.ls(cur)||[]).find(x=>x.name===selected); if(entry) openEntry(entry); }
    else if(e.ctrlKey&&e.key==='c'&&selected){ CLIP.path=[...cur,selected]; CLIP.mode='copy'; }
    else if(e.ctrlKey&&e.key==='x'&&selected){ CLIP.path=[...cur,selected]; CLIP.mode='cut'; renderFiles(); }
    else if(e.ctrlKey&&e.key==='v'){ doPaste(); }
  });
  navBar.addEventListener('click',e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='back'){ if(back.length){ fwd.push(cur); navigate(back.pop(),true); } }
    else if(a==='fwd'){ if(fwd.length){ back.push(cur); navigate(fwd.pop(),true); } }
    else if(a==='up'){ if(cur.length>1) navigate(cur.slice(0,-1)); }
    else if(a==='go'){ const p=VFS.parsePath(addr.value); if(VFS.resolve(p)) navigate(p); else showSecurity('Path not found: '+addr.value); }
  });
  addr.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const p=VFS.parsePath(addr.value); if(VFS.resolve(p)) navigate(p); else showSecurity('Path not found: '+addr.value); } });

  const off=VFS.onChange(()=>{ if(!VFS.resolve(cur)) navigate(['C:'],true); else { renderSide(); renderFiles(); } });
  const rec=WM.wins.get(win.id); if(rec) rec.handle.onClose=()=>{ try{ off(); }catch(e){} };
  navigate(cur,true); filesEl.focus();
};

/* -------- Properties / Open With -------- */
function showProperties(parts){
  const node=VFS.resolve(parts); if(!node) return;
  const name=parts[parts.length-1];
  let size = node.type==='dir' ? (()=>{ let n=0; (function w(x){ for(const c of Object.values(x.children||{})){ n++; if(c.type==='dir') w(c); } })(node); return n+' item(s)'; })() : ((node.size||(node.content?.length||0))+' bytes');
  const kind={dir:'Folder',app:'Application',sys:'System object',img:'Image',txt:'Text document',wav:'Audio (WAV)',mp3:'Audio (MP3)',vmzip:'VMZIP archive'}[node.type]||'File';
  showModal({title:'Properties',body:`<pre style="margin:0;white-space:pre-wrap;font-family:var(--font-mono)">Name     : ${esc(name)}
Location : ${esc(VFS.join(parts.slice(0,-1)))}
Type     : ${esc(kind)}
Size     : ${esc(size)}
Attribs  : ${node.type==='sys'?'R H S':'A'}</pre>`});
}
function openWith(parts){
  const opts=[['notepad','Notepad (text)'],['imgview','Image Viewer'],['player','Media Player'],['paint','Paint'],['basic','VMBASIC']];
  const body=`Open <b>${esc(parts[parts.length-1])}</b> with:<br><br>`+opts.map(o=>`<label style="display:block;padding:2px 0;cursor:pointer"><input type="radio" name="ow" value="${o[0]}"> ${esc(o[1])}</label>`).join('');
  showModal({title:'Open With',body,buttons:[{label:'Cancel',value:null},{label:'Open',value:'__ow__'}]}).then(v=>{ if(v!=='__ow__') return; const sel=document.querySelector('input[name="ow"]:checked'); if(!sel) return; openApp(sel.value,{path:parts}); });
}

/* =========================================================
   NetLink
   ========================================================= */
APPS.netlink=function(opts={}){
  const win=WM.open({title:'NETLINK.VMXE - External Signal Browser',icon:'@',width:720,height:480,status:'ready'});
  const root=el('div','net');
  root.innerHTML=`<div class="bar"><button data-a="back">\u25C4</button><button data-a="home">\u2302</button><input type="text" placeholder="Enter query, wiki:topic, or portal:URL"><button data-a="go">GO</button><button data-a="frame">EMBED</button></div><div class="view"></div>`;
  win.body.appendChild(root);
  const bar=root.querySelector('.bar'),view=root.querySelector('.view'),inp=bar.querySelector('input');
  const stack=[];
  function home(){ stack.length=0; view.innerHTML=`<h1>NETLINK</h1><div class="dim">External signal bridge - filtered.</div><br><div><b>Try:</b><br>&nbsp;&bull; <code>cathode ray tube</code> \u2192 encyclopedia<br>&nbsp;&bull; <code>wiki:phosphor screen</code> \u2192 direct article<br>&nbsp;&bull; <code>portal:https://example.com</code> \u2192 embed frame<br>&nbsp;&bull; any free-text search</div><br><div class="dim">Heavy lifting for external signals happens on the far side of the bridge, not on this hardware. The bridge blocks executable payloads and files not on the allow-list. Any "download" is captured into C:\\DOWNLOADS and never leaves the VM.</div>`; win.setTitle('NETLINK.VMXE - home'); }
  async function go(q){
    q=q.trim(); if(!q) return; inp.value=q; win.setStatus('fetching\u2026'); stack.push(q);
    await withBusy(async()=>{
      if(/^portal:/i.test(q)) showFrame(q.replace(/^portal:/i,'').trim());
      else if(/^wiki:/i.test(q)) await showArticle(q.replace(/^wiki:/i,'').trim());
      else if(/^https?:\/\//i.test(q)) showFrame(q);
      else await showSearch(q);
    });
    win.setStatus('ready');
  }
  async function showSearch(q){
    view.innerHTML=`<div class="dim">SEARCHING: ${esc(q)}\u2026</div>`;
    try{ const results=await ddgSearch(q); if(!results.length){ view.innerHTML=`<div class="warn">No results.</div>`; return; }
      view.innerHTML=`<h2>results for \u201C${esc(q)}\u201D</h2>`;
      for(const r of results.slice(0,10)){ const div=el('div','result'); div.innerHTML=`<div><a data-href="${esc(r.href)}">${esc(r.title)}</a></div><div class="u">${esc(r.href)}</div><div>${esc(r.snippet||'')}</div>`; view.appendChild(div); }
      const note=el('div','dim'); note.innerHTML='<br>bridge routed via DuckDuckGo instant answers &middot; encyclopedia via Wikipedia.'; view.appendChild(note);
    }catch(e){ view.innerHTML=`<div class="err">Bridge error: ${esc(e.message||e)}</div>`; }
  }
  async function showArticle(topic){
    view.innerHTML=`<div class="dim">FETCHING article: ${esc(topic)}\u2026</div>`;
    try{ const s=await wikiSummary(topic); if(!s){ view.innerHTML=`<div class="warn">No article.</div>`; return; }
      view.innerHTML=`<h1>${esc(s.title)}</h1>${s.description?`<div class="dim">${esc(s.description)}</div>`:''}${s.thumbnail?`<img src="${esc(s.thumbnail.source)}" style="max-width:220px;border:2px solid var(--fg-dim);image-rendering:auto;margin:8px 0" data-savable="1">`:''}<p>${esc(s.extract||'').split('\n').map(esc).join('<br>')}</p><p class="dim">source: <a data-href="${esc(s.content_urls?.desktop?.page||'')}">${esc(s.content_urls?.desktop?.page||'')}</a></p><p><button data-savearticle="1" style="background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:4px 10px;cursor:pointer;font-family:var(--font-ui);font-size:16px">SAVE ARTICLE TO C:\\DOWNLOADS</button></p>`;
      win.setTitle('NETLINK.VMXE - '+s.title);
      const btn=view.querySelector('[data-savearticle]');
      if(btn) btn.addEventListener('click',async()=>{ const filename=(s.title||'article').replace(/[^\w\-]+/g,'_')+'.VMTXT'; const content=`# ${s.title}\n\n${s.description||''}\n\n${s.extract||''}\n\nSource: ${s.content_urls?.desktop?.page||''}\n`; await interceptedDownload(filename,content,{type:'txt',size:content.length}); });
      const th=view.querySelector('img[data-savable]');
      if(th){ th.style.cursor='context-menu'; th.addEventListener('contextmenu',ev=>{ ev.preventDefault(); showContextMenu(ev.clientX,ev.clientY,[{label:'Save image to C:\\DOWNLOADS',glyph:'\u21E9',act:async()=>{ try{ const r=await fetch(th.src,{cache:'no-store'}); const blob=await r.blob(); const dataUrl=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob); }); const name=(s.title||'image').replace(/[^\w\-]+/g,'_')+'.png'; await interceptedDownload(name,dataUrl,{type:'img',extra:{width:th.naturalWidth,height:th.naturalHeight},size:blob.size}); }catch(err){ await showSecurity('Bridge could not capture image: '+err.message); } }}]); }); }
    }catch(e){ view.innerHTML=`<div class="err">Bridge error: ${esc(e.message||e)}</div>`; }
  }
  function showFrame(url){ view.innerHTML=''; view.style.padding='0'; const f=el('iframe'); f.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin'); f.src=url; f.addEventListener('load',()=>win.setStatus('frame loaded - '+url)); f.addEventListener('error',()=>showSecurity('Frame refused by host at '+url)); view.appendChild(f); win.setTitle('NETLINK.VMXE - '+url); }
  bar.addEventListener('click',e=>{ const a=e.target.dataset.a;
    if(a==='go') go(inp.value);
    else if(a==='home'){ view.style.padding='10px'; home(); }
    else if(a==='back'){ view.style.padding='10px'; stack.pop(); const prev=stack.pop(); if(prev) go(prev); else home(); }
    else if(a==='frame'){ const q=inp.value.trim(); if(/^https?:/i.test(q)) showFrame(q); else showFrame('https://duckduckgo.com/?q='+encodeURIComponent(q)); }
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(inp.value); });
  view.addEventListener('click',e=>{ const a=e.target.closest('a[data-href]'); if(!a) return; e.preventDefault(); go(a.dataset.href); });
  view.style.padding='10px';
  if(opts.url) go(opts.url); else if(opts.query) go(opts.query); else home();
};

function setTheme(t){ if(t==='phosphor') document.body.removeAttribute('data-theme'); else document.body.dataset.theme=t; beep(1200,0.03); }
function setWallpaper(w){

  };

/* -------- Paint -------- */
APPS.paint=function(opts={}){
  const win=WM.open({title:'PAINT.VMXE',icon:'\u270E',width:520,height:420,status:'left-click draw, right-click erase'});
  const wrap=el('div'); wrap.style.cssText='display:flex;flex-direction:column;height:100%';

  ['#7dff7d','#ffffff','#ffbf5a','#8fd8ff','#ff8bff','#ff5c5c','#000000'].forEach(c=>{ const b=el('div'); b.style.cssText=`width:20px;height:20px;background:${c};cursor:pointer;border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo)`; b.addEventListener('click',()=>state.color=c); toolbar.appendChild(b); });
  const mkBtn=t=>{ const b=el('button',null,t); b.style.cssText='background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:2px 8px;cursor:pointer;font-family:var(--font-ui);font-size:16px'; return b; };
  const clearBtn=mkBtn('CLEAR'),saveBtn=mkBtn('SAVE TO VFS'),dl=mkBtn('EXPORT PNG'); toolbar.appendChild(clearBtn); toolbar.appendChild(saveBtn); toolbar.appendChild(dl);
  const canv=document.createElement('canvas'); canv.width=480; canv.height=280; canv.style.cssText='background:var(--scr);flex:1;cursor:crosshair;image-rendering:pixelated;margin:6px;border:2px solid var(--fg-dim)';
  wrap.appendChild(toolbar); wrap.appendChild(canv); win.body.appendChild(wrap);
  const ctx=canv.getContext('2d'); const state={color:'#7dff7d',down:false,btn:0,last:null};
  // the canvas framebuffer is real heap: width * height * 4 bytes
  const canvasKB=()=>Math.ceil(canv.width*canv.height*4/1024);
  function sizeHeap(){ if(!VMRES.setHeap(win.id, canvasKB())){ showMemoryError('PAINT', canvasKB()); win.setStatus('framebuffer alloc failed'); return false; } win.setStatus(`framebuffer ${canvasKB()} K`); return true; }
  sizeHeap();
  if(opts.path){ const node=VFS.resolve(opts.path); if(node&&node.type==='img'&&node.content){ const img=new Image(); img.onload=()=>{ const w=img.naturalWidth||canv.width, h=img.naturalHeight||canv.height; const need=Math.ceil(w*h*4/1024); if(!VMRES.setHeap(win.id, need)){ showMemoryError('PAINT', need); return; } canv.width=w; canv.height=h; ctx.drawImage(img,0,0); win.setStatus(`framebuffer ${need} K`); }; img.src=node.content; win.setTitle('PAINT - '+VFS.join(opts.path)); } }
  clearBtn.addEventListener('click',()=>ctx.clearRect(0,0,canv.width,canv.height));
  saveBtn.addEventListener('click',async()=>{ const name=await promptModal('Save to VFS','Save as (in current dir):','doodle.png'); if(!name) return; if(!/\.(png|jpg|jpeg|bmp)$/i.test(name)){ await showSecurity('Image files must end in .png/.jpg/.bmp'); return; } const r=VFS.write([...VFS.cwd,name],canv.toDataURL('image/png'),{type:'img',extra:{width:canv.width,height:canv.height}}); if(!r.ok) await showSecurity(r.reason); else win.setStatus('saved to '+VFS.join(VFS.cwd)+'\\'+name); });
  dl.addEventListener('click',async()=>{ const dataUrl=canv.toDataURL('image/png'); const saved=await interceptedDownload('doodle.png',dataUrl,{type:'img',extra:{width:canv.width,height:canv.height},size:dataUrl.length}); win.setStatus('captured: C:\\DOWNLOADS\\'+saved); });
  canv.addEventListener('contextmenu',e=>e.preventDefault());
  const pos=e=>{ const r=canv.getBoundingClientRect(); return [Math.floor((e.clientX-r.left)*(canv.width/r.width)),Math.floor((e.clientY-r.top)*(canv.height/r.height))]; };
  canv.addEventListener('mousedown',e=>{ state.down=true; state.btn=e.button; state.last=pos(e); draw(e,true); });
  canv.addEventListener('mousemove',e=>{ if(state.down) draw(e); });
  window.addEventListener('mouseup',()=>state.down=false);
  function draw(e,single){ const [x,y]=pos(e); ctx.lineWidth=3; ctx.lineCap='round'; if(state.btn===2){ ctx.globalCompositeOperation='destination-out'; ctx.strokeStyle='#000'; } else { ctx.globalCompositeOperation='source-over'; ctx.strokeStyle=state.color; } ctx.beginPath(); if(single||!state.last){ ctx.moveTo(x,y); ctx.lineTo(x+0.1,y+0.1); } else { ctx.moveTo(state.last[0],state.last[1]); ctx.lineTo(x,y); } ctx.stroke(); state.last=[x,y]; }
};

/* -------- Mines -------- */
APPS.mines=function(){
  const W=9,H=9,MINES=10;
  const win=WM.open({title:'MINES.VMXE',icon:'\u2738',width:340,height:400,status:'flags: 0 / '+MINES});
  const wrap=el('div'); wrap.style.cssText='padding:8px;display:flex;flex-direction:column;align-items:center;gap:8px;height:100%;background:var(--panel)';
  const info=el('div',null,'\u2663 mines \u00B7 left reveal \u00B7 right flag'); info.style.color='var(--fg-bright)';
  const board=el('div'); board.style.cssText=`display:grid;grid-template-columns:repeat(${W},26px);grid-auto-rows:26px;gap:1px;background:var(--bevel-lo);border:2px solid var(--fg-dim);box-shadow:inset 2px 2px 0 var(--bevel-hi),inset -2px -2px 0 var(--bevel-lo)`;
  const btn=el('button',null,'NEW GAME'); btn.style.cssText='background:var(--panel-hi);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:4px 10px;cursor:pointer;font-family:var(--font-ui)';
  wrap.appendChild(info); wrap.appendChild(board); wrap.appendChild(btn); win.body.appendChild(wrap);
  let cells=[],flags=0,done=false;
  const neighbors=(x,y)=>{ const r=[]; for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){ if(!dx&&!dy)continue; const nx=x+dx,ny=y+dy; if(nx>=0&&ny>=0&&nx<W&&ny<H) r.push([nx,ny]); } return r; };
  function reset(){ board.innerHTML=''; cells=[]; flags=0; done=false; win.setStatus(`flags: 0 / ${MINES}`);
    const idx=new Set(); while(idx.size<MINES) idx.add(Math.floor(Math.random()*W*H));
    for(let y=0;y<H;y++){ const row=[]; for(let x=0;x<W;x++) row.push({mine:idx.has(y*W+x),open:false,flag:false,adj:0,x,y,el:null}); cells.push(row); }
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ if(cells[y][x].mine) continue; cells[y][x].adj=neighbors(x,y).filter(([nx,ny])=>cells[ny][nx].mine).length; }
    for(let y=0;y<H;y++)for(let x=0;x<W;x++){ const c=cells[y][x]; const b=el('div'); b.style.cssText='display:grid;place-items:center;background:var(--panel-hi);color:var(--fg-bright);cursor:pointer;font-size:16px;box-shadow:inset 1px 1px 0 var(--bevel-hi),inset -1px -1px 0 var(--bevel-lo);user-select:none'; b.addEventListener('click',()=>reveal(x,y)); b.addEventListener('contextmenu',e=>{ e.preventDefault(); flag(x,y); }); c.el=b; board.appendChild(b); }
  }
  function reveal(x,y){ if(done) return; const c=cells[y][x]; if(c.open||c.flag) return; c.open=true;
    if(c.mine){ c.el.textContent='\u2738'; c.el.style.background='var(--danger)'; done=true; for(const row of cells)for(const cc of row) if(cc.mine&&cc!==c) cc.el.textContent='\u2738'; win.setStatus('BOOM. new game?'); beep(120,0.3,'sawtooth'); return; }
    c.el.style.background='var(--panel-lo)'; c.el.style.boxShadow='inset 1px 1px 0 var(--bevel-lo)';
    if(c.adj>0){ c.el.textContent=c.adj; c.el.style.color=['','#7dff7d','#8fd8ff','#ffbf5a','#ff8bff','#ff5c5c','#ffffff','#ffd76b','#b6ffb6'][c.adj]; } else { for(const[nx,ny] of neighbors(x,y)) reveal(nx,ny); }
    let opened=0; for(const row of cells)for(const cc of row) if(cc.open) opened++; if(opened===W*H-MINES){ done=true; win.setStatus('CLEARED!'); beep(1200,0.1); }
  }
  function flag(x,y){ if(done) return; const c=cells[y][x]; if(c.open) return; c.flag=!c.flag; c.el.textContent=c.flag?'\u2691':''; flags+=c.flag?1:-1; win.setStatus(`flags: ${flags} / ${MINES}`); }
  btn.addEventListener('click',reset); reset();
};

/* =========================================================
   Screensaver  (throttles with emulated CPU speed)
   ========================================================= */
let lastActivity=Date.now();
function startSaver(){
  const s=$('#saver'); s.classList.add('on'); const c=s.querySelector('canvas'); c.width=s.clientWidth; c.height=s.clientHeight;
  const ctx=c.getContext('2d'); const cols=Math.floor(c.width/14); const drops=new Array(cols).fill(0).map(()=>Math.floor(Math.random()*c.height/16));
  const glyphs='01#$%*+<>[]{}=abcdefghijk0987654321'; let stop=false;
  VMRES.extraActive=0.15*VMRES.cpuHz;   // the saver itself is a real CPU load
  function frame(){ if(stop) return;
    if(!vmDropFrame()){
      ctx.fillStyle='rgba(0,0,0,0.08)'; ctx.fillRect(0,0,c.width,c.height); ctx.font='16px VT323, monospace'; ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--fg').trim()||'#7dff7d';
      for(let i=0;i<cols;i++){ const g=glyphs[Math.floor(Math.random()*glyphs.length)]; ctx.fillText(g,i*14,drops[i]*16); if(drops[i]*16>c.height&&Math.random()>0.98) drops[i]=0; drops[i]++; }
    }
    requestAnimationFrame(frame);
  }
  frame();
  const wake=()=>{ stop=true; VMRES.extraActive=0; s.classList.remove('on'); document.removeEventListener('keydown',wake); document.removeEventListener('pointerdown',wake); };
  document.addEventListener('keydown',wake); document.addEventListener('pointerdown',wake);
}
function resetIdle(){ lastActivity=Date.now(); }
/* =========================================================
   Task Manager  (reads the REAL resource governor)
   ========================================================= */
APPS.taskmgr=function(){
  const win=WM.open({title:'TASKMGR.VMXE - Processes',icon:'\u25EC',width:540,height:420,status:''});
  const root=el('div','tm'); win.body.appendChild(root);
  let selPid=null;
  function collect(){
    const cap=VMRES.cpuHz;
    const list=[];
    // system baseline
    for(const s of VMRES.sysProcs) list.push({pid:s.pid, name:s.name, sys:true, mem:s.mem, cyc:s.cpu*cap});
    // open program windows
    let pid=100;
    VMRES.procs.forEach((p,winid)=>{ list.push({pid:pid++, name:p.name, mem:p.mem+(p.heap||0), cyc:p.cpuIdle+(p.active||0), winid}); });
    // screensaver / other extra load, if any
    if(VMRES.extraActive>0) list.push({pid:pid++, name:'SCRNSAVE.VMSY', sys:true, mem:256, cyc:VMRES.extraActive});
    return list;
  }
  function render(){
    const cap=VMRES.cpuHz;
    const list=collect();
    const demand=list.reduce((a,p)=>a+p.cyc,0);
    const loadPct=Math.min(100,(demand/cap*100));
    const idleCyc=Math.max(0,cap-demand);
    // small per-process jitter for liveliness, but derived from real cycles
    const rows=list.map(p=>{ const j=1+(Math.random()*0.06-0.03); return {...p, cpu: Math.max(0,(p.cyc/cap*100*j)).toFixed(1)}; });
    rows.push({pid:0, name:'System Idle Process', sys:true, mem:0, cpu:(idleCyc/cap*100).toFixed(1), idle:true});
    const usedKB=VMRES.usedKB(), totKB=VMRES.ramKB, memPct=Math.min(100,usedKB/totKB*100);
    root.innerHTML=`<div class="tm-meters">
        <div class="tm-gauge"><div class="tm-lab">CPU  (VM-486 @ 33 MHz)</div><div class="tm-bar"><i style="width:${loadPct.toFixed(0)}%"></i></div><span>${loadPct.toFixed(0)}%${VMRES.load()>1?` \u00B7 <span class="err">OVER ${(VMRES.load()*100).toFixed(0)}%</span>`:''}</span></div>
        <div class="tm-gauge"><div class="tm-lab">MEM  (${totKB} K)</div><div class="tm-bar"><i style="width:${memPct.toFixed(0)}%"></i></div><span>${usedKB} K / ${totKB} K</span></div>
      </div>
      ${VMRES.load()>1?`<div class="tm-warn">\u26A0 CPU oversubscribed \u2014 system running at ${(VMRES.speed()*100).toFixed(0)}% speed. Close programs to recover.</div>`:''}
      <div class="tm-head"><span>PID</span><span>IMAGE</span><span>CPU</span><span>MEM K</span></div>
      <div class="tm-list"></div>
      <div class="tm-foot"><span class="dim">${rows.length} processes \u00B7 ${VMRES.freeKB()} K free \u00B7 largest block ${VMRES.largestFreeKB()} K${VMRES.fragKB()>0?` \u00B7 ${VMRES.fragKB()} K fragmented`:''}</span><button id="tmEnd">END TASK</button></div>`;
    const lst=root.querySelector('.tm-list');
    for(const p of rows){
      const row=el('div','tm-row'+(p.pid===selPid?' sel':'')+((p.sys||p.idle)?' sys':''));
      row.innerHTML=`<span>${p.pid}</span><span>${esc(p.name)}</span><span>${p.cpu}</span><span>${p.mem||0}</span>`;
      row.addEventListener('click',()=>{ selPid=p.pid; lst.querySelectorAll('.tm-row').forEach(x=>x.classList.remove('sel')); row.classList.add('sel'); });
      row.dataset.winid=p.winid||''; row.dataset.sys=(p.sys||p.idle)?'1':''; lst.appendChild(row);
    }
    root.querySelector('#tmEnd').addEventListener('click',async()=>{
      const row=lst.querySelector('.tm-row.sel'); if(!row) return;
      if(row.dataset.sys){ await showSecurity('System process cannot be terminated by the operator.'); return; }
      const wid=row.dataset.winid;
      if(wid&&wid!==win.id){ WM.close(wid); selPid=null; render(); }   // frees its RAM+CPU
      else if(wid===win.id){ win.close(); }
    });
  }
  render(); const iv=setInterval(render,1200);
  const rec=WM.wins.get(win.id); if(rec) rec.handle.onClose=()=>clearInterval(iv);
};

/* =========================================================
   Calculator
   ========================================================= */
APPS.calc=function(){
  const win=WM.open({title:'CALC.VMXE',icon:'\u00F7',width:250,height:320,status:''});
  const root=el('div','calc'); win.body.appendChild(root);
  root.innerHTML=`<div class="calc-disp">0</div><div class="calc-keys"></div>`;
  const disp=root.querySelector('.calc-disp'), keys=root.querySelector('.calc-keys');
  let acc=null, op=null, fresh=true;
  const layout=['C','\u00B1','%','\u00F7','7','8','9','\u00D7','4','5','6','\u2212','1','2','3','+','0','.','=' ];
  const opmap={'\u00F7':'/','\u00D7':'*','\u2212':'-','+':'+'};
  function setD(v){ disp.textContent=(''+v).slice(0,14); }
  function calc(a,b,o){ a=parseFloat(a); b=parseFloat(b); switch(o){ case '/':return b===0?'ERR':a/b; case '*':return a*b; case '-':return a-b; case '+':return a+b; } return b; }
  layout.forEach(k=>{ const b=el('button',null,k); if(k==='0') b.classList.add('wide'); if(k==='=') b.classList.add('eq'); b.addEventListener('click',()=>{ beep(1000,0.02); press(k); }); keys.appendChild(b); });
  function press(k){
    if(k==='C'){ acc=null; op=null; fresh=true; setD('0'); return; }
    if(k==='\u00B1'){ setD(parseFloat(disp.textContent)*-1); return; }
    if(k==='%'){ setD(parseFloat(disp.textContent)/100); return; }
    if(opmap[k]){ if(op&&!fresh){ acc=calc(acc,disp.textContent,op); setD(acc); } else acc=disp.textContent; op=opmap[k]; fresh=true; return; }
    if(k==='='){ if(op){ const r=calc(acc,disp.textContent,op); setD(r); acc=null; op=null; fresh=true; } return; }
    if(fresh){ setD(k==='.'?'0.':k); fresh=false; } else { if(k==='.'&&disp.textContent.includes('.')) return; setD(disp.textContent+k); }
  }
  win.el.addEventListener('keydown',e=>{ const m={'/':'\u00F7','*':'\u00D7','-':'\u2212','+':'+','Enter':'=','=':'=','Escape':'C'}; if(/[0-9.]/.test(e.key)) press(e.key); else if(m[e.key]) press(m[e.key]); });
};

/* =========================================================
   Clock & Calendar
   ========================================================= */
APPS.clock=function(){
  const win=WM.open({title:'CLOCK.VMXE',icon:'\u25F7',width:320,height:360,status:''});
  const root=el('div','clk'); win.body.appendChild(root);
  root.innerHTML=`<canvas class="clk-face" width="180" height="180"></canvas>
    <div class="clk-digi">--:--:--</div>
    <div class="clk-row"><label><input type="radio" name="cf" value="12"> 12h</label><label><input type="radio" name="cf" value="24"> 24h</label></div>
    <div class="clk-cal"></div>`;
  const cv=root.querySelector('.clk-face'), cx=cv.getContext('2d'), digi=root.querySelector('.clk-digi');
  root.querySelector(`input[name="cf"][value="${SETTINGS.clock24?'24':'12'}"]`).checked=true;
  root.querySelectorAll('input[name="cf"]').forEach(r=>r.addEventListener('change',e=>{ SETTINGS.clock24=e.target.value==='24'; startClock(); draw(); }));
  function draw(){
    const d=new Date(), R=80, C=90;
    cx.clearRect(0,0,180,180);
    const fg=getComputedStyle(document.body).getPropertyValue('--fg').trim()||'#7dff7d';
    const dim=getComputedStyle(document.body).getPropertyValue('--fg-dim').trim()||'#3fa93f';
    cx.strokeStyle=dim; cx.lineWidth=2; cx.beginPath(); cx.arc(C,C,R,0,7); cx.stroke();
    for(let i=0;i<12;i++){ const a=i*Math.PI/6; cx.beginPath(); cx.moveTo(C+Math.sin(a)*(R-6),C-Math.cos(a)*(R-6)); cx.lineTo(C+Math.sin(a)*R,C-Math.cos(a)*R); cx.stroke(); }
    const hand=(ang,len,w,col)=>{ cx.strokeStyle=col; cx.lineWidth=w; cx.beginPath(); cx.moveTo(C,C); cx.lineTo(C+Math.sin(ang)*len,C-Math.cos(ang)*len); cx.stroke(); };
    const h=d.getHours()%12,m=d.getMinutes(),s=d.getSeconds();
    hand((h+m/60)*Math.PI/6,R*0.5,4,fg);
    hand((m+s/60)*Math.PI/30,R*0.72,3,fg);
    hand(s*Math.PI/30,R*0.8,1,'#ff5c5c');
    let hh=d.getHours(),ap=''; if(!SETTINGS.clock24){ ap=hh<12?' AM':' PM'; hh=hh%12||12; }
    digi.textContent=`${String(hh).padStart(2,'0')}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}${ap}`;
  }
  function cal(){
    const d=new Date(), y=d.getFullYear(), mo=d.getMonth(), today=d.getDate();
    const first=new Date(y,mo,1).getDay(), days=new Date(y,mo+1,0).getDate();
    const mn=['January','February','March','April','May','June','July','August','September','October','November','December'][mo];
    let html=`<div class="clk-mn">${mn} ${y}</div><table><tr>${['S','M','T','W','T','F','S'].map(x=>`<th>${x}</th>`).join('')}</tr><tr>`;
    let col=0; for(let i=0;i<first;i++){ html+='<td></td>'; col++; }
    for(let dd=1;dd<=days;dd++){ if(col===7){ html+='</tr><tr>'; col=0; } html+=`<td class="${dd===today?'now':''}">${dd}</td>`; col++; }
    html+='</tr></table>'; root.querySelector('.clk-cal').innerHTML=html;
  }
  draw(); cal();
  // second hand honors emulated speed: under heavy load it visibly stutters
  const iv=setInterval(()=>{ if(!vmDropFrame()) draw(); },1000);
  const rec=WM.wins.get(win.id); if(rec) rec.handle.onClose=()=>clearInterval(iv);
};

/* =========================================================
   Character Map
   ========================================================= */
APPS.charmap=function(){
  const win=WM.open({title:'CHARMAP.VMXE',icon:'\u00A7',width:520,height:400,status:'click a glyph to copy'});
  const root=el('div','cmap'); win.body.appendChild(root);
  root.innerHTML=`<div class="cmap-grid"></div><div class="cmap-out"><input class="cmap-in" readonly value=""><button id="cmCopy">COPY</button></div>`;
  const grid=root.querySelector('.cmap-grid'), inp=root.querySelector('.cmap-in');
  const ranges=[[0x21,0x7E],[0xA1,0xFF],[0x2010,0x206F],[0x2190,0x21FF],[0x2500,0x25FF],[0x2600,0x266F]];
  for(const [a,b] of ranges) for(let c=a;c<=b;c++){ const ch=String.fromCodePoint(c); const cell=el('div','cmap-c',ch); cell.title='U+'+c.toString(16).toUpperCase().padStart(4,'0'); cell.addEventListener('click',()=>{ inp.value+=ch; TEXTCLIP=inp.value; win.setStatus('U+'+c.toString(16).toUpperCase().padStart(4,'0')+' selected'); beep(1100,0.02); }); grid.appendChild(cell); }
  root.querySelector('#cmCopy').addEventListener('click',async()=>{ TEXTCLIP=inp.value; try{ await navigator.clipboard.writeText(inp.value); }catch(e){} win.setStatus('copied '+inp.value.length+' char(s) to clipboard'); notify('Character Map','Copied to clipboard'); });
};

APPS.findfiles=function(opts={}){
  const win=WM.open({title:'FIND.VMXE - Find Files',icon:'\u2315',width:560,height:420,status:''});
  const root=el('div','find'); win.body.appendChild(root);
  root.innerHTML=`<div class="find-bar">Named: <input class="find-name" placeholder="*.vmtxt or partial name"> Containing: <input class="find-text" placeholder="text inside file"> <button id="findGo">FIND</button></div><div class="find-res"></div>`;
  const nameI=root.querySelector('.find-name'), textI=root.querySelector('.find-text'), res=root.querySelector('.find-res');
  if(opts.name) nameI.value=opts.name;
  function run(){
    const nq=nameI.value.trim().toLowerCase().replace(/\*/g,''), tq=textI.value.trim().toLowerCase();
    const found=[];
    (function walk(node,path){ for(const [n,c] of Object.entries(node.children||{})){ const p=[...path,n]; if(c.type==='dir'){ walk(c,p); continue; } const nameOk=!nq||n.toLowerCase().includes(nq); const textOk=!tq||((c.content||'').toLowerCase().includes(tq)); if(nameOk&&textOk) found.push({name:n,path:p,type:c.type}); } })(VFS.root,['C:']);
    win.setStatus(`${found.length} match(es)`);
    res.innerHTML=found.length?'':'<div class="dim" style="padding:8px">No files found.</div>';
    for(const f of found){ const row=el('div','find-row'); row.innerHTML=`<span class="g">${esc(iconFor(f.name,f.type))}</span><span>${esc(f.name)}</span><span class="dim">${esc(VFS.join(f.path.slice(0,-1)))}</span>`; row.addEventListener('dblclick',()=>{ if(f.type==='img') openApp('imgview',{path:f.path}); else if(f.type==='wav'||f.type==='mp3') openApp('player',{path:f.path}); else openApp('notepad',{path:f.path}); }); res.appendChild(row); }
  }
  root.querySelector('#findGo').addEventListener('click',run);
  [nameI,textI].forEach(i=>i.addEventListener('keydown',e=>{ if(e.key==='Enter') run(); }));
  run();
};

/* =========================================================
   Defrag  (genuinely slower when the VM is oversubscribed)
   ========================================================= */
APPS.defrag=function(){
  const win=WM.open({title:'DEFRAG.VMXE - Disk Optimizer',icon:'\u25A6',width:560,height:420,status:'ready'});
  const root=el('div','dfg'); win.body.appendChild(root);
  root.innerHTML=`<div class="dfg-info">Drive C: \u2014 384 MB (simulated)</div><div class="dfg-grid"></div><div class="dfg-legend"><span><i class="b used"></i> used</span><span><i class="b frag"></i> fragmented</span><span><i class="b read"></i> reading</span><span><i class="b free"></i> free</span></div><div class="dfg-bar"><i></i></div><div class="dfg-row"><button id="dfgGo">DEFRAGMENT</button><span class="dfg-stat dim">idle</span></div>`;
  const grid=root.querySelector('.dfg-grid'), bar=root.querySelector('.dfg-bar i'), stat=root.querySelector('.dfg-stat');
  const COLS=32, ROWS=14, TOTAL=COLS*ROWS;
  grid.style.gridTemplateColumns=`repeat(${COLS},1fr)`;
  let blocks=[];
  function seed(){ grid.innerHTML=''; blocks=[]; for(let i=0;i<TOTAL;i++){ const r=Math.random(); const cls=r<0.5?'used':(r<0.72?'frag':'free'); const b=el('i','blk '+cls); grid.appendChild(b); blocks.push(b); } }
  seed();
  let running=false;
  root.querySelector('#dfgGo').addEventListener('click',async()=>{
    if(running) return; running=true; win.setLoad(0.35); // defrag is heavy on the emulated core
    stat.textContent='analyzing...'; beep(600,0.05); await sleep(vmScale(500));
    let write=0;
    for(let i=0;i<TOTAL;i++){
      stat.textContent='optimizing block '+i+' / '+TOTAL;
      const b=blocks[i]; const old=b.className; b.className='blk read'; beep(400+Math.random()*300,0.01);
      await sleep(vmScale(9));   // each block takes longer when the CPU is contended
      if(old.includes('used')||old.includes('frag')){ blocks[write].className='blk used'; if(write!==i) b.className='blk free'; write++; } else { b.className='blk free'; }
      bar.style.width=((i+1)/TOTAL*100)+'%';
    }
    stat.textContent='defragmentation complete'; win.setStatus('optimized'); beep(1200,0.12); notify('Defrag','Drive C: optimized'); win.setLoad(0); running=false;
  });
  const rec=WM.wins.get(win.id); if(rec) rec.handle.onClose=()=>win.setLoad(0);
};

const HELP_TOPICS = {
  'Welcome':`VMOS 4.7 HELP\n=============\nSelect a topic on the left.\n\nVMOS is a self-contained retro shell. Double-click desktop icons to launch programs, right-click for menus, and use the MENU button (bottom-left) for the program list, Task Manager, restart and shut down.`,
  'The Desktop':`THE DESKTOP\n-----------\n* Double-click an icon to open it.\n* Right-click the background for New / Arrange / Refresh / Cascade / Tile / Display Properties.\n* Drag a file from EXPLORER onto a folder icon to move it.\n* The RECYCLE BIN holds deleted files until you empty it.`,
  'Windows':`WINDOWS\n-------\n* Drag a title bar to move; drag the corner to resize.\n* Double-click a title bar (or the \u25A2 button) to maximize.\n* Drag a window to the far left/right edge to snap it to half the screen; to the top edge to maximize.\n* Alt+Tab cycles windows; Alt+F4 closes the active window.\n* Ctrl+\` also cycles windows.`,
  'Memory & CPU':`MEMORY & CPU\n------------\nThis machine really is a 33 MHz core with 640K base + 32,768K\nextended memory, and VMOS enforces it.\n\nCPU - the 486 has no frequency scaling. It always runs flat out\nand time-slices, so the SAME work simply takes LONGER as demand\nrises. There is almost no headroom:\n  * Above ~10% load the scheduler is already busy - dragging a\n    window and animations begin to stutter.\n  * Near saturation the box crawls; once oversubscribed (past\n    ~150%) it effectively HANGS until you close something and\n    an interrupt frees the core.\n\nMEMORY - RAM is allocated in contiguous blocks, so it also\nFRAGMENTS like a real system:\n  * Every program reserves a base block; canvases, text buffers\n    and BASIC variables reserve additional heap that grows and\n    shrinks as you work.\n  * Freeing memory can leave holes. A new request needs ONE\n    contiguous block - so a load can fail with plenty of total\n    free memory if none of the holes is big enough. TASKMGR and\n    'mem' report the largest free block and stranded (fragmented)\n    memory.\n  * When nothing fits, the load is refused with a hard\n    "Insufficient memory" fault - there is no swap file.\n\nTASKMGR shows live load and memory; END TASK frees a program's\nblocks and cycles. NETLINK is the exception: external signals\nare handled on the far side of the bridge, so they do not tax\nthis core.`,
  'Terminal (VMSH)':`TERMINAL\n--------\nType 'help' for the full command list, or 'help <cmd>' for one command.\nSupports:\n  %VAR% expansion and 'set NAME=VALUE'\n  pipes:  dir | find "VMXE"\n  redirection:  dir > list.vmtxt   (>> appends)\n  batch:  run script.vmbat\n  'mem' reports live memory/CPU load.\n  tab-completion for commands and file names.`,
  'Explorer':`EXPLORER\n--------\n* Address bar + Back/Forward/Up navigation.\n* Right-click files for Open/Open With/Cut/Copy/Compress/Export/Rename/Delete/Properties.\n* Ctrl+C / Ctrl+X / Ctrl+V and drag-and-drop are supported.\n* Compress any item to a .VMZIP archive; double-click a .VMZIP to extract.`,
  'Recycle Bin':`RECYCLE BIN\n-----------\nDeleting a file (in Explorer or via 'del' in the terminal) moves it to the Recycle Bin. Open the bin to Restore items to their original folder or to empty it permanently. Emptying cannot be undone.`,
  'Media Player':`MEDIA PLAYER\n------------\nPlays .WAV and .MP3 objects from C:\\MUSIC (rendered through the emulated 8-bit DAC as a phosphor visualizer). Use Play/Stop and the track list. .WAV and .MP3 are on the download allow-list.`,
  'Solitaire':`SOLITAIRE\n---------\nTwo games are included:\n  * KLONDIKE - the classic. Build the four foundations up by suit from Ace to King.\n  * PYRAMID - remove pairs of cards that sum to 13; Kings clear alone.\nUse the switch at the top to change games and DEAL for a new board.`,
  'The Green Screen':`IF THE PICTURE COMES APART\n--------------------------\nThe kernel reads a few things it cannot live without straight off the disk while it runs. If one of those vanishes mid-session, the phosphor timing loses its floor and the machine faults hard. There is no soft recovery from that state - the box will not POST again until it is hard reset. Be careful what you delete out of C:\\SYSTEM.`,
  'About':`ABOUT\n-----\nVMOS 4.7.4 build 9. A retro CRT desktop rendered entirely in the browser sandbox, with an enforced 33 MHz / 32M resource budget. All file operations are simulated; downloads are captured to C:\\DOWNLOADS and never leave the VM.\n\n(c) 1998-2008 Kasai Kitsune Corp.`
};

/* =========================================================
   VMBASIC interpreter
   ========================================================= */
APPS.basic=function(){
  const win=WM.open({title:'BASIC.VMXE - VMBASIC',icon:'\u03BB',width:600,height:440,status:'READY'});
  const root=el('div','basic'); win.body.appendChild(root);
  root.innerHTML=`<div class="bas-out"></div><div class="bas-inline"><span class="prompt">\u25B8</span> <input class="bas-in" spellcheck="false"></div>`;
  const out=root.querySelector('.bas-out'), inp=root.querySelector('.bas-in');
  const program=new Map();
  const vars={};
  const p=(t)=>{ const d=el('div',null,t); out.appendChild(d); out.scrollTop=out.scrollHeight; };
  p('VMBASIC 1.0  -  (c) 1998-2008 Kasai Kitsune Corp.');
  p('Type program lines with numbers (10 PRINT "HI"), then RUN. Try HELP.');
  // program text + variables are real heap; overflowing the pool is a hard error
  function heapKB(){ let b=0; for(const k in vars){ const v=vars[k]; b+=k.length+(typeof v==='string'?v.length:8); } program.forEach((src,ln)=>b+=src.length+6); return Math.max(1,Math.ceil(b/1024)); }
  function commitHeap(){ return VMRES.setHeap(win.id, heapKB()); }
  function setVar(n,v){ const key=n.toUpperCase(); const had=key in vars; const old=vars[key]; vars[key]=v; if(!commitHeap()){ if(had) vars[key]=old; else delete vars[key]; return false; } return true; }
  commitHeap();
  function getVal(tok){
    tok=tok.trim();
    if(/^".*"$/.test(tok)) return tok.slice(1,-1);
    if(/^-?\d+(\.\d+)?$/.test(tok)) return parseFloat(tok);
    try{
      const expr=tok.replace(/[A-Za-z_][A-Za-z0-9_$]*/g,m=>{ const v=vars[m.toUpperCase()]; return v===undefined?'0':(typeof v==='string'?JSON.stringify(v):v); });
      return Function('"use strict";return ('+expr+')')();
    }catch(e){ return vars[tok.toUpperCase()]!==undefined?vars[tok.toUpperCase()]:tok; }
  }
  function runProgram(){
    const lines=[...program.keys()].sort((a,b)=>a-b);
    let i=0, guard=0;
    while(i<lines.length){
      if(guard++>10000){ p('?RUNTIME: too many steps'); break; }
      const ln=lines[i]; const src=program.get(ln);
      const res=execStmt(src);
      if(res && res.goto!=null){ const idx=lines.indexOf(res.goto); if(idx<0){ p('?UNDEF\'D LINE '+res.goto); break; } i=idx; continue; }
      if(res && res.end) break;
      i++;
    }
  }
  function execStmt(src){
    const m=src.match(/^(\w+)\s*(.*)$/); if(!m) return;
    const kw=m[1].toUpperCase(), rest=m[2];
    if(kw==='PRINT'){ const parts=rest.split(';').map(s=>s.trim()).filter(x=>x!==''); p(parts.map(getVal).join(' ')); return; }
    if(kw==='LET'||/^[A-Za-z_]\w*\s*=/.test(src)){ const s=kw==='LET'?rest:src; const eq=s.indexOf('='); const name=s.slice(0,eq).trim(); if(!setVar(name,getVal(s.slice(eq+1)))) p('?OUT OF MEMORY'); return; }
    if(kw==='GOTO'){ return {goto:parseInt(rest)}; }
    if(kw==='IF'){ const mm=rest.match(/^(.*?)\s+THEN\s+(.*)$/i); if(mm){ const cond=getVal(mm[1].replace(/=/g,'==').replace(/<>/g,'!=')); if(cond) return execStmt(mm[2]); } return; }
    if(kw==='REM') return;
    if(kw==='END'||kw==='STOP') return {end:true};
    if(kw==='CLS'){ out.innerHTML=''; return; }
    p('?SYNTAX ERROR: '+src);
  }
  function handle(cmd){
    const raw=cmd.trim(); if(!raw) return;
    const lm=raw.match(/^(\d+)\s?(.*)$/);
    if(lm){ const n=parseInt(lm[1]); if(lm[2].trim()===''){ program.delete(n); commitHeap(); } else { const old=program.get(n); program.set(n,lm[2]); if(!commitHeap()){ if(old===undefined) program.delete(n); else program.set(n,old); p('?OUT OF MEMORY'); } } return; }
    const kw=raw.split(/\s+/)[0].toUpperCase();
    if(kw==='RUN'){ runProgram(); return; }
    if(kw==='LIST'){ [...program.keys()].sort((a,b)=>a-b).forEach(k=>p(k+' '+program.get(k))); return; }
    if(kw==='NEW'){ program.clear(); for(const k in vars) delete vars[k]; p('OK'); return; }
    if(kw==='CLS'){ out.innerHTML=''; return; }
    if(kw==='HELP'){ p('KEYWORDS: PRINT, LET, IF..THEN, GOTO, REM, CLS, END'); p('COMMANDS: RUN, LIST, NEW, CLS, HELP'); p('Example:  10 LET X=5   20 PRINT "X=";X   30 IF X<10 THEN GOTO 40   40 END'); return; }
    execStmt(raw);
  }
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const v=inp.value; p('\u25B8 '+v); handle(v); inp.value=''; } });
  win.el.addEventListener('mousedown',()=>setTimeout(()=>inp.focus(),0));
};

const TRACKS = {
  startup:{ name:'STARTUP.WAV', tempo:150, notes:[0,4,7,12,7,4,0,7,12] },
  phosphor:{ name:'PHOSPHOR.MP3', tempo:120, notes:[0,3,7,10,7,3,5,8,12,8,5,3,0,-2,0,3] },
