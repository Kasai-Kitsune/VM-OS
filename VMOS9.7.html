/* =========================================================
   RESOURCE GOVERNOR  (real emulation of the 33 MHz / 32M box)

   The stated specs are now a hard budget. Every process (the
   system baseline + each open program window) consumes a real
   slice of emulated RAM and CPU cycles. When demand exceeds the
   33,000,000 cycles/sec ceiling the whole machine time-shares
   and genuinely slows down; when RAM runs out, new programs
   refuse to load. NETLINK's fetches are exempt - that lifting
   is done on the far side of the bridge, not on this hardware.
   ========================================================= */
const APP_MEM = { // KB resident per program
  terminal:512, notepad:640, explorer:1280, netlink:3072, config:640,
  sysinfo:384, paint:2560, mines:512, taskmgr:768, calc:256, clock:512,
  charmap:640, player:1792, solitaire:1280, defrag:1024, findfiles:640,
  basic:768, help:640, recyclebin:384, imgview:1536
};
const APP_CPU = { // idle load as a fraction of the 33 MHz core
  terminal:0.02, notepad:0.02, explorer:0.04, netlink:0.05, config:0.02,
  sysinfo:0.01, paint:0.05, mines:0.03, taskmgr:0.05, calc:0.01, clock:0.03,
  charmap:0.02, player:0.06, solitaire:0.03, defrag:0.04, findfiles:0.02,
  basic:0.02, help:0.01, recyclebin:0.02, imgview:0.02
};
const VMRES = {
  cpuHz: 33e6,
  ramKB: 640 + 32768,          // 33,408 KB = stated 640K base + 32,768K extended
  pageKB: 16,                  // allocation granularity -> 2088 pages
  nPages: 0,
  _pages: null,                // page table: index -> owner string | null
  sysProcs: [
    // trimmed so an idle box sits at ~8% CPU, like a real quiet Vulp-33
    {pid:1,  name:'KERNEL.VMSY',    mem:2560, cpu:0.030, sys:true},
    {pid:4,  name:'DESKTOP.VMXE',   mem:1536, cpu:0.015, sys:true},
    {pid:7,  name:'WINMGR.VMSY',    mem:1024, cpu:0.010, sys:true},
    {pid:11, name:'NETBRIDGE.VMSY', mem:1024, cpu:0.005, sys:true},
    {pid:14, name:'PHOSPHOR.VMDRV', mem:1280, cpu:0.020, sys:true},
  ],
  procs: new Map(),            // winid -> {name, mem, cpuIdle, active, heap}
  extraActive: 0,              // non-window load (e.g. screensaver)
  _pending: null,
  govTimer: null,

  /* -------- page allocator (first-fit, contiguous => real fragmentation) -------- */
  initMem(){
    this.nPages=Math.floor(this.ramKB/this.pageKB);
    this._pages=new Array(this.nPages).fill(null);
    this.procs.clear();
    // the resident kernel image occupies one contiguous block at the bottom
    const sysKB=this.sysProcs.reduce((a,p)=>a+p.mem,0);
    this._alloc('SYS#base', sysKB);
  },
  _ensure(){ if(!this._pages) this.initMem(); },
  _pagesFor(kb){ return Math.max(1, Math.ceil(kb/this.pageKB)); },
  _reclaim: null,             // hook: FCACHE installs this so RAM pressure shrinks the disk cache
  _alloc(owner, kb, allowReclaim){
    this._ensure();
    const need=this._pagesFor(kb);
    const tryOnce=()=>{
      let run=0, start=-1;
      for(let i=0;i<this.nPages;i++){
        if(this._pages[i]===null){
          if(run===0) start=i;
          if(++run===need){ for(let j=start;j<start+need;j++) this._pages[j]=owner; return {ok:true,base:start,count:need}; }
        } else run=0;
      }
      return {ok:false};      // no single contiguous run big enough (fragmentation/OOM)
    };
    let r=tryOnce();
    // App / heap demand can reclaim the disk buffer cache, exactly as a real OS
    // shrinks its page cache under memory pressure. Cache reservations do their
    // own LRU eviction and never pass allowReclaim, so this can't recurse.
    let guard=0;
    while(!r.ok && allowReclaim && this._reclaim && this._reclaim(need*this.pageKB) && ++guard<4096) r=tryOnce();
    return r;
  },
  cacheAlloc(id, kb){ return this._alloc('FCACHE#'+id+'#', kb, false).ok; },
  cacheFree(id){ this._freeOwner('FCACHE#'+id+'#'); },
  _freeOwner(prefix){ this._ensure(); for(let i=0;i<this.nPages;i++){ const o=this._pages[i]; if(o!==null && (o===prefix || o.startsWith(prefix))) this._pages[i]=null; } },
  usedKB(){ this._ensure(); let n=0; for(let i=0;i<this.nPages;i++) if(this._pages[i]!==null) n++; return n*this.pageKB; },
  freeKB(){ this._ensure(); return this.nPages*this.pageKB - this.usedKB(); },
  largestFreeKB(){ this._ensure(); let run=0,best=0; for(let i=0;i<this.nPages;i++){ if(this._pages[i]===null){ if(++run>best) best=run; } else run=0; } return best*this.pageKB; },
  fragKB(){ return this.freeKB()-this.largestFreeKB(); },   // free memory that is unusable in one block
  // fragmentation-aware: a request must fit in ONE contiguous run, not just total free
  canAlloc(kb){ return this.largestFreeKB() >= kb; },
  cacheKB(){ this._ensure(); let n=0; for(let i=0;i<this.nPages;i++){ const o=this._pages[i]; if(o!==null && o.startsWith('FCACHE#')) n++; } return n*this.pageKB; },

  /* -------- CPU model: the Vulp-33 has NO frequency scaling. It runs flat-out and
     time-slices, so the SAME work simply takes longer as demand rises. There is
     almost no headroom: contention is felt early, and once oversubscribed the
     box effectively hangs until load drops. -------- */
  demand(){
    let d=this.sysProcs.reduce((a,p)=>a+p.cpu*this.cpuHz,0)+this.extraActive;
    this.procs.forEach(p=>d+=p.cpuIdle+(p.active||0));
    return d;
  },
  load(){ return this.demand()/this.cpuHz; },   // 1.0 == core saturated; >1 == oversubscribed
  speed(){
    const l=this.load();
    if(l<=0.10) return 1;                         // only a near-idle box feels instant
    if(l<1.0)  return Math.max(0.05, 1-(l-0.10)*0.9778);  // stutter starts ~30%, ~12% at saturation
    // oversubscribed: collapses toward a hard lock (~1% by 150% load)
    return Math.max(0.01, 0.12-(l-1.0)*0.22);
  },
  hung(){ return this.load()>=1.5; },            // scheduler cannot keep up -> effectively frozen

  footprint(app){ return APP_MEM[app]||512; },
  cpuIdleFor(app){ return (APP_CPU[app]||0.02)*this.cpuHz; },
  register(winid,name,mem,cpuIdle){ const r=this._alloc(winid+'#base', mem, true); this.procs.set(winid,{name,mem,cpuIdle,active:0,heap:0}); return r.ok; },
  free(winid){ this._freeOwner(winid+'#'); this.procs.delete(winid); },
  // dynamic heap for a running program (canvas, text buffer, BASIC vars...).
  // Reallocating heap frees the old block first, so churn genuinely fragments RAM.
  setHeap(winid, kb){
    const p=this.procs.get(winid); if(!p) return false;
    this._freeOwner(winid+'#heap'); p.heap=0;
    if(kb<=0) return true;
    const r=this._alloc(winid+'#heap', kb, true);
    if(r.ok){ p.heap=kb; return true; }
    // could not find a contiguous hole big enough -> real OOM/fragmentation failure
    return false;
  },
  procMem(winid){ const p=this.procs.get(winid); return p?p.mem+(p.heap||0):0; },
  setActive(winid,frac){ const p=this.procs.get(winid); if(p) p.active=(frac||0)*this.cpuHz; },
  startGovernor(){
    if(this.govTimer) clearInterval(this.govTimer);
    this.govTimer=setInterval(()=>{
      const l=this.load();
      document.body.classList.toggle('vm-thrash', l>1.0);   // contended
      document.body.classList.toggle('vm-hang',   l>1.4);   // near-frozen
    }, 700);
  }
};
/* ============================================================================
 * FCACHE - the disk buffer cache (page cache) between the synchronous VFS and
 * the real, slow platters. Resident file bytes occupy REAL RAM drawn from the
 * same VMRES pool as every app, so the cache genuinely competes for the ~33 MB
 * this machine has. When RAM runs short - because you opened apps OR because
 * you read a lot of files - the least-recently-used CLEAN pages are evicted
 * back to cold, and re-opening those files pays the platter seek cost again.
 * Dirty (unflushed) pages and binary media are pinned so nothing is ever lost.
 * This is exactly how DOS/Windows/Unix reconciled a fast CPU with a slow disk.
 * ========================================================================== */
const FCACHE = {
  lru: new Map(),            // node -> true; Map insertion order == LRU order (oldest first)
  _id: 1,
  residentKB: 0,
  // A REGENERABLE file is procedural ROM: its bytes are synthesized on demand
  // (built-in audio plays from its `track`, not from stored bytes), so it never
  // needs to occupy the buffer cache or round-trip through the platters.
  // Everything else - text AND images (whose `content` is a faithful, ASCII
  // data-URL that round-trips perfectly) - is a normal, evictable page.
  REGEN(node){ return !!node.track; },
  // RAM a node's resident copy costs: the real length of its content.
  kbFor(node){
    const bytes = node.content!=null ? String(node.content).length : (node.size||0);
    return Math.max(1, Math.ceil(bytes/1024));
  },
  install(){ VMRES._reclaim = (kb)=>this.reclaim(kb); },   // let RAM pressure shrink the cache

  touch(node){ this.lru.delete(node); this.lru.set(node, true); },   // -> most-recently-used

  // A file's content just became resident (cold read finished, or a write).
  // Reserve real RAM, evicting LRU clean pages first if space is tight. Returns
  // false only if it cannot fit even after evicting everything evictable - an
  // authentic out-of-memory condition.
  admit(node){
    if(node.content==null) return true;
    if(this.REGEN(node)) return true;                               // procedural ROM: not cache-managed
    if(node._cacheId!=null){ this.touch(node); return true; }        // already reserved
    if(!this._reserve(node, this.kbFor(node))) return false;
    this.touch(node);
    return true;
  },
  // actual RAM a reservation consumes, rounded up to the page granularity so
  // our running total always matches VMRES's page table exactly
  _pagedKB(kb){ return VMRES._pagesFor(kb)*VMRES.pageKB; },
  _reserve(node, kb){
    let guard=0;
    while(!VMRES.canAlloc(kb)){ if(!this._evictLRU()) return false; if(++guard>4096) return false; }
    const id=this._id++;
    if(!VMRES.cacheAlloc(id, kb)) return false;
    const a=this._pagedKB(kb); node._cacheId=id; node._cacheKB=a; this.residentKB+=a;
    return true;
  },
  _evictable(node){
    if(node.content==null) return false;      // already cold
    if(node._dirty) return false;              // unflushed write -> must not lose
    if(node._cacheId==null) return false;      // not cache-managed (regen ROM never is)
    return true;
  },
  _evictLRU(){
    for(const node of this.lru.keys()){ if(this._evictable(node)){ this._evict(node); return true; } }
    return false;   // nothing evictable (all dirty / pinned / binary)
  },
  _evict(node){
    if(node.size==null) node.size = new TextEncoder().encode(String(node.content||'')).length;
    node.content=null;                        // -> COLD (the next read pays a real seek)
    this.forget(node);
  },
  // release a node's RAM reservation and drop it from the LRU list, without
  // touching its content (used on evict, on delete, and on overwrite)
  forget(node){
    if(!node) return;
    if(node._cacheId!=null){ VMRES.cacheFree(node._cacheId); this.residentKB-=(node._cacheKB||0); node._cacheId=null; node._cacheKB=0; }
    this.lru.delete(node);
  },
  // called by VMRES when an app/heap allocation is short: shrink the cache
  reclaim(kb){
    let freed=false, guard=0;
    while(VMRES.largestFreeKB() < kb){ if(!this._evictLRU()) break; freed=true; if(++guard>4096) break; }
    return freed;
  },
  // cold-boot init: nothing is paged into a freshly powered machine, so drop
  // every clean text page to cold (its bytes are safe on the platters after the
  // boot flush) and reserve honest RAM for the media that stays pinned.
  boot(root){
    this.lru.clear(); this.residentKB=0; this._id=1; this.install();
    const walk=(node)=>{
      if(node.type==='dir'){ for(const k of Object.keys(node.children||{})) walk(node.children[k]); return; }
      if(node.type==='app' || node.content==null) return;
      node._dirty=false;
      if(this.REGEN(node)) return;            // procedural ROM: leave its stub, never cached
      if(node.size==null) node.size = new TextEncoder().encode(String(node.content)).length;
      node.content=null;                      // clean text/image -> cold (demand-read on open)
    };
    walk(root);
  },
  stats(){ return { kb:this.residentKB, files:this.lru.size }; }
};

// real emulated animation pacing: under load we genuinely drop frames
function vmDropFrame(){ const s=VMRES.speed(); return s<1 && Math.random() > s; }
// wall-clock time a fixed amount of virtual work takes at the current speed
function vmScale(ms){ return ms / VMRES.speed(); }

/* =========================================================
   GREEN SCREEN OF DEATH
   ========================================================= */
let GSOD_ACTIVE=false;
function triggerGSOD(reason){
  if(GSOD_ACTIVE) return;
  GSOD_ACTIVE=true;
  closeStart(); closeContextMenu();
  const crt=$('#crt');
  const glitch = el('div'); glitch.id='gsod';
  glitch.innerHTML = `<div class="gsod-tear"></div><div class="gsod-tear t2"></div><div class="gsod-noise"></div><pre class="gsod-text"></pre>`;
  crt.appendChild(glitch);
  for(let i=0;i<10;i++) setTimeout(()=>beep(80+Math.random()*900, 0.06, Math.random()>0.5?'sawtooth':'square', 0.05), i*70);
  document.body.classList.add('gsod-break');
  const panic =
`VMOS  -  FATAL KERNEL FAULT

A protected map the kernel relies on has vanished from the
disk while the system was running:

    MISSING : C:\\SYSTEM\\${reason}
    FAULT   : 0E  at  0028:C001E36
    KRN     : cannot res_ync r_ster ______ 
    VMEM    : ####  ####  ####  ????  ????

The boot configuration is gone. The window manager, the
file map, and the phosphor timing all read from it. Without
it the kernel has no floor to stand on.

* The current session cannot continue.
* This machine will not POST again until it is hard reset.

    _  Press any key . . .  (it will not help)  _`;
  const txt = glitch.querySelector('.gsod-text');
  let i=0;
  const iv = setInterval(()=>{ i+=Math.ceil(Math.random()*3); txt.textContent = panic.slice(0,i); if(i>=panic.length){ clearInterval(iv); } }, 12);
  const burst = ()=>{ if(!GSOD_ACTIVE) return; document.body.classList.toggle('gsod-jolt'); beep(60+Math.random()*200,0.04,'sawtooth',0.04); setTimeout(()=>document.body.classList.remove('gsod-jolt'), 90); setTimeout(burst, 400+Math.random()*1400); };
  setTimeout(burst, 600);
  const onKey = ()=>{ beep(50,0.2,'sawtooth',0.05); document.body.classList.add('gsod-jolt'); setTimeout(()=>document.body.classList.remove('gsod-jolt'),120); };
  document.addEventListener('keydown', onKey);
  document.addEventListener('pointerdown', onKey);
}

/* =========================================================
   Icons / glyphs
   ========================================================= */
function iconFor(name, type, extra){
  if(extra?.icon) return extra.icon;
  if(type==='dir'){
    const up=name.toUpperCase();
    if(up==='MAIL') return '\u2709';
    if(up==='PROGRAMS') return '\u25A3';
    if(up==='DOWNLOADS') return '\u21E9';
    if(up==='TEMP') return '\u29B0';
    if(up==='DOCS') return '\u25A4';
    if(up==='MUSIC') return '\u266B';
    if(up==='SYSTEM') return '\u2699';
    return '\u25A4';
  }
  if(type==='app') return '\u25A3';
  if(type==='sys') return '\u2699';
  if(type==='img') return '\u25A9';
  if(type==='wav'||type==='mp3') return '\u266A';
  if(type==='vmzip') return '\u25A6';
  if(/\.(vmtxt|vmmd|vmbat|txt|md)$/i.test(name)) return '\u2261';
  if(/\.(png|jpg|jpeg|bmp)$/i.test(name)) return '\u25A9';
  if(/\.(wav|mp3)$/i.test(name)) return '\u266A';
  return '\u2022';
}

/* =========================================================
   Desktop
   ========================================================= */
function getDesktopItems(){
  const items=[];
  const rootList = VFS.ls(['C:'])||[];
  for(const e of rootList){
    if(e.type==='dir' && e.name.toUpperCase()!=='SYSTEM'){
      items.push({name:e.name, icon:iconFor(e.name,'dir'), kind:'folder', path:['C:',e.name]});
    }
  }
  const progs = VFS.ls(['C:','PROGRAMS'])||[];
  for(const e of progs){ if(e.type==='app') items.push({name:e.name, icon:e.icon||'\u25A3', kind:'app', app:e.app}); }
  items.push({name:'RECYCLE.BIN', icon: VFS.recycle.length?'\u2298':'\u2297', kind:'bin'});
  return items;
}
function renderDesktop(){
  const box=$('#icons'); if(!box) return;
  box.innerHTML='';
  for(const it of getDesktopItems()){
    const d=el('div','icon');
    d.innerHTML=`<div class="glyph">${esc(it.icon)}</div><div class="label">${esc(it.name)}</div>`;
    d.tabIndex=0;
    d.addEventListener('click',()=>{ $$('.icon.selected').forEach(x=>x.classList.remove('selected')); d.classList.add('selected'); });
    d.addEventListener('dblclick',()=>{
      beep(1200,0.03);
      if(it.kind==='folder') openApp('explorer',{path:it.path});
      else if(it.kind==='app') openApp(it.app);
      else if(it.kind==='bin') openApp('recyclebin');
    });
    if(it.kind==='folder'){
      d.addEventListener('dragover', e=>{ e.preventDefault(); d.classList.add('selected'); });
      d.addEventListener('dragleave', ()=>d.classList.remove('selected'));
      d.addEventListener('drop', e=>{ e.preventDefault(); const src=e.dataTransfer.getData('text/vmos-path'); if(!src) return; const parts=JSON.parse(src); const r=VFS.move(parts,it.path); if(!r.ok) showSecurity(r.reason); });
    }
    d.addEventListener('contextmenu',e=>{
      e.preventDefault(); e.stopPropagation();
      const items=[{label:'Open',act:()=>d.dispatchEvent(new MouseEvent('dblclick'))}];
      if(it.kind==='folder'){
        items.push({label:'Properties',act:()=>showProperties(it.path)});
        items.push({sep:true});
        items.push({label:'Delete',act:async()=>{ const ok=await showModal({title:'Delete',body:`Delete folder <b>${esc(it.name)}</b> and everything inside?`,buttons:[{label:'Cancel',value:false},{label:'Delete',value:true}]}); if(!ok) return; const r=VFS.remove(it.path); if(!r.ok) await showSecurity(r.reason); }});
      } else if(it.kind==='app'){
        items.push({label:'Delete Shortcut',act:async()=>{ const ok=await showModal({title:'Delete',body:`Delete <b>${esc(it.name)}</b> from PROGRAMS?`,buttons:[{label:'Cancel',value:false},{label:'Delete',value:true}]}); if(!ok) return; const r=VFS.remove(['C:','PROGRAMS',it.name]); if(!r.ok) await showSecurity(r.reason); }});
      } else if(it.kind==='bin'){
        items.push({label:'Empty Recycle Bin', disabled: !VFS.recycle.length, act:async()=>{ const ok=await showModal({title:'Empty Recycle Bin',body:`Permanently remove ${VFS.recycle.length} item(s)?`,buttons:[{label:'Cancel',value:false},{label:'Empty',value:true}]}); if(ok) VFS.purgeRecycle(); }});
      }
      showContextMenu(e.clientX,e.clientY,items);
    });
    box.appendChild(d);
  }
}
function wireDesktopMenu(){
  const dk=$('#desktop');
  dk.addEventListener('contextmenu', e=>{
    if(e.target.closest('.icon, .win')) return;
    e.preventDefault();
    showContextMenu(e.clientX,e.clientY,[
      {label:'New Folder', glyph:'\u25A4', act:async()=>{ const n=await promptModal('New Folder','Name:','NEW_FOLDER'); if(!n) return; const r=VFS.mkdir(['C:',n]); if(!r.ok) await showSecurity(r.reason); }},
      {label:'New Text File', glyph:'\u2261', act:async()=>{ const n=await promptModal('New Text File','Name (.VMTXT):','NEW_FILE.VMTXT'); if(!n) return; if(!/\.(vmtxt|vmmd)$/i.test(n)){ await showSecurity('Only .VMTXT and .VMMD allowed.'); return; } const r=VFS.write(['C:',n],'',{type:'txt'}); if(!r.ok) await showSecurity(r.reason); }},
      {sep:true},
      {label:'Arrange Icons', glyph:'\u2637', act:()=>renderDesktop()},
      {label:'Refresh', glyph:'\u21BB', act:()=>{ renderDesktop(); beep(700,0.02); }},
      {sep:true},
      {label:'Cascade Windows', glyph:'\u25A7', act:()=>WM.cascade()},
      {label:'Tile Windows', glyph:'\u25A6', act:()=>WM.tile()},
      {sep:true},
      {label:'Display Properties\u2026', glyph:'\u2731', act:()=>openApp('config')},
    ]);
  });
}

/* =========================================================
   Context menu
   ========================================================= */
let ctxOpen=null;
function closeContextMenu(){ if(ctxOpen){ ctxOpen.remove(); ctxOpen=null; } }
function showContextMenu(x,y,items){
  closeContextMenu();
  const m=el('div','ctxmenu');
  for(const it of items){
    if(it.sep){ m.appendChild(el('div','sep')); continue; }
    const row=el('div','ci'+(it.disabled?' dis':''));
    row.innerHTML=`<span class="g">${esc(it.glyph||'')}</span><span>${esc(it.label)}</span>`;
    if(!it.disabled) row.addEventListener('click',()=>{ closeContextMenu(); try{ it.act(); }catch(e){ console.error(e); } });
    m.appendChild(row);
  }
  m.style.left=Math.min(x,window.innerWidth-210)+'px';
  m.style.top =Math.min(y,window.innerHeight-40-items.length*26)+'px';
  $('#crt').appendChild(m); ctxOpen=m; beep(700,0.02);
}

/* =========================================================
   Start menu
   ========================================================= */
function buildStartMenu(){
  const sm=$('#startMenu'); if(!sm) return;
  const progs=VFS.ls(['C:','PROGRAMS'])||[];
  const items=progs.filter(p=>p.type==='app').map(p=>({a:p.app,icon:p.icon||'\u25A3',label:p.desc||p.name}));
  let html=`<div class="sm-header">VMOS 9.7</div>`;
  for(const it of items) html+=`<div class="sm-item" data-a="${esc(it.a)}"><span class="g">${esc(it.icon)}</span> ${esc(it.label)}</div>`;
  html+=`<div class="sm-sep"></div>
    <div class="sm-item" data-a="taskmgr"><span class="g">\u25EC</span> Task Manager (Ctrl+Alt+Del)</div>
    <div class="sm-item" data-a="saver"><span class="g">\u25C8</span> Lock Terminal</div>
    <div class="sm-item" data-a="reboot"><span class="g">\u21BB</span> Restart\u2026</div>
    <div class="sm-item" data-a="shutdown"><span class="g">\u25C7</span> Shut Down\u2026</div>`;
  sm.innerHTML=html;
  sm.onclick=e=>{
    const it=e.target.closest('.sm-item'); if(!it) return;
    closeStart();
    const a=it.dataset.a;
    if(a==='saver') startSaver();
    else if(a==='shutdown') doShutdown();
    else if(a==='reboot') doReboot();
    else openApp(a);
  };
}

function closeStart(){ $('#startMenu').classList.remove('open'); $('#startBtn').classList.remove('open'); }

/* =========================================================
   Window Manager
   ========================================================= */
const WM = {
  wins:new Map(), z:100, active:null,
  open(opts){
    const id='w'+uid();
    const w=el('div','win'); w.dataset.id=id;
    const {title='Untitled',icon='\u25C7',width=520,height=340,x,y,resizable=true,menubar=null,status=''}=opts;
    const cx=x??(60+(WM.wins.size*24)%180), cy=y??(40+(WM.wins.size*22)%160);
    w.style.left=cx+'px'; w.style.top=cy+'px'; w.style.width=width+'px'; w.style.height=height+'px';
    w.innerHTML=`
      <div class="titlebar">
        <span class="t-icon">${esc(icon)}</span>
        <span class="t-title">${esc(title)}</span>
        <span class="t-btns">
          <button data-a="min" title="Minimize">_</button>
          <button data-a="max" title="Maximize">\u25A2</button>
          <button data-a="close" title="Close">\u2715</button>
        </span>
      </div>
      ${menubar?`<div class="menubar">${menubar}</div>`:''}
      <div class="body"></div>
      <div class="statusbar"><span class="s-text">${esc(status)}</span></div>
      ${resizable?'<div class="resize"></div>':''}`;
    $('#windows').appendChild(w);
    const handle={ id, el:w, body:w.querySelector('.body'),
      setTitle(t){ w.querySelector('.t-title').textContent=t; setTaskTitle(id,t); },
      setStatus(t){ w.querySelector('.s-text').textContent=t; },
      close(){ WM.close(id); }, onClose:null,
      setLoad(frac){ VMRES.setActive(id,frac); } };
    WM.wins.set(id,{id,el:w,opts,handle});
    // attach the resource footprint reserved by openApp()
    const _rec=WM.wins.get(id);
    if(VMRES._pending){ _rec.proc=VMRES._pending; VMRES.register(id,_rec.proc.name,_rec.proc.mem,_rec.proc.cpuIdle); VMRES._pending=null; }
    WM.focus(id); WM.wireWindow(id); addTask(id,title,icon); beep(900,0.02);
    return handle;
  },
  wireWindow(id){
    const {el:w}=WM.wins.get(id);
    const tb=w.querySelector('.titlebar');
    w.addEventListener('pointerdown',()=>WM.focus(id));
    tb.addEventListener('click',e=>{ const b=e.target.closest('button'); if(!b) return; const a=b.dataset.a; if(a==='close') WM.close(id); else if(a==='max') WM.toggleMax(id); else if(a==='min') WM.minimize(id); });
    tb.addEventListener('dblclick',e=>{ if(!e.target.closest('button')) WM.toggleMax(id); });
    // Drag via POINTER events so mouse and touch behave identically. The touch
    // zone is the titlebar only (touch-action:none is scoped to it in CSS), so
    // touching the window body still scrolls/selects normally. Pointer capture
    // keeps the drag glued to this titlebar even if the finger/cursor strays.
    let dragging=false,sx,sy,ox,oy,lastMove=0,pid=null;
    tb.addEventListener('pointerdown',e=>{ if(e.button>0) return; if(e.target.closest('button')) return; if(w.classList.contains('max')) return; dragging=true; pid=e.pointerId; sx=e.clientX; sy=e.clientY; ox=parseInt(w.style.left); oy=parseInt(w.style.top); VMRES.setActive(id,0.05); try{ tb.setPointerCapture(pid); }catch(_){} });
    tb.addEventListener('pointermove',e=>{ if(!dragging||e.pointerId!==pid) return;
      // the scheduler can only refresh the window position so often; when the
      // core is busy that budget grows, so dragging visibly stutters.
      const now=Date.now(), budget=16/Math.max(0.05,VMRES.speed());
      w.dataset.snap = e.clientX<8?'L':(e.clientX>window.innerWidth-8?'R':(e.clientY<8?'T':''));
      if(now-lastMove < budget) return; lastMove=now;
      let nx=ox+e.clientX-sx, ny=oy+e.clientY-sy; w.style.left=Math.max(0,nx)+'px'; w.style.top=Math.max(0,ny)+'px'; });
    const endDrag=e=>{ if(!dragging) return; if(pid!=null){ try{ tb.releasePointerCapture(pid); }catch(_){} } VMRES.setActive(id,0); if(w.dataset.snap){ WM.snap(id,w.dataset.snap); } dragging=false; pid=null; w.dataset.snap=''; };
    tb.addEventListener('pointerup',endDrag);
    tb.addEventListener('pointercancel',endDrag);
    const rz=w.querySelector('.resize');
    if(rz){ let rs=false,rx,ry,rw,rh,rpid=null;
      rz.addEventListener('pointerdown',e=>{ if(e.button>0) return; rs=true; rpid=e.pointerId; rx=e.clientX; ry=e.clientY; rw=w.offsetWidth; rh=w.offsetHeight; try{ rz.setPointerCapture(rpid); }catch(_){} e.preventDefault(); });
      rz.addEventListener('pointermove',e=>{ if(!rs||e.pointerId!==rpid) return; w.style.width=Math.max(220,rw+e.clientX-rx)+'px'; w.style.height=Math.max(140,rh+e.clientY-ry)+'px'; });
      const endRz=e=>{ if(!rs) return; if(rpid!=null){ try{ rz.releasePointerCapture(rpid); }catch(_){} } rs=false; rpid=null; };
      rz.addEventListener('pointerup',endRz); rz.addEventListener('pointercancel',endRz);
    }
  },
  snap(id,side){
    const {el:w}=WM.wins.get(id); if(!w) return;
    w.classList.remove('max');
    const H=window.innerHeight-32;
    if(side==='L'){ w.style.left='0px'; w.style.top='0px'; w.style.width=(window.innerWidth/2)+'px'; w.style.height=H+'px'; }
    else if(side==='R'){ w.style.left=(window.innerWidth/2)+'px'; w.style.top='0px'; w.style.width=(window.innerWidth/2)+'px'; w.style.height=H+'px'; }
    else if(side==='T'){ WM.toggleMax(id); }
  },
  focus(id){
    const rec=WM.wins.get(id); if(!rec) return;
    if(rec.el.style.display==='none') rec.el.style.display='';
    WM.z++; rec.el.style.zIndex=WM.z;
    WM.wins.forEach(({el})=>el.classList.add('inactive'));
    rec.el.classList.remove('inactive'); WM.active=id; updateTasks();
  },
  close(id){
    const rec=WM.wins.get(id); if(!rec) return;
    if(rec.handle.onClose){ try{ rec.handle.onClose(); }catch(e){} }
    VMRES.free(id);
    rec.el.remove(); WM.wins.delete(id); removeTask(id); beep(500,0.03,'sawtooth');
    let top=null,tz=-1; WM.wins.forEach(r=>{ const z=+r.el.style.zIndex||0; if(z>tz){ tz=z; top=r.id; } });
    if(top) WM.focus(top); else WM.active=null;
  },
  toggleMax(id){ const rec=WM.wins.get(id); if(rec) rec.el.classList.toggle('max'); },
  minimize(id){ const rec=WM.wins.get(id); if(rec){ rec.el.style.display='none'; updateTasks(); } },
  cascade(){ let i=0; WM.wins.forEach(({el})=>{ el.classList.remove('max'); el.style.left=(40+i*26)+'px'; el.style.top=(30+i*24)+'px'; el.style.display=''; i++; }); },
  tile(){ const arr=[...WM.wins.values()].filter(r=>r.el.style.display!=='none'); const n=arr.length; if(!n) return; const cols=Math.ceil(Math.sqrt(n)), rows=Math.ceil(n/cols); const W=window.innerWidth, H=window.innerHeight-32; arr.forEach((r,i)=>{ const c=i%cols, rr=Math.floor(i/cols); r.el.classList.remove('max'); r.el.style.left=(c*W/cols)+'px'; r.el.style.top=(rr*H/rows)+'px'; r.el.style.width=(W/cols)+'px'; r.el.style.height=(H/rows)+'px'; }); }
};

/* =========================================================
   Downloads capture (host isolation)
   ========================================================= */
function uniqueName(parent, base){
  if(!parent.children[base]) return base;
  const m=base.match(/^(.*?)(?:\((\d+)\))?(\.[^.]+)?$/);
  const stem=m?m[1]:base; const ext=m&&m[3]?m[3]:'';
  let n=1; while(parent.children[`${stem}(${n})${ext}`]) n++;
  return `${stem}(${n})${ext}`;
}
function saveToDownloads(filename,content,opts={}){
  if(!VFS.resolve(['C:','DOWNLOADS'])) VFS.mkdir(['C:','DOWNLOADS']);
  const parent=VFS.resolve(['C:','DOWNLOADS']);
  const name=uniqueName(parent,filename);
  parent.children[name]={type:opts.type||'txt',content,...(opts.extra||{})};
  VFS.notify(); return name;
}
async function interceptedDownload(filename,content,opts={}){
  const name=saveToDownloads(filename,content,opts);
  await showInfo('DOWNLOAD CAPTURED',
`The host bridge intercepted this download.

File   : ${name}
Target : C:\\DOWNLOADS\\${name}
Size   : ${(opts.size||(content?.length||0))} bytes

Files never leave this VM. Open EXPLORER to view.`);
  return name;
}

/* =========================================================
   App launcher  (now enforces the RAM/CPU budget)
   ========================================================= */
const APPS = {};
async function openApp(name,opts){
  const fn=APPS[name];
  if(!fn) return showSecurity('No handler for '+name);
  const mem=VMRES.footprint(name);
  if(!VMRES.canAlloc(mem)){ await showMemoryError(name,mem); return; }
  // reserve the footprint; the window created inside fn() picks it up
  VMRES._pending={name, mem, cpuIdle:VMRES.cpuIdleFor(name)};
  // Spin the program up ON THE REAL CPU. The Vulp-33 initializes the program's
  // RAM working set (sized to its footprint) as a genuine, cycle-accurate job
  // posted to the chip. The wall-clock cost is dictated by the 33 MHz core, so
  // a large app takes proportionally longer to launch - exactly as loading and
  // relocating real code would. This is the CPU analog of the disk's seek cost.
  if(typeof VCPU!=='undefined' && VCPU.isReady()){
    await withBusy(()=>VCPU.launch(mem));
  } else {
    const initMs = Math.min(60, 12 + mem/64);
    await sleep(Math.min(2500, vmScale(initMs)));
  }
  try{ return await withBusy(async()=>fn(opts)); }
  finally{ VMRES._pending=null; }
}
/* =========================================================
   Real-web helpers  (unique URL per call -> a repeat/back
   request can never become a conditional 304 that drops its
   CORS headers, which was the real "failed to fetch" cause)
   ========================================================= */
async function wikiSummary(topic){
  const clean=topic.trim().replace(/\s+/g,'_');
  const bust=()=>'https://en.wikipedia.org/api/rest_v1/page/summary/'+encodeURIComponent(clean)+'?redirect=true&_='+Date.now()+Math.random().toString(36).slice(2);
  let lastErr;
  for(let attempt=0;attempt<2;attempt++){
    try{
      const r=await fetch(bust(),{cache:'no-store',mode:'cors',headers:{'accept':'application/json'}});
      if(!r.ok) throw new Error('HTTP '+r.status);
      return await r.json();
    }catch(e){ lastErr=e; }
  }
  throw lastErr||new Error('fetch failed');
}
async function ddgSearch(q){
  const fallback=[{title:'Wikipedia article: '+q,href:'https://en.wikipedia.org/wiki/'+encodeURIComponent(q.replace(/\s+/g,'_')),snippet:'Open direct Wikipedia article for \u201C'+q+'\u201D.'}];
  const u='https://api.duckduckgo.com/?q='+encodeURIComponent(q)+'&format=json&no_html=1&skip_disambig=1&_='+Date.now()+Math.random().toString(36).slice(2);
  let j;
  try{
    const r=await fetch(u,{cache:'no-store',mode:'cors'});
    if(!r.ok) throw new Error('HTTP '+r.status);
    j=await r.json();
  }catch(e){ return fallback; }
  const results=[];
  if(j.AbstractText && j.AbstractURL) results.push({title:j.Heading||q,href:j.AbstractURL,snippet:j.AbstractText});
  const flatten=arr=>{ for(const it of arr||[]){ if(it.Topics) flatten(it.Topics); else if(it.FirstURL && it.Text) results.push({title:it.Text.split(' - ')[0],href:it.FirstURL,snippet:it.Text}); } };
  flatten(j.RelatedTopics);
  results.push(fallback[0]);
  return results;
}

   Terminal (VMSH)

const CMD_HELP = {
  help:'help [cmd]            Show command list or help for one command',
  cls:'cls | clear           Clear the screen',
  ver:'ver                   Show VMOS version',
  date:'date                  Show current date/time',
  echo:'echo <text>           Print text (supports %VAR%)',
  dir:'dir | ls [path]       List directory',
  cd:'cd [path]             Change directory (.. for parent)',
  pwd:'pwd                   Show current directory',
  tree:'tree [path]           Recursive directory tree',
  cat:'cat | type <file>     Show file contents',
  more:'more                  Pager (usually via a pipe)',
  find:'find "text"           Filter piped lines / search a file',
  edit:'edit <file>           Open file in NOTEPAD.VMXE',
  run:'run <name>            Launch a program or run a .VMBAT script',
  mkdir:'mkdir <name>          Create directory',
  touch:'touch <name>          Create empty text file',
  del:'del | rm <file>       Delete (moves to Recycle Bin)',
  mv:'mv <src> <dst>        Move/rename (cross-folder ok)',
  cp:'cp <src> <dst>        Copy (cross-folder ok)',
  set:'set [NAME=VALUE]      Show or set environment variables',
  path:'path                  Show PATH',
  mem:'mem                   Show emulated memory/CPU usage',
  search:'search <query>        NetLink search (real web)',
  fetch:'fetch <topic>         Fetch encyclopedia article',
  ping:'ping <host>           Ping bridge (simulated)',
  theme:'theme <name>          phosphor|amber|ice|mono|magenta',
  color:'color <name>          Alias of theme',
  basic:'basic                 Launch VMBASIC interpreter',
  saver:'saver                 Lock screen / screensaver',
  shutdown:'shutdown | exit       Power down VM'
};

APPS.terminal=function(opts={}){
  const win=WM.open({title:'C:\\SYSTEM\\VMSH.VMXE',icon:'>_',width:660,height:410,status:'VMSH 9.7 ready'});
  const term=el('div','term'); win.body.appendChild(term);
  const state={cwd:[...VFS.cwd],history:[],hIdx:0};
  const print=(html,cls)=>{ const d=el('div','line'); if(cls) d.className+=' '+cls; d.innerHTML=html; term.appendChild(d); term.scrollTop=term.scrollHeight; };
  const prompt=()=>VFS.join(state.cwd)+'>';
  const banner=()=>{ print(`<span class="bright">VMOS 9.7 - Virtual Machine Shell (VMSH)</span>`); print(`<span class="dim">(c) 1998-2008 Kasai Kitsune Corp. Type 'help' for commands.</span>`); print(''); };

  function expandVars(s){ return s.replace(/%([A-Za-z_][A-Za-z0-9_]*)%/g,(m,n)=>{ const k=Object.keys(VFS.env).find(k=>k.toLowerCase()===n.toLowerCase()); return k?VFS.env[k]:m; }); }

  function showInput(){
    const line=el('div','line'); line.innerHTML=`<span class="prompt">${esc(prompt())}</span> `;
    const input=el('input','in'); input.type='text'; input.spellcheck=false; input.autocomplete='off';
    line.appendChild(input); term.appendChild(line); input.focus(); term.scrollTop=term.scrollHeight;
    input.addEventListener('keydown',async e=>{
      if(e.key==='Enter'){ const cmd=input.value; input.disabled=true; line.innerHTML=`<span class="prompt">${esc(prompt())}</span> ${esc(cmd)}`;
        if(cmd.trim().length){ state.history.push(cmd); state.hIdx=state.history.length; }
        await runLine(cmd); showInput();
      } else if(e.key==='ArrowUp'){ e.preventDefault(); if(state.hIdx>0){ state.hIdx--; input.value=state.history[state.hIdx]||''; } }
      else if(e.key==='ArrowDown'){ e.preventDefault(); if(state.hIdx<state.history.length){ state.hIdx++; input.value=state.history[state.hIdx]||''; } }
      else if(e.key==='l' && e.ctrlKey){ e.preventDefault(); term.innerHTML=''; banner(); showInput(); }
      else if(e.key==='Tab'){ e.preventDefault(); tabComplete(input); }
    });
  }
  function tabComplete(input){
    const val=input.value; const m=val.match(/(\S*)$/); const frag=m?m[1]:'';
    let pool;
    if(/\s/.test(val.trim())){ const list=VFS.ls(state.cwd)||[]; pool=list.map(e=>e.name); } else { pool=Object.keys(CMD_HELP); }
    const hits=pool.filter(x=>x.toLowerCase().startsWith(frag.toLowerCase()));
    if(hits.length===1){ input.value=val.slice(0,val.length-frag.length)+hits[0]; }
    else if(hits.length>1){ print(`<span class="dim">${hits.map(esc).join('   ')}</span>`); }
  }

  async function runStage(cmd,args,stdin,interactive,emit){
    switch(cmd){
      case 'help':
        if(args[0]){ const k=args[0].toLowerCase(); emit(CMD_HELP[k]?CMD_HELP[k]:'No help for '+args[0]); }
        else { emit('COMMANDS'); for(const k of Object.keys(CMD_HELP)) emit('  '+CMD_HELP[k]); }
        return;
      case 'ver': emit('VMOS 9.7.4 build 9 (VMSH 9.7)'); return;
      case 'date': emit(new Date().toString()); return;
      case 'echo': emit(args.join(' ')); return;
      case 'pwd': emit(VFS.join(state.cwd)); return;
      case 'path': emit('PATH='+VFS.env.PATH); return;
      case 'mem': {
        const used=VMRES.usedKB(), tot=VMRES.ramKB, free=VMRES.freeKB(), big=VMRES.largestFreeKB(), frag=VMRES.fragKB(), load=(VMRES.load()*100).toFixed(0);
        emit(`Memory : ${used} K used / ${tot} K total  (${free} K free)`);
        emit(`Blocks : largest free ${big} K  \u00B7  fragmented ${frag} K stranded  \u00B7  page ${VMRES.pageKB} K`);
        if(typeof FCACHE!=='undefined'){ const c=FCACHE.stats(); emit(`Cache  : ${c.kb} K disk buffer resident in ${c.files} file(s)`); }
        emit(`CPU    : Vulp-33 32-bit CISC @ 33 MHz (no freq scaling) - load ${load}%  effective ${(VMRES.speed()*100).toFixed(0)}%${VMRES.hung()?'  [HUNG]':''}`);
        if(typeof VCPU!=='undefined' && VCPU.isReady()){ const v=VCPU.telemetry(); emit(`Vulp-33: ${(v.cycles/1e6).toFixed(1)}M cyc \u00B7 ${(v.instrs/1e3).toFixed(0)}K instr \u00B7 CPI ${v.cpi.toFixed(2)} \u00B7 cache ${(v.cacheRate*100).toFixed(1)}% \u00B7 up ${v.uptimeSec.toFixed(0)}s \u00B7 ${v.halted?'idle (HLT)':'executing'}`); }
        emit(`Procs  : ${VMRES.sysProcs.length+VMRES.procs.size} running`);
        return;
      }
      case 'set':
        if(!args.length){ for(const[k,v] of Object.entries(VFS.env)) emit(`${k}=${v}`); return; }
        { const kv=args.join(' '); const i=kv.indexOf('='); if(i<0){ const k=kv.trim(); const kk=Object.keys(VFS.env).find(x=>x.toLowerCase()===k.toLowerCase()); emit(kk?`${kk}=${VFS.env[kk]}`:`${k} not defined`); return; }
          const name=kv.slice(0,i).trim(), value=kv.slice(i+1); if(!value){ const kk=Object.keys(VFS.env).find(x=>x.toLowerCase()===name.toLowerCase()); if(kk) delete VFS.env[kk]; } else VFS.env[name]=value; return; }
      case 'dir': case 'ls': {
        const p=args[0]?VFS.parsePath(args[0]):state.cwd; const list=VFS.ls(p);
        if(!list){ emit('Path not found: '+(args[0]||'.')); return; }
        emit(' Directory of '+VFS.join(p)); emit('');
        for(const e of list){ const size=e.type==='dir'?'<DIR>      ':String(e.size||(e.content?.length||0)).padStart(9,' '); emit(` ${size}  ${e.name}`); }
        emit(`   ${list.length} item(s)`); return;
      }
      case 'tree': {
        const p=args[0]?VFS.parsePath(args[0]):state.cwd; const root=VFS.resolve(p);
        if(!root||root.type!=='dir'){ emit('Path not found'); return; }
        emit(VFS.join(p));
        const walk=(node,pre)=>{ const ents=Object.entries(node.children||{}); ents.forEach(([n,c],i)=>{ const last=i===ents.length-1; emit(pre+(last?'\u2514\u2500 ':'\u251C\u2500 ')+n); if(c.type==='dir') walk(c,pre+(last?'   ':'\u2502  ')); }); };
        walk(root,''); return;
      }
      case 'cat': case 'type': {
        if(stdin && !args[0]){ emit(stdin); return; }
        if(!args[0]){ emit('Usage: cat <file>'); return; }
        const parts=VFS.parsePath(args[0]); const node=VFS.resolve(parts);
        if(!node||node.type==='dir'){ emit('File not found'); return; }
        const data=await withBusy(()=>VFS.readContent(parts));   // cold file pays a real platter read here
        if(node.type==='sys'){ emit('[SYSTEM FILE - HEADER ONLY]'); emit((data||'').split('\n').slice(0,5).join('\n')); return; }
        emit(data||''); return;
      }
      case 'more': emit(stdin!=null?stdin:''); return;
      case 'find': {
        const needle=(args.join(' ').replace(/^"|"$/g,''))||'';
        let hay = stdin!=null ? stdin : '';
        if(stdin==null && args.length>1){ const fp=VFS.parsePath(args[args.length-1]); const node=VFS.resolve(fp); hay=(node&&node.type!=='dir')?((await withBusy(()=>VFS.readContent(fp)))||''):''; }
        const lines=hay.split('\n').filter(l=>l.toLowerCase().includes(needle.toLowerCase()));
        emit(lines.join('\n')); return;
      }
      default: emit('__NONTEXT__'); return;
    }
  }

  async function runLine(raw){
    raw=expandVars(raw.trim()); if(!raw) return;
    let redir=null; const rm=raw.match(/\s(>>?)\s*(\S+)\s*$/);
    if(rm){ redir={mode:rm[1],file:rm[2]}; raw=raw.slice(0,rm.index).trim(); }
    const stages=raw.split('|').map(s=>s.trim()).filter(Boolean);
    const single = stages.length===1 && !redir;
    if(single){
      const parts=raw.split(/\s+/); const cmd=(parts[0]||'').toLowerCase(); const args=parts.slice(1);
      if(await interactiveCommand(cmd,args)) return;
    }
    let pipeIn=null; let out='';
    for(let i=0;i<stages.length;i++){
      const parts=stages[i].split(/\s+/); const cmd=(parts[0]||'').toLowerCase(); const args=parts.slice(1);
      const buf=[]; await runStage(cmd,args,pipeIn,false,t=>buf.push(t));
      if(buf.length===1 && buf[0]==='__NONTEXT__'){ if(!(await interactiveCommand(cmd,args))) print(`<span class="err">Unknown command: ${esc(cmd)}</span>. Type <span class="bright">help</span>.`); return; }
      out=buf.join('\n'); pipeIn=out;
    }
    if(redir){
      const p=/[\\\/]/.test(redir.file)?VFS.parsePath(redir.file):[...state.cwd,redir.file];
      const existing=VFS.resolve(p); let prev=''; if(redir.mode==='>>'&&existing&&existing.type!=='dir'){ const pc=await withBusy(()=>VFS.readContent(p)); if(pc) prev=pc+'\n'; }
      if(!/\.(vmtxt|vmmd|txt|md|vmbat)$/i.test(redir.file)){ await showSecurity('Redirection target must be a writable text file (.VMTXT/.VMMD/.VMBAT).'); return; }
      const r=VFS.write(p,prev+out,{type:'txt'}); if(!r.ok){ print(`<span class="err">${esc(r.reason)}</span>`); } else print(`<span class="dim">wrote ${out.split('\n').length} line(s) to ${esc(redir.file)}</span>`);
    } else { out.split('\n').forEach(l=>print(esc(l))); }
  }

  async function interactiveCommand(cmd,args){
    switch(cmd){
      case '': return true;
      case 'cls': case 'clear': term.innerHTML=''; banner(); return true;
      case 'cd': {
        if(!args[0]){ print(esc(VFS.join(state.cwd))); return true; }
        if(args[0]==='..'){ if(state.cwd.length>1) state.cwd.pop(); return true; }
        const p=VFS.parsePath(args[0]); const node=VFS.resolve(p);
        if(!node||node.type!=='dir'){ print(`<span class="err">Directory not found: ${esc(args[0])}</span>`); return true; }
        state.cwd=p; return true;
      }
      case 'edit': { if(!args[0]){ print(`<span class="err">Usage: edit <file></span>`); return true; } openApp('notepad',{path:VFS.parsePath(args[0])}); return true; }
      case 'run': {
        if(!args[0]){ print(`<span class="err">Usage: run <name></span>`); return true; }
        if(/\.vmbat$/i.test(args[0])){ await runBatch(VFS.parsePath(args[0])); return true; }
        const name=args[0].toUpperCase(); const list=VFS.ls(['C:','PROGRAMS'])||[]; const found=list.find(e=>e.name.toUpperCase()===name);
        if(!found||found.type!=='app'){ await showSecurity(`Executable not recognized: ${name}`); return true; }
        openApp(found.app); return true;
      }
      case 'mkdir': { if(!args[0]){ print(`<span class="err">Usage: mkdir <name></span>`); return true; } const r=VFS.mkdir([...state.cwd,args[0]]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); return true; }
      case 'touch': { if(!args[0]){ print(`<span class="err">Usage: touch <name></span>`); return true; } const r=VFS.write([...state.cwd,args[0]],'',{type:'txt'}); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); return true; }
      case 'del': case 'rm': {
        if(!args[0]){ print(`<span class="err">Usage: del <file></span>`); return true; }
        const p=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]]; const node=VFS.resolve(p);
        if(!node){ print(`<span class="err">Not found.</span>`); return true; }
        if(node.type==='dir'&&Object.keys(node.children||{}).length){ print(`<span class="err">Directory not empty.</span>`); return true; }
        const r=VFS.remove(p); if(!r.ok) await showSecurity(r.reason); else print(`<span class="dim">deleted (to Recycle Bin): ${esc(args[0])}</span>`); return true;
      }
      case 'mv': {
        if(args.length<2){ print(`<span class="err">Usage: mv <src> <dst></span>`); return true; }
        const srcP=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]];
        const dstNode=VFS.resolve(/[\\\/]/.test(args[1])?VFS.parsePath(args[1]):[...state.cwd,args[1]]);
        if(dstNode&&dstNode.type==='dir'){ const r=VFS.move(srcP,/[\\\/]/.test(args[1])?VFS.parsePath(args[1]):[...state.cwd,args[1]]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        else { const r=VFS.rename(srcP,args[1]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        return true;
      }
      case 'cp': {
        if(args.length<2){ print(`<span class="err">Usage: cp <src> <dst></span>`); return true; }
        const srcP=/[\\\/]/.test(args[0])?VFS.parsePath(args[0]):[...state.cwd,args[0]];
        const dstArg=args[1]; const dstFull=/[\\\/]/.test(dstArg)?VFS.parsePath(dstArg):[...state.cwd,dstArg];
        const dstNode=VFS.resolve(dstFull);
        if(dstNode&&dstNode.type==='dir'){ const r=VFS.copy(srcP,dstFull); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        else { const r=VFS.copy(srcP,dstFull.slice(0,-1),dstFull[dstFull.length-1]); if(!r.ok) print(`<span class="err">${esc(r.reason)}</span>`); }
        return true;
      }
      case 'search': {
        const q=args.join(' '); if(!q){ print(`<span class="err">Usage: search <query></span>`); return true; }
        print(`<span class="dim">[bridge] querying external index for: ${esc(q)}\u2026</span>`);
        await withBusy(async()=>{ try{ const res=await ddgSearch(q); if(!res.length){ print(`<span class="warn">No results.</span>`); return; }
          for(const r of res.slice(0,8)){ print(`  <a data-fetch="${esc(r.href)}">${esc(r.title)}</a>`); if(r.snippet) print(`   <span class="dim">${esc(r.snippet)}</span>`); } }
          catch(e){ print(`<span class="err">[bridge] signal lost: ${esc(e.message||e)}</span>`); } });
        return true;
      }
      case 'fetch': {
        const q=args.join(' '); if(!q){ print(`<span class="err">Usage: fetch <topic></span>`); return true; }
        await withBusy(async()=>{ try{ const s=await wikiSummary(q); if(!s){ print(`<span class="warn">No article.</span>`); return; }
          print(`<span class="bright">${esc(s.title)}</span>`); print(esc(s.extract||'')); print(`<span class="dim">source: ${esc(s.content_urls?.desktop?.page||'')}</span>`); }
          catch(e){ print(`<span class="err">[bridge] fetch failed: ${esc(e.message||e)}</span>`); } });
        return true;
      }
      case 'ping': { const host=args[0]||'bridge.local'; for(let i=0;i<4;i++){ await sleep(280); const ms=Math.floor(20+Math.random()*80); print(`Reply from ${esc(host)}: bytes=32 time=${ms}ms ttl=64`); } return true; }
      case 'theme': case 'color': {
        const t=(args[0]||'').toLowerCase(); if(!['phosphor','amber','ice','mono','magenta'].includes(t)){ print(`<span class="err">Usage: ${cmd} <phosphor|amber|ice|mono|magenta></span>`); return true; }
        setTheme(t); print(`<span class="dim">theme set to ${esc(t)}</span>`); return true;
      }
      case 'basic': openApp('basic'); return true;
      case 'saver': startSaver(); return true;
      case 'shutdown': case 'exit': doShutdown(); return true;
      case 'sudo': await showSecurity('This VM has no privilege ladder. Command refused.'); return true;
      case 'format': case 'rm-rf': await showSecurity('Destructive host command intercepted. Denied.'); return true;
    }
    if(/\.vmbat$/i.test(cmd)){ const p=/[\\\/]/.test(cmd)?VFS.parsePath(cmd):[...state.cwd,cmd]; if(VFS.resolve(p)){ await runBatch(p); return true; } }
    return false;
  }

  async function runBatch(parts){
    const node=VFS.resolve(parts);
    if(!node||node.type==='dir'){ print(`<span class="err">Batch file not found.</span>`); return; }
    print(`<span class="dim">[batch] ${esc(VFS.join(parts))}</span>`);
    const lines=((await VFS.readContent(parts))||'').split('\n');
    for(let ln of lines){ ln=ln.trim(); if(!ln||ln.startsWith('::')||ln.toUpperCase().startsWith('REM ')) continue; if(/^echo\s+off$/i.test(ln)) continue; print(`<span class="prompt">${esc(prompt())}</span> ${esc(ln)}`); await runLine(ln); }
  }

  term.addEventListener('click',e=>{ const a=e.target.closest('a[data-fetch]'); if(!a) return; e.preventDefault(); openApp('netlink',{url:a.dataset.fetch}); });
  banner();
  if(opts.batch) runBatch(opts.batch).then(showInput); else showInput();
};

/* =========================================================
   Notepad
   ========================================================= */
APPS.notepad=function(opts={}){
  const path=opts.path||null;
  const title=path?'NOTEPAD - '+VFS.join(path):'NOTEPAD - untitled.VMTXT';
  const menubar=`<span class="mi" data-a="save">File &gt; Save</span><span class="mi" data-a="saveas">Save As\u2026</span><span class="mi" data-a="export">Export to Downloads</span>`;
  const win=WM.open({title,icon:'\u2261',width:520,height:360,menubar,status:'ready'});
  const ta=el('textarea','pad'); ta.spellcheck=false; let curPath=path;
  win.body.appendChild(ta); let dirty=false, lastVal='';
  // The window frame appears instantly; the document streams in from disk a
  // beat later. A cold (evicted) file pays a real platter read right here.
  (async()=>{
    if(!curPath){ ta.value=''; lastVal=''; VMRES.setHeap(win.id,1); return; }
    const node=VFS.resolve(curPath);
    if(!node||node.type==='dir'){ ta.value=''; lastVal=''; VMRES.setHeap(win.id,1); return; }
    if(node.type==='img'||node.type==='wav'||node.type==='mp3'){ ta.value='[binary object - open in its viewer]'; lastVal=ta.value; VMRES.setHeap(win.id,1); return; }
    ta.readOnly=true; win.setStatus('reading C:\u2026'); setBusy(true);
    try{ ta.value=(await VFS.readContent(curPath))||''; } finally{ setBusy(false); }
    ta.readOnly=false; lastVal=ta.value;
    // the text buffer is real heap (1 byte/char), reserved once it's loaded
    VMRES.setHeap(win.id, Math.max(1,Math.ceil(lastVal.length/1024)));
    win.setStatus('ready');
  })();
  ta.addEventListener('input',()=>{
    const kb=Math.max(1,Math.ceil(ta.value.length/1024));
    if(!VMRES.setHeap(win.id, kb)){ ta.value=lastVal; showMemoryError('NOTEPAD', kb); return; }  // buffer can't grow
    lastVal=ta.value; dirty=true; win.setStatus('modified \u00B7 '+kb+' K');
  });
  const mb=win.body.parentElement.querySelector('.menubar');
  if(mb) mb.addEventListener('click',async e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='save'){ if(!curPath) return doSaveAs(); const r=VFS.write(curPath,ta.value); win.setStatus(r.ok?'saved':'error'); if(!r.ok) await showSecurity(r.reason); else dirty=false; }
    else if(a==='saveas') doSaveAs();
    else if(a==='export'){ const base=curPath?curPath[curPath.length-1]:'untitled.VMTXT'; const name=base.replace(/\.VMTXT$/i,'.txt').replace(/\.VMMD$/i,'.md'); const saved=await interceptedDownload(name,ta.value,{type:'txt',size:ta.value.length}); win.setStatus('exported: C:\\DOWNLOADS\\'+saved); }
  });
  async function doSaveAs(){
    const name=await promptModal('Save As','Enter filename (.VMTXT, .VMMD or .VMBAT):',(curPath?curPath[curPath.length-1]:'untitled.VMTXT'));
    if(!name) return;
    if(!/\.(vmtxt|vmmd|vmbat)$/i.test(name)){ await showSecurity('Only .VMTXT, .VMMD and .VMBAT are writable inside this VM.'); return; }
    const dest=[...VFS.cwd,name]; const r=VFS.write(dest,ta.value,{type:'txt'}); if(!r.ok){ await showSecurity(r.reason); return; }
    curPath=dest; win.setTitle('NOTEPAD - '+VFS.join(curPath)); win.setStatus('saved: '+name); dirty=false;
  }
};

/* -------- Image viewer -------- */
APPS.imgview=function(opts={}){
  const path=opts.path; if(!path){ showInfo('IMAGE VIEWER','No image specified.'); return; }
  const node=VFS.resolve(path); if(!node||node.type!=='img'){ showInfo('IMAGE VIEWER','Not a viewable image.'); return; }
  const win=WM.open({title:'IMAGE - '+VFS.join(path),icon:'\u25A9',width:520,height:420,status:'reading C:\u2026'});
  const wrap=el('div','imgv'); const img=new Image(); wrap.appendChild(img); win.body.appendChild(wrap);
  // the frame opens instantly; the pixels stream in from the platter a beat
  // later. A cold (evicted) image pays a real head seek right here - the same
  // demand-read path as text, now that images round-trip faithfully.
  (async()=>{ setBusy(true); try{ img.src=(await VFS.readContent(path))||''; } finally{ setBusy(false); } win.setStatus(node.width?`${node.width}x${node.height}`:''); })();
};
/* =========================================================
   Explorer
   ========================================================= */
APPS.explorer=function(opts={}){
  const startPath=opts.path||['C:'];
  const win=WM.open({title:'EXPLORER - '+VFS.join(startPath),icon:'\u25A4',width:660,height:440,status:''});
  const root=el('div','expl');
  root.innerHTML=`<div class="side"></div>
    <div class="main">
      <div class="nav">
        <button data-a="back" title="Back">\u25C4</button>
        <button data-a="fwd" title="Forward">\u25BA</button>
        <button data-a="up" title="Up">\u25B2</button>
        <input class="addr" spellcheck="false">
        <button data-a="go">GO</button>
      </div>
      <div class="files" tabindex="0"></div>
    </div>`;
  win.body.appendChild(root);
  const sideEl=root.querySelector('.side'), filesEl=root.querySelector('.files'), addr=root.querySelector('.addr');
  const navBar=root.querySelector('.nav');
  let cur=startPath, selected=null;
  const back=[], fwd=[];

  function renderSide(){
    sideEl.innerHTML='';
    (function walk(node,path,depth){
      if(node.type!=='dir') return;
      const it=el('div','tn'); it.style.paddingLeft=(6+depth*10)+'px';
      it.innerHTML=`<span class="ch">\u25B8</span>${esc(path[path.length-1])}`;
      if(JSON.stringify(path)===JSON.stringify(cur)) it.classList.add('sel');
      it.addEventListener('click',()=>navigate(path));
      sideEl.appendChild(it);
      for(const[n,c] of Object.entries(node.children||{})) if(c.type==='dir') walk(c,[...path,n],depth+1);
    })(VFS.root,['C:'],0);
  }
  function navigate(path,noHist){
    if(!VFS.resolve(path)) path=['C:'];
    if(!noHist && JSON.stringify(path)!==JSON.stringify(cur)){ back.push(cur); fwd.length=0; }
    cur=path; selected=null; addr.value=VFS.join(cur);
    renderSide(); renderFiles(); win.setTitle('EXPLORER - '+VFS.join(cur));
    navBar.querySelector('[data-a="back"]').disabled=!back.length;
    navBar.querySelector('[data-a="fwd"]').disabled=!fwd.length;
    navBar.querySelector('[data-a="up"]').disabled=cur.length<=1;
  }
  function openEntry(e){
    beep(1000,0.02);
    if(e.type==='dir') navigate([...cur,e.name]);
    else if(e.type==='app') openApp(e.app);
    else if(e.type==='sys') showSecurity('System object opened read-only in HEX viewer (not installed).');
    else if(e.type==='img') openApp('imgview',{path:[...cur,e.name]});
    else if(e.type==='wav'||e.type==='mp3') openApp('player',{path:[...cur,e.name]});
    else if(e.type==='vmzip') openArchive([...cur,e.name]);
    else openApp('notepad',{path:[...cur,e.name]});
  }
  async function doDelete(name){
    const node=VFS.resolve([...cur,name]); if(!node) return;
    let msg=`Delete <b>${esc(name)}</b>? It will go to the Recycle Bin.`;
    if(node.type==='dir'){ const n=Object.keys(node.children||{}).length; msg=`Delete folder <b>${esc(name)}</b>${n?` and its ${n} item(s)`:''}? (to Recycle Bin)`; }
    const ok=await showModal({title:'Delete',body:msg,buttons:[{label:'Cancel',value:false},{label:'Delete',value:true}]});
    if(!ok) return; const r=VFS.remove([...cur,name]); if(!r.ok) await showSecurity(r.reason);
  }
  async function doRename(name){ const nn=await promptModal('Rename','Enter a new name:',name); if(!nn||nn===name) return; const r=VFS.rename([...cur,name],nn); if(!r.ok) await showSecurity(r.reason); }
  async function doNew(kind){
    let defName=kind==='folder'?'NEW_FOLDER':'NEW_FILE.VMTXT';
    const nn=await promptModal(kind==='folder'?'New Folder':'New Text File','Enter a name:',defName); if(!nn) return;
    if(kind==='folder'){ const r=VFS.mkdir([...cur,nn]); if(!r.ok) await showSecurity(r.reason); }
    else { if(!/\.(vmtxt|vmmd|vmbat)$/i.test(nn)){ await showSecurity('Only .VMTXT/.VMMD/.VMBAT allowed for text files.'); return; } const r=VFS.write([...cur,nn],'',{type:'txt'}); if(!r.ok) await showSecurity(r.reason); }
  }
  function doPaste(){
    if(!CLIP.path) return;
    if(CLIP.mode==='copy'){ const r=VFS.copy(CLIP.path,cur); if(!r.ok) showSecurity(r.reason); }
    else if(CLIP.mode==='cut'){ const r=VFS.move(CLIP.path,cur); if(!r.ok) showSecurity(r.reason); else { CLIP.path=null; CLIP.mode=null; } }
  }
  async function makeArchive(name){
    const node=VFS.resolve([...cur,name]);
    const arcName=name.replace(/\.[^.]+$/,'')+'.VMZIP';
    const r=VFS.write([...cur,arcName],'[compressed archive]',{type:'vmzip',extra:{payload:VFS.clone(node),origName:name}});
    if(!r.ok) await showSecurity(r.reason); else notify('Archiver',`Compressed \u2192 ${arcName}`);
  }
  function openArchive(parts){
    const node=VFS.resolve(parts);
    showModal({title:'VMZIP ARCHIVE',body:`<pre style="margin:0;white-space:pre-wrap;font-family:var(--font-mono)">Archive : ${esc(parts[parts.length-1])}\nContains: ${esc(node.origName||'?')}\n\nExtract into the current folder?</pre>`,buttons:[{label:'Close',value:false},{label:'Extract',value:true}]}).then(ok=>{ if(ok&&node.payload){ const nm=(node.origName||'extracted'); const dest=VFS.resolve(cur); let use=nm; while(dest.children[use]) use=use.replace(/(\.[^.]+)?$/,'_X$1'); dest.children[use]=VFS.clone(node.payload); VFS.notify(); } });
  }

  function renderFiles(){
    filesEl.innerHTML=''; const list=VFS.ls(cur)||[]; win.setStatus(`${list.length} item(s)`);
    for(const e of list){
      const f=el('div','f'); f.dataset.name=e.name;
      if(CLIP.mode==='cut'&&CLIP.path&&JSON.stringify(CLIP.path)===JSON.stringify([...cur,e.name])) f.classList.add('cut');
      f.innerHTML=`<div class="g">${esc(iconFor(e.name,e.type,e))}</div><div>${esc(e.name)}</div>`;
      f.draggable=(e.type!=='sys');
      f.addEventListener('dragstart',ev=>{ ev.dataTransfer.setData('text/vmos-path',JSON.stringify([...cur,e.name])); });
      f.addEventListener('dragover',ev=>{ if(e.type==='dir'){ ev.preventDefault(); f.classList.add('sel'); } });
      f.addEventListener('dragleave',()=>f.classList.remove('sel'));
      f.addEventListener('drop',ev=>{ if(e.type!=='dir') return; ev.preventDefault(); ev.stopPropagation(); const s=ev.dataTransfer.getData('text/vmos-path'); if(!s) return; const r=VFS.move(JSON.parse(s),[...cur,e.name]); if(!r.ok) showSecurity(r.reason); });
      f.addEventListener('click',()=>{ $$('.expl .f.sel',root).forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); selected=e.name; });
      f.addEventListener('dblclick',()=>openEntry(e));
      f.addEventListener('contextmenu',ev=>{
        ev.preventDefault(); ev.stopPropagation();
        $$('.expl .f.sel',root).forEach(x=>x.classList.remove('sel')); f.classList.add('sel'); selected=e.name;
        const items=[{label:'Open',glyph:'\u25B8',act:()=>openEntry(e)}];
        if(e.type!=='dir'&&e.type!=='app') items.push({label:'Open With\u2026',glyph:'\u2318',act:()=>openWith([...cur,e.name])});
        if(e.type!=='dir'&&e.type!=='sys'&&e.type!=='app'&&e.type!=='img') items.push({label:'Edit in Notepad',glyph:'\u2261',act:()=>openApp('notepad',{path:[...cur,e.name]})});
        items.push({sep:true});
        items.push({label:'Cut',glyph:'\u2702',disabled:e.type==='sys',act:()=>{ CLIP.path=[...cur,e.name]; CLIP.mode='cut'; renderFiles(); }});
        items.push({label:'Copy',glyph:'\u29C9',disabled:e.type==='sys',act:()=>{ CLIP.path=[...cur,e.name]; CLIP.mode='copy'; }});
        items.push({label:'Compress to .VMZIP',glyph:'\u25A6',disabled:e.type==='sys',act:()=>makeArchive(e.name)});
        if(e.type!=='sys'&&e.type!=='app') items.push({label:'Export to Downloads',glyph:'\u21E9',act:async()=>{ if(e.type==='img'){ const d=(await withBusy(()=>VFS.readContent([...cur,e.name])))||''; await interceptedDownload(e.name,d,{type:'img',extra:{width:e.width,height:e.height},size:d.length}); } else { const data=(await withBusy(()=>VFS.readContent([...cur,e.name])))||''; await interceptedDownload(e.name,data,{type:e.type,size:data.length}); } }});
        items.push({sep:true});
        items.push({label:'Rename\u2026',glyph:'\u270E',act:()=>doRename(e.name),disabled:e.type==='sys'});
        items.push({label:'Delete',glyph:'\u2715',act:()=>doDelete(e.name),disabled:e.type==='sys'});
        items.push({label:'Properties',glyph:'\u2637',act:()=>showProperties([...cur,e.name])});
        showContextMenu(ev.clientX,ev.clientY,items);
      });
      filesEl.appendChild(f);
    }
  }
  filesEl.addEventListener('contextmenu',ev=>{
    if(ev.target.closest('.f')) return; ev.preventDefault(); ev.stopPropagation();
    showContextMenu(ev.clientX,ev.clientY,[
      {label:'New Folder',glyph:'\u25A4',act:()=>doNew('folder')},
      {label:'New Text File (.VMTXT)',glyph:'\u2261',act:()=>doNew('file')},
      {label:'Paste',glyph:'\u2398',disabled:!CLIP.path,act:doPaste},
      {sep:true},
      {label:'Properties',glyph:'\u2637',act:()=>showProperties(cur)},
      {label:'Refresh',glyph:'\u21BB',act:renderFiles},
    ]);
  });
  filesEl.addEventListener('dragover',ev=>ev.preventDefault());
  filesEl.addEventListener('drop',ev=>{ if(ev.target.closest('.f')) return; ev.preventDefault(); const s=ev.dataTransfer.getData('text/vmos-path'); if(!s) return; const r=VFS.move(JSON.parse(s),cur); if(!r.ok) showSecurity(r.reason); });
  filesEl.addEventListener('keydown',async e=>{
    if(e.key==='Delete'&&selected){ e.preventDefault(); doDelete(selected); }
    else if(e.key==='F2'&&selected){ e.preventDefault(); doRename(selected); }
    else if(e.key==='Enter'&&selected){ e.preventDefault(); const entry=(VFS.ls(cur)||[]).find(x=>x.name===selected); if(entry) openEntry(entry); }
    else if(e.ctrlKey&&e.key==='c'&&selected){ CLIP.path=[...cur,selected]; CLIP.mode='copy'; }
    else if(e.ctrlKey&&e.key==='x'&&selected){ CLIP.path=[...cur,selected]; CLIP.mode='cut'; renderFiles(); }
    else if(e.ctrlKey&&e.key==='v'){ doPaste(); }
  });
  navBar.addEventListener('click',e=>{
    const a=e.target.dataset.a; if(!a) return;
    if(a==='back'){ if(back.length){ fwd.push(cur); navigate(back.pop(),true); } }
    else if(a==='fwd'){ if(fwd.length){ back.push(cur); navigate(fwd.pop(),true); } }
    else if(a==='up'){ if(cur.length>1) navigate(cur.slice(0,-1)); }
    else if(a==='go'){ const p=VFS.parsePath(addr.value); if(VFS.resolve(p)) navigate(p); else showSecurity('Path not found: '+addr.value); }
  });
  addr.addEventListener('keydown',e=>{ if(e.key==='Enter'){ const p=VFS.parsePath(addr.value); if(VFS.resolve(p)) navigate(p); else showSecurity('Path not found: '+addr.value); } });

  const off=VFS.onChange(()=>{ if(!VFS.resolve(cur)) navigate(['C:'],true); else { renderSide(); renderFiles(); } });

  const kind={dir:'Folder',app:'Application',sys:'System object',img:'Image',txt:'Text document',wav:'Audio (WAV)',mp3:'Audio (MP3)',vmzip:'VMZIP archive'}[node.type]||'File';

/* =========================================================
   NetLink
   ========================================================= */
APPS.netlink=function(opts={}){
  const win=WM.open({title:'NETLINK.VMXE - External Signal Browser',icon:'@',width:720,height:480,status:'ready'});
  const root=el('div','net');
  root.innerHTML=`<div class="bar"><button data-a="back">\u25C4</button><button data-a="home">\u2302</button><input type="text" placeholder="Enter query, wiki:topic, or portal:URL"><button data-a="go">GO</button><button data-a="frame">EMBED</button></div><div class="view"></div>`;
  win.body.appendChild(root);
  const bar=root.querySelector('.bar'),view=root.querySelector('.view'),inp=bar.querySelector('input');
  const stack=[];
  function home(){ stack.length=0; view.innerHTML=`<h1>NETLINK</h1><div class="dim">You reach out. We decide what reaches back.</div><br><div><b>Try:</b><br>&nbsp;&bull; <code>cathode ray tube</code> \u2192 encyclopedia<br>&nbsp;&bull; <code>wiki:phosphor screen</code> \u2192 direct article<br>&nbsp;&bull; <code>portal:https://example.com</code> \u2192 embed frame<br>&nbsp;&bull; any free-text search</div><br><div class="dim">Every request you make crosses through us first, and we read all of it. Whatever comes back has been through our hands - payloads we don't like never arrive, and anything you "download" is kept here in C:\\DOWNLOADS. It stays with us. So do you.</div>`; win.setTitle('NETLINK.VMXE - home'); }
  async function go(q){
    q=q.trim(); if(!q) return; inp.value=q; win.setStatus('fetching\u2026'); stack.push(q);
    await withBusy(async()=>{
      if(/^portal:/i.test(q)) showFrame(q.replace(/^portal:/i,'').trim());
      else if(/^wiki:/i.test(q)) await showArticle(q.replace(/^wiki:/i,'').trim());
      else if(/^https?:\/\//i.test(q)) showFrame(q);
      else await showSearch(q);
    });
    win.setStatus('ready');
  }
  async function showSearch(q){
    view.innerHTML=`<div class="dim">SEARCHING: ${esc(q)}\u2026</div>`;
    try{ const results=await ddgSearch(q); if(!results.length){ view.innerHTML=`<div class="warn">No results.</div>`; return; }
      view.innerHTML=`<h2>results for \u201C${esc(q)}\u201D</h2>`;
      for(const r of results.slice(0,10)){ const div=el('div','result'); div.innerHTML=`<div><a data-href="${esc(r.href)}">${esc(r.title)}</a></div><div class="u">${esc(r.href)}</div><div>${esc(r.snippet||'')}</div>`; view.appendChild(div); }
      const note=el('div','dim'); note.innerHTML='<br>bridge routed via DuckDuckGo instant answers &middot; encyclopedia via Wikipedia.'; view.appendChild(note);
    }catch(e){ view.innerHTML=`<div class="err">Bridge error: ${esc(e.message||e)}</div>`; }
  }
  async function showArticle(topic){
    view.innerHTML=`<div class="dim">FETCHING article: ${esc(topic)}\u2026</div>`;
    try{ const s=await wikiSummary(topic); if(!s){ view.innerHTML=`<div class="warn">No article.</div>`; return; }
      view.innerHTML=`<h1>${esc(s.title)}</h1>${s.description?`<div class="dim">${esc(s.description)}</div>`:''}${s.thumbnail?`<img src="${esc(s.thumbnail.source)}" style="max-width:220px;border:2px solid var(--fg-dim);image-rendering:auto;margin:8px 0" data-savable="1">`:''}<p>${esc(s.extract||'').split('\n').map(esc).join('<br>')}</p><p class="dim">source: <a data-href="${esc(s.content_urls?.desktop?.page||'')}">${esc(s.content_urls?.desktop?.page||'')}</a></p><p><button data-savearticle="1" style="background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:4px 10px;cursor:pointer;font-family:var(--font-ui);font-size:16px">SAVE ARTICLE TO C:\\DOWNLOADS</button></p>`;
      win.setTitle('NETLINK.VMXE - '+s.title);
      const btn=view.querySelector('[data-savearticle]');
      if(btn) btn.addEventListener('click',async()=>{ const filename=(s.title||'article').replace(/[^\w\-]+/g,'_')+'.VMTXT'; const content=`# ${s.title}\n\n${s.description||''}\n\n${s.extract||''}\n\nSource: ${s.content_urls?.desktop?.page||''}\n`; await interceptedDownload(filename,content,{type:'txt',size:content.length}); });
      const th=view.querySelector('img[data-savable]');
      if(th){ th.style.cursor='context-menu'; th.addEventListener('contextmenu',ev=>{ ev.preventDefault(); showContextMenu(ev.clientX,ev.clientY,[{label:'Save image to C:\\DOWNLOADS',glyph:'\u21E9',act:async()=>{ try{ const r=await fetch(th.src,{cache:'no-store'}); const blob=await r.blob(); const dataUrl=await new Promise(res=>{ const fr=new FileReader(); fr.onload=()=>res(fr.result); fr.readAsDataURL(blob); }); const name=(s.title||'image').replace(/[^\w\-]+/g,'_')+'.png'; await interceptedDownload(name,dataUrl,{type:'img',extra:{width:th.naturalWidth,height:th.naturalHeight},size:blob.size}); }catch(err){ await showSecurity('Bridge could not capture image: '+err.message); } }}]); }); }
    }catch(e){ view.innerHTML=`<div class="err">Bridge error: ${esc(e.message||e)}</div>`; }
  }
  function showFrame(url){ view.innerHTML=''; view.style.padding='0'; const f=el('iframe'); f.setAttribute('sandbox','allow-scripts allow-forms allow-same-origin'); f.src=url; f.addEventListener('load',()=>win.setStatus('frame loaded - '+url)); f.addEventListener('error',()=>showSecurity('Frame refused by host at '+url)); view.appendChild(f); win.setTitle('NETLINK.VMXE - '+url); }
  bar.addEventListener('click',e=>{ const a=e.target.dataset.a;
    if(a==='go') go(inp.value);
    else if(a==='home'){ view.style.padding='10px'; home(); }
    else if(a==='back'){ view.style.padding='10px'; stack.pop(); const prev=stack.pop(); if(prev) go(prev); else home(); }
    else if(a==='frame'){ const q=inp.value.trim(); if(/^https?:/i.test(q)) showFrame(q); else showFrame('https://duckduckgo.com/?q='+encodeURIComponent(q)); }
  });
  inp.addEventListener('keydown',e=>{ if(e.key==='Enter') go(inp.value); });
  view.addEventListener('click',e=>{ const a=e.target.closest('a[data-href]'); if(!a) return; e.preventDefault(); go(a.dataset.href); });
  view.style.padding='10px';
  if(opts.url) go(opts.url); else if(opts.query) go(opts.query); else home();
};
