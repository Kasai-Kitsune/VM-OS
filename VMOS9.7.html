<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>VMOS 9.7 — Virtual Machine Shell</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
  --bg:#0a1a0a; --scr:#071307; --fg:#7dff7d; --fg-dim:#3fa93f; --fg-bright:#b6ffb6;
  --accent:#7dff7d; --shadow:#033603; --panel:#0e2a0e; --panel-hi:#164116; --panel-lo:#051805;
  --bevel-hi:#2fbe2f; --bevel-lo:#031e03; --title-a:#7dff7d; --title-b:#1b641b; --title-fg:#071307;
  --danger:#ff5c5c; --warn:#ffd76b; --link:#b6ffff;
  --font-mono:'VT323','Courier New',ui-monospace,monospace;
  --font-ui:'VT323','Courier New',ui-monospace,monospace;
  --scanline-a:rgba(0,0,0,0.35); --scanline-b:rgba(0,0,0,0); --grid-lines:rgba(80,255,80,0.05);
}
body[data-theme="amber"]{--bg:#1a0e02;--scr:#170a01;--fg:#ffbf5a;--fg-dim:#a8792f;--fg-bright:#ffe1a0;--accent:#ffbf5a;--shadow:#3a2100;--panel:#2a1a03;--panel-hi:#412705;--panel-lo:#150a01;--bevel-hi:#c0842a;--bevel-lo:#180d02;--title-a:#ffbf5a;--title-b:#5a3a05;--title-fg:#170a01;--link:#fff2c8;--grid-lines:rgba(255,190,80,0.05)}
body[data-theme="ice"]{--bg:#04121e;--scr:#03101a;--fg:#8fd8ff;--fg-dim:#3f7ba9;--fg-bright:#d0ecff;--accent:#8fd8ff;--shadow:#031f34;--panel:#0a2036;--panel-hi:#0f3050;--panel-lo:#031421;--bevel-hi:#3f8bbe;--bevel-lo:#031423;--title-a:#8fd8ff;--title-b:#123a58;--title-fg:#03101a;--link:#c8f4ff;--grid-lines:rgba(120,200,255,0.05)}
body[data-theme="mono"]{--bg:#111;--scr:#0b0b0b;--fg:#e0e0e0;--fg-dim:#8a8a8a;--fg-bright:#fff;--accent:#e0e0e0;--shadow:#000;--panel:#1a1a1a;--panel-hi:#2c2c2c;--panel-lo:#0a0a0a;--bevel-hi:#8a8a8a;--bevel-lo:#000;--title-a:#e0e0e0;--title-b:#333;--title-fg:#0b0b0b;--link:#c8c8ff;--grid-lines:rgba(255,255,255,0.05)}
body[data-theme="magenta"]{--bg:#150318;--scr:#0f0212;--fg:#ff8bff;--fg-dim:#a83fa8;--fg-bright:#ffd4ff;--accent:#ff8bff;--shadow:#360036;--panel:#280228;--panel-hi:#3a053a;--panel-lo:#100210;--bevel-hi:#c02fc0;--bevel-lo:#180318;--title-a:#ff8bff;--title-b:#5a0a5a;--title-fg:#0f0212;--link:#c8c8ff;--grid-lines:rgba(255,120,255,0.05)}

*,*::before,*::after{box-sizing:border-box}
html,body{margin:0;padding:0;height:100%;overflow:hidden;background:#000;font-family:var(--font-ui);color:var(--fg)}
body{font-size:18px;line-height:1.15;image-rendering:pixelated;-webkit-font-smoothing:none;user-select:none;cursor:default}
@font-face{font-family:'VT323';src:local('VT323');font-display:swap}

#crt{position:fixed;inset:0;background:radial-gradient(ellipse at center,rgba(0,0,0,0) 40%,rgba(0,0,0,0.55) 100%),var(--bg);overflow:hidden;perspective:1200px}
#crt::before{content:"";position:absolute;inset:0;pointer-events:none;z-index:9999;background:repeating-linear-gradient(to bottom,var(--scanline-a) 0px,var(--scanline-a) 1px,var(--scanline-b) 1px,var(--scanline-b) 3px);mix-blend-mode:multiply;animation:crtRoll 8s linear infinite}
#crt::after{content:"";position:absolute;inset:0;pointer-events:none;z-index:9998;background:radial-gradient(ellipse at center,rgba(255,255,255,0.02),rgba(0,0,0,0.35));animation:crtFlicker 0.15s steps(2) infinite}
@keyframes crtRoll{0%{background-position:0 0}100%{background-position:0 100px}}
@keyframes crtFlicker{0%{opacity:0.85}50%{opacity:1}100%{opacity:0.9}}
.screen{position:absolute;inset:0;background:var(--scr);box-shadow:inset 0 0 120px rgba(0,0,0,0.8),inset 0 0 20px rgba(0,0,0,0.6)}

#boot{position:absolute;inset:0;padding:24px 36px;color:var(--fg-bright);font-family:var(--font-mono);white-space:pre-wrap;overflow:hidden;text-shadow:0 0 6px var(--fg);z-index:50}
#boot .cursor{background:var(--fg);color:var(--scr);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:0}}

#desktop{position:absolute;inset:0;display:none;background:linear-gradient(var(--grid-lines) 1px,transparent 1px) 0 0 / 32px 32px,linear-gradient(90deg,var(--grid-lines) 1px,transparent 1px) 0 0 / 32px 32px,radial-gradient(ellipse at 20% 20%,rgba(125,255,125,0.06),transparent 60%),var(--scr);overflow:hidden}
#desktop.on{display:block}
#icons{position:absolute;inset:8px 8px 40px 8px;display:grid;grid-template-columns:repeat(auto-fill,96px);grid-auto-rows:96px;gap:8px;align-content:start;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y}
.icon{width:96px;height:96px;padding:6px 4px 4px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:4px;cursor:pointer;color:var(--fg-bright);text-shadow:0 0 6px var(--fg);border:1px dashed transparent}
.icon.selected{border-color:var(--fg-dim);background:rgba(125,255,125,0.08)}
.icon .glyph{width:48px;height:48px;display:grid;place-items:center;border:2px solid var(--fg);background:var(--panel);box-shadow:inset -2px -2px 0 var(--bevel-lo),inset 2px 2px 0 var(--bevel-hi);font-size:26px}
.icon .label{font-size:16px;text-align:center;max-width:88px;line-height:1.05;word-break:break-word;padding:1px 3px}

#taskbar{position:absolute;left:0;right:0;bottom:0;height:32px;background:var(--panel);border-top:2px solid var(--bevel-hi);box-shadow:inset 0 -2px 0 var(--bevel-lo);display:flex;align-items:center;gap:4px;padding:2px 4px;z-index:1000}
#startBtn{height:26px;padding:0 10px;background:var(--panel-hi);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:18px;cursor:pointer;display:flex;align-items:center;gap:6px}
#startBtn:active,#startBtn.open{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
#startBtn .sq{display:inline-block;width:12px;height:12px;background:var(--fg);box-shadow:4px 0 0 var(--scr),0 4px 0 var(--scr),4px 4px 0 var(--scr)}
#tasks{flex:1;display:flex;gap:4px;overflow:hidden;padding:0 4px}
.task{height:26px;padding:0 8px;max-width:180px;background:var(--panel-hi);color:var(--fg-bright);border:none;font-family:var(--font-ui);font-size:16px;cursor:pointer;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.task.active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);background:var(--panel-lo)}
#tray{height:26px;padding:0 8px;background:var(--panel-lo);box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi);display:flex;align-items:center;gap:8px;color:var(--fg-bright);font-size:16px}
#tray .led{display:inline-block;width:8px;height:8px;background:var(--fg);box-shadow:0 0 6px var(--fg);animation:blink 2s steps(2) infinite}
#hddAct{display:flex;align-items:center;gap:3px;font-size:12px;color:var(--fg-dim);cursor:pointer;user-select:none}
#hddAct.muted{opacity:0.5}
#hddLed{display:inline-block;width:8px;height:8px;border-radius:1px;background:#3a0d0d;box-shadow:inset 0 0 2px #000}
#hddLed.on{background:#ffb03a;box-shadow:0 0 7px #ffb03a}
#hddLed.seek{background:#ff5a3c;box-shadow:0 0 8px #ff5a3c}
#clock{cursor:pointer}

#startMenu{position:absolute;left:4px;bottom:34px;width:260px;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6);padding:6px;z-index:1500;display:none;font-size:18px}
#startMenu.open{display:block}
#startMenu .sm-header{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg);padding:4px 8px;margin:-6px -6px 6px -6px;font-weight:bold;letter-spacing:1px}
#startMenu .sm-item{padding:6px 8px;cursor:pointer;display:flex;align-items:center;gap:10px}
#startMenu .sm-item:hover{background:var(--title-b);color:var(--title-fg)}
#startMenu .sm-sep{height:2px;background:var(--bevel-lo);margin:4px 0;box-shadow:0 1px 0 var(--bevel-hi)}
#startMenu .sm-item .g{width:20px;text-align:center}

.win{position:absolute;min-width:240px;min-height:120px;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),6px 6px 0 rgba(0,0,0,0.55);display:flex;flex-direction:column;color:var(--fg-bright);z-index:100}
.win.max{inset:0 0 32px 0 !important;width:auto !important;height:auto !important;box-shadow:none}
.win .titlebar{height:24px;background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg);display:flex;align-items:center;padding:0 4px;cursor:move;user-select:none;font-weight:bold;letter-spacing:1px;touch-action:none}
.win.inactive .titlebar{background:linear-gradient(90deg,var(--panel-hi),var(--panel-lo));color:var(--fg-dim)}
.win .titlebar .t-icon{margin-right:6px}
.win .titlebar .t-title{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:16px}
.win .titlebar .t-btns{display:flex;gap:2px}
.win .titlebar button{width:22px;height:18px;background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:14px;cursor:pointer;padding:0;display:grid;place-items:center}
.win .titlebar button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.win .menubar{display:flex;gap:0;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo);font-size:16px}
.win .menubar .mi{padding:2px 10px;cursor:pointer}
.win .menubar .mi:hover{background:var(--title-b);color:var(--title-fg)}
.win .body{flex:1;overflow:auto;background:var(--panel-lo);position:relative}
.win .statusbar{height:20px;background:var(--panel-hi);border-top:1px solid var(--bevel-lo);padding:0 6px;display:flex;align-items:center;gap:12px;font-size:14px;color:var(--fg-bright)}
.win .resize{position:absolute;right:0;bottom:0;width:14px;height:14px;cursor:nwse-resize;background:linear-gradient(135deg,transparent 60%,var(--fg-dim) 60% 70%,transparent 70% 75%,var(--fg-dim) 75% 85%,transparent 85% 90%,var(--fg-dim) 90%);touch-action:none}

.term{padding:8px 10px;height:100%;overflow:auto;background:var(--scr);color:var(--fg-bright);font-family:var(--font-mono);font-size:18px;text-shadow:0 0 6px var(--fg);white-space:pre-wrap;word-break:break-word}
.term .line{padding:0}
.term .prompt{color:var(--fg)}
.term .in{background:transparent;border:none;color:var(--fg-bright);font-family:inherit;font-size:inherit;outline:none;width:80%;caret-color:var(--fg)}
.term a{color:var(--link);text-decoration:underline;cursor:pointer}

.expl{display:grid;grid-template-columns:180px 1fr;height:100%;background:var(--panel-lo)}
.expl .side{border-right:1px solid var(--bevel-lo);background:var(--panel);overflow:auto;padding:4px 0}
.expl .side .tn{padding:2px 8px;cursor:pointer;font-size:16px}
.expl .side .tn.sel{background:var(--title-b);color:var(--title-fg)}
.expl .side .tn .ch{display:inline-block;width:14px}
.expl .main{display:flex;flex-direction:column;overflow:hidden}
.expl .nav{display:flex;gap:4px;padding:3px;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo);align-items:center}
.expl .nav button{background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:15px;cursor:pointer;padding:1px 7px}
.expl .nav button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.expl .nav button:disabled{opacity:0.4;cursor:default}
.expl .nav .addr{flex:1;background:var(--scr);color:var(--fg-bright);border:2px inset var(--bevel-lo);padding:1px 6px;font-family:var(--font-ui);font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.expl .files{overflow:auto;padding:6px;align-content:start;display:grid;grid-template-columns:repeat(auto-fill,80px);grid-auto-rows:88px;gap:6px}
.expl .f{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px;padding:4px 2px;cursor:pointer;border:1px dashed transparent;color:var(--fg-bright);text-align:center;font-size:14px;word-break:break-word;line-height:1.05}
.expl .f.sel{border-color:var(--fg-dim);background:rgba(125,255,125,0.08)}
.expl .f.cut{opacity:0.5}
.expl .f .g{width:40px;height:40px;display:grid;place-items:center;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -2px -2px 0 var(--bevel-lo),inset 2px 2px 0 var(--bevel-hi);font-size:22px;margin-bottom:2px}

.ctxmenu{position:absolute;z-index:6000;background:var(--panel);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6);padding:4px;min-width:160px;font-family:var(--font-ui);font-size:16px}
.ctxmenu .ci{padding:4px 10px;cursor:pointer;color:var(--fg-bright);display:flex;gap:8px;align-items:center}
.ctxmenu .ci:hover{background:var(--title-b);color:var(--title-fg)}
.ctxmenu .ci.dis{opacity:0.5;cursor:default}
.ctxmenu .ci.dis:hover{background:transparent;color:var(--fg-bright)}
.ctxmenu .sep{height:2px;background:var(--bevel-lo);margin:3px 0;box-shadow:0 1px 0 var(--bevel-hi)}
.ctxmenu .ci .g{width:16px;text-align:center}

.pad{width:100%;height:100%;padding:8px;background:var(--scr);color:var(--fg-bright);border:none;outline:none;resize:none;font-family:var(--font-mono);font-size:18px;text-shadow:0 0 3px var(--fg)}

.imgv{width:100%;height:100%;background:repeating-conic-gradient(var(--panel-lo) 0% 25%,var(--panel) 0% 50%) 50% 50% / 20px 20px;display:grid;place-items:center;overflow:auto;padding:10px}
.imgv img{max-width:100%;max-height:100%;image-rendering:pixelated;border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),4px 4px 0 rgba(0,0,0,0.6)}

.net{display:flex;flex-direction:column;height:100%}
.net .bar{display:flex;gap:4px;padding:4px;background:var(--panel-hi);border-bottom:1px solid var(--bevel-lo)}
.net .bar input{flex:1;background:var(--scr);color:var(--fg-bright);border:2px inset var(--bevel-lo);padding:2px 6px;font-family:var(--font-ui);font-size:16px}
.net .bar button{background:var(--panel);color:var(--fg-bright);border:none;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);padding:2px 8px;font-family:var(--font-ui);font-size:16px;cursor:pointer}
.net .bar button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}
.net .view{flex:1;background:var(--scr);overflow:auto;padding:10px;font-size:18px;line-height:1.35}
.net .view h1,.net .view h2,.net .view h3{color:var(--fg);text-shadow:0 0 6px var(--fg);margin:6px 0}
.net .view a{color:var(--link);text-decoration:underline;cursor:pointer}
.net .view .result{border-bottom:1px dashed var(--bevel-lo);padding:6px 0}
.net .view .result .u{color:var(--fg-dim);font-size:14px}
.net iframe{width:100%;height:100%;border:none;background:#fff}

.cfg{padding:12px;height:100%;overflow:auto;font-size:18px}
.cfg h2{color:var(--fg);margin:6px 0;text-shadow:0 0 6px var(--fg)}
.cfg .row{display:flex;gap:10px;align-items:center;margin:6px 0;flex-wrap:wrap}
.cfg .sw{width:56px;height:56px;cursor:pointer;border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);display:grid;place-items:center;font-size:14px}
.cfg .sw.sel{outline:2px dashed var(--fg-bright);outline-offset:2px}
.cfg button,.cfg select,.cfg input[type=range]{background:var(--panel);color:var(--fg-bright);border:none;padding:4px 10px;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:16px;cursor:pointer}

.modal-back{position:absolute;inset:0;background:rgba(0,0,0,0.45);display:grid;place-items:center;z-index:5000}
.modal{min-width:340px;max-width:520px;background:var(--panel);color:var(--fg-bright);border:2px solid var(--fg-dim);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi),8px 8px 0 rgba(0,0,0,0.6)}
.modal .h{background:linear-gradient(90deg,var(--danger),#7a1414);color:#fff;padding:4px 8px;font-weight:bold;letter-spacing:1px}
.modal.info .h{background:linear-gradient(90deg,var(--title-a),var(--title-b));color:var(--title-fg)}
.modal .b{padding:14px;font-size:18px;line-height:1.35}
.modal .b .sig{color:var(--fg-dim);font-size:14px;margin-top:8px}
.modal .f{padding:8px;display:flex;justify-content:flex-end;gap:6px;background:var(--panel-hi)}
.modal .f button{background:var(--panel);color:var(--fg-bright);border:none;padding:4px 14px;box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi);font-family:var(--font-ui);font-size:16px;cursor:pointer}
.modal .f button:active{box-shadow:inset 1px 1px 0 var(--bevel-lo),inset -1px -1px 0 var(--bevel-hi)}

#saver{position:absolute;inset:0;background:#000;z-index:8000;display:none;color:var(--fg-bright);font-family:var(--font-mono);overflow:hidden}
#saver.on{display:block}
#saver canvas{width:100%;height:100%}

.mono{font-family:var(--font-mono)}
.dim{color:var(--fg-dim)}
.bright{color:var(--fg-bright);text-shadow:0 0 6px var(--fg)}
.err{color:var(--danger)}
.warn{color:var(--warn)}
::selection{background:var(--fg);color:var(--scr)}
*::-webkit-scrollbar{width:14px;height:14px}
*::-webkit-scrollbar-track{background:var(--panel-lo);box-shadow:inset 1px 1px 0 var(--bevel-lo)}
*::-webkit-scrollbar-thumb{background:var(--panel-hi);box-shadow:inset -1px -1px 0 var(--bevel-lo),inset 1px 1px 0 var(--bevel-hi)}
*::-webkit-scrollbar-thumb:hover{background:var(--fg-dim)}
*::-webkit-scrollbar-corner{background:var(--panel-lo)}
body.noflick #crt::after{animation:none !important}
body.novign #crt{background:var(--bg)}
body.nogrid #desktop{background:radial-gradient(ellipse at 20% 20%,rgba(125,255,125,0.06),transparent 60%),var(--scr)}
body.busy,body.busy *{cursor:progress !important}

/* ================= RESOURCE OVERLOAD (real symptom) ================= */
/* when the emulated CPU is oversubscribed the whole picture strains */
body.vm-thrash #desktop{animation:vmThrash .18s steps(2) infinite}
@keyframes vmThrash{0%{transform:translateY(0)}50%{transform:translateY(-1px)}51%{transform:translateY(1px)}100%{transform:translateY(0)}}
body.vm-thrash #crt::after{opacity:1;animation-duration:.09s}
/* oversubscribed past ~140%: the scheduler can't keep up and the picture
   nearly freezes - coarse horizontal-hold judder and a dimmed, strained tube */
body.vm-hang #desktop{animation:vmHang .5s steps(1) infinite;filter:brightness(0.92) contrast(1.08)}
@keyframes vmHang{0%{transform:translate(0,0)}25%{transform:translate(-2px,1px)}26%{transform:translate(3px,-1px)}55%{transform:translate(0,0)}56%{transform:translate(-1px,2px)}100%{transform:translate(0,0)}}
body.vm-hang{cursor:progress}

/* ================= GREEN SCREEN OF DEATH ================= */
#gsod{position:absolute;inset:0;z-index:10000;background:#020a02;overflow:hidden;font-family:var(--font-mono)}
#gsod .gsod-noise{position:absolute;inset:-20%;pointer-events:none;background:
  repeating-linear-gradient(0deg,rgba(125,255,125,0.10) 0 1px,transparent 1px 2px),
  repeating-linear-gradient(90deg,rgba(125,255,125,0.05) 0 2px,transparent 2px 5px);
  mix-blend-mode:screen;animation:gsodStatic .08s steps(3) infinite}
#gsod .gsod-tear{position:absolute;left:-10%;width:120%;height:34px;background:rgba(125,255,125,0.14);box-shadow:0 0 30px rgba(125,255,125,0.5);top:22%;animation:gsodTear 1.3s steps(6) infinite}
#gsod .gsod-tear.t2{top:64%;height:18px;animation-duration:.7s;animation-direction:reverse;background:rgba(125,255,125,0.22)}
#gsod .gsod-text{position:relative;z-index:2;margin:0;padding:40px 46px;color:#c6ffc6;font-size:19px;line-height:1.28;white-space:pre-wrap;
  text-shadow:0 0 8px #7dff7d,0 0 2px #7dff7d;animation:gsodTextJitter .12s steps(2) infinite}
@keyframes gsodStatic{0%{transform:translate(0,0)}33%{transform:translate(-3px,2px)}66%{transform:translate(2px,-2px)}100%{transform:translate(-1px,1px)}}

<!-- ================= EMBEDDED IDE HDD + FAT16 ENGINE (DOM-free core) ================= -->
<script>
/* Period-accurate Conner CP3044-class IDE drive + FAT16 filesystem.
   Lifted verbatim from the standalone diagnostic bench; the DOM/bench UI
   has been dropped — only the engine core is embedded here. */
/* ============================================================================
 * IDEDrive — a real-time, physics-based emulation of an early-1990s IDE/ATA
 * hard disk drive (Conner CP3044-class, ~40 MB, 3600 RPM, voice-coil actuator).
 *
 * This is NOT an illusion layer. It models the drive as it actually was:
 *   - raw magnetic media addressed by CHS, 512 bytes/sector
 *   - a spindle whose angular position is tracked in real time (rotational
 *     latency is physically emulated, not faked)
 *   - a voice-coil actuator with accelerate / coast / decelerate / settle
 *   - an ONBOARD controller: its own MCU (cycle-counted), 32 KB SRAM buffer,
 *     firmware ROM, running the real ATA command set via the register file
 *   - a thermal model (heat rises with work, cools toward ambient), driving
 *     thermal recalibration pauses and seek-time drift
 *   - deterministic wear + optional manufacturing defects (critical regions
 *     are protected so testing stays sane)
 *
 * The authentic integration surface is the ATA register file
 * (writeRegister/readRegister + tick). A promise-based convenience layer sits
 * on top for the diagnostic bench and the FAT16 helper.
 *
 * Time model: REAL-TIME accurate. One simulated millisecond == one wall-clock
 * millisecond when self-clocked. A host (your VM) can instead drive tick()/
 * advance() to own the clock. No overclock here by design.
 * ==========================================================================*/
(function (root) {
  'use strict';

  // ---- period-accurate constants (Conner CP3044-class, ~40 MB) -------------
  const GEO = { cylinders: 980, heads: 5, sectorsPerTrack: 17, bytesPerSector: 512 };
  const RPM = 3600;
  const MS_PER_REV = 60000 / RPM;                 // 16.6667 ms
  const DEG_PER_MS = 360 / MS_PER_REV;            // 21.6 deg/ms
  const SECTOR_ANGLE = 360 / GEO.sectorsPerTrack; // ~21.18 deg
  const MS_PER_SECTOR = MS_PER_REV / GEO.sectorsPerTrack;

  const SPINUP_MS = 4200;      // 0 -> 3600 RPM cold spin-up
  const SPINDOWN_MS = 3500;

  // voice-coil actuator: calibrated so t2t~3.4ms, avg(1/3 stroke)~19ms,
  // full-stroke~36ms — authentic for a 40MB VCM drive of this era.
  const ACT = {
    accel: 4.79,     // cylinders / ms^2
    vmax: 37.9,      // cylinders / ms
    settleMs: 2.5,   // head settle after arrival
    headSwitchMs: 1.0
  };

  // thermal
  const THERM = {
    ambientC: 24,
    idleFloorC: 34,          // spinning-but-idle steady state
    heatPerSeekDeg: 0.010,   // per cylinder crossed
    heatPerSectorDeg: 0.0009,
    spinHeatPerMs: 0.00035,  // spindle friction while spinning
    coolPerMs: 0.00060,      // Newtonian cooling coefficient toward ambient
    recalDeltaC: 3.0,        // trigger thermal recal per this much drift
    recalMinMs: 90,
    recalMaxMs: 380,
    seekDriftPerDeg: 0.0022  // seek time scales with (temp - idleFloor)
  };

  // onboard controller (the drive's own CPU + memory)
  const CTRL = {
    mcuHz: 8_000_000,        // ~8 MHz embedded MCU
    bufferBytes: 32 * 1024,  // 32 KB SRAM sector buffer
    cmdOverheadCycles: 2400, // decode + setup per command
    eccCyclesPerSector: 900
  };

  // ATA status bits
  const ST = { BSY:0x80, DRDY:0x40, DWF:0x20, DSC:0x10, DRQ:0x08, CORR:0x04, IDX:0x02, ERR:0x01 };
  // ATA error bits
  const ERR = { BBK:0x80, UNC:0x40, MC:0x20, IDNF:0x10, MCR:0x08, ABRT:0x04, TK0NF:0x02, AMNF:0x01 };
  // ATA commands
  const CMD = {
    RECALIBRATE:0x10, READ:0x20, READ_NR:0x21, WRITE:0x30, WRITE_NR:0x31,
    VERIFY:0x40, VERIFY_NR:0x41, SEEK:0x70, DIAGNOSTIC:0x90,
    INIT_PARAMS:0x91, IDENTIFY:0xEC, SPINDOWN:0xE0, SPINUP:0xE1
  };

  const TOTAL_SECTORS = GEO.cylinders * GEO.heads * GEO.sectorsPerTrack; // 83,300
  const TOTAL_BYTES = TOTAL_SECTORS * GEO.bytesPerSector;                // 42,649,600

  // deterministic PRNG (mulberry32)
  function mulberry32(a) {
    return function () {
      a |= 0; a = (a + 0x6D2B79F5) | 0;
      let t = Math.imul(a ^ (a >>> 15), 1 | a);
      t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // -------------------------------------------------------------------------
  class IDEDrive {
    constructor(opts = {}) {
      this.geo = Object.assign({}, GEO);
      this.totalSectors = TOTAL_SECTORS;
      this.totalBytes = TOTAL_BYTES;

      // manufacturing seed: fixed => identical physical unit every time
      // (reproducible bugs). Omit => random unit each cold boot (authentic
      // unit-to-unit variance).
      this.seed = (opts.seed == null) ? (Math.random() * 0xffffffff) >>> 0 : (opts.seed >>> 0);
      this.rng = mulberry32(this.seed);
      this.jitterRng = mulberry32(this.seed ^ 0x9e3779b9);

      this.enableDefects = !!opts.defects;   // manufacturing defects (default OFF)
      this.enableWear = opts.wear !== false;  // runtime wear (default ON)
      this.brutal = !!opts.brutal;            // allow system-area failure

      // media: raw magnetic image
      this.media = new Uint8Array(this.totalBytes);

      // reserved/system LBA range protected from defects/wear unless brutal.
      // (MBR + boot + FATs + root dir get set by FAT16 layer; we protect a
      // generous head region + cyl 0.)
      this.systemProtectLBA = this.geo.sectorsPerTrack * this.geo.heads * 4; // first 4 cylinders

      // onboard controller state
      this.reg = { data:0, error:0, features:0, sectorCount:0, sectorNumber:0,
                   cylLow:0, cylHigh:0, drvHead:0, status:0, command:0 };
      this.reg.status = 0; // powered off
      this.ctrlCycles = 0; // onboard MCU cycles consumed (telemetry)

      // buffer SRAM (32 KB). Data register transfers move through here.
      this.buffer = new Uint8Array(CTRL.bufferBytes);
      this.xfer = null; // active transfer view {arr,pos,len,dir}

      // physical state
      this.powered = false;
      this.clock = 0;              // simulated ms
      this.selfClock = opts.selfClock !== false; // real-time by default
      this._raf = null; this._epoch = 0; this._lastWall = 0;

      // spindle
      this.spinning = false;
      this.rpm = 0;
      this._spinStart = 0; this._spinFrom = 0; this._spinTarget = 0; this._spinDur = 0;
      this._angleRef = 0; this._angleRefTime = 0; // angle bookkeeping post-spinup

      // actuator
      this.cylinder = 0; this.head = 0;
      this._seek = null; // {from,to,start,dur}

      // thermal
      this.tempC = THERM.ambientC;
      this._tempAtLastRecal = THERM.ambientC;
      this.recalCount = 0;

      // wear / defects
      this.badSectors = new Set();     // permanently bad
      this.weakSectors = new Map();    // lba -> stress score
      this.seekTotal = 0; this.readTotal = 0; this.writeTotal = 0;
      this.headHoursMs = 0;

      // active command op
      this.op = null;
      this.irq = false;

      // stats
      this.stats = { commands:0, seeks:0, recals:0, retries:0, uncErrors:0,
                     bytesRead:0, bytesWritten:0, thermalPauseMs:0 };

      if (this.enableDefects) this._seedManufacturingDefects();
      if (this.selfClock) this._startSelfClock();
    }

    // ---- manufacturing defect map (critical regions ALWAYS excluded) ------
    _seedManufacturingDefects() {
      // authentic drives shipped with a handful of grown/primary defects,
      // recorded in the factory defect list. Never in the system area.
      const count = 3 + Math.floor(this.rng() * 6); // 3..8 defects
      let placed = 0, guard = 0;
      while (placed < count && guard++ < 10000) {
        const lba = this.systemProtectLBA +
          Math.floor(this.rng() * (this.totalSectors - this.systemProtectLBA));
        if (!this.badSectors.has(lba)) { this.badSectors.add(lba); placed++; }
      }
    }

    // ---- power / clock ----------------------------------------------------
    powerOn() {
      if (this.powered) return;
      this.powered = true;
      this.reg.status = ST.BSY; // busy while spinning up
      this._beginSpinUp();
    }
    powerOff() {
      this.powered = false; this.spinning = false; this.rpm = 0;
      this.reg.status = 0; this.op = null; this.xfer = null;
    }

    // ATA soft reset: re-init controller/registers, KEEP platter data + heat +
    // wear + spin. This is the in-world "reboot" — distinct from a cold
    // power-on (page refresh in the bench recreates the object => cold).
    softReset() {
      this.op = null; this.xfer = null; this.irq = false;
      this.reg.error = 1; // diagnostic passed code
      this.reg.sectorCount = 1; this.reg.sectorNumber = 1;
      this.reg.cylLow = 0; this.reg.cylHigh = 0;
      // brief controller re-init; recalibrate heads to track 0
      this._startCommand(CMD.RECALIBRATE, true);
    }

    _startSelfClock() {
      const raf = (typeof requestAnimationFrame !== 'undefined')
        ? requestAnimationFrame.bind(null)
        : (cb) => setTimeout(() => cb(nowMs()), 16);
      const nowMs = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());
      this._epoch = nowMs(); this._lastWall = this._epoch;
      const loop = () => {
        const w = nowMs();
        const dt = w - this._lastWall; this._lastWall = w;
        this.advance(dt);
        this._raf = raf(loop);
      };
      this._raf = raf(loop);
    }

    // advance simulated time by dt ms (host-clock path also uses this)
    advance(dt) {
      if (dt <= 0) return;
      // integrate in bounded steps so thermal/wear stay stable at any dt
      let remain = dt;
      const STEP = 8;
      while (remain > 0) {
        const s = Math.min(STEP, remain);
        this.clock += s;
        this._integratePhysics(s);
        this._service();
        remain -= s;
      }
    }
    tick(dt) { this.advance(dt); } // alias for host integration

    // ---- spindle ----------------------------------------------------------
    _beginSpinUp() {
      this.spinning = true;
      this._spinFrom = this.rpm; this._spinTarget = RPM;
      this._spinStart = this.clock; this._spinDur = SPINUP_MS * (1 - this.rpm / RPM);
    }
    _rpmNow() {
      if (!this.spinning && this.rpm === 0) return 0;
      if (this._spinDur > 0) {
        const t = (this.clock - this._spinStart) / this._spinDur;
        if (t < 1) return this._spinFrom + (this._spinTarget - this._spinFrom) * t;
        this._spinDur = 0; this.rpm = this._spinTarget;
        this._angleRef = this._angle(); this._angleRefTime = this.clock;
      }
      return this.rpm;
    }
    // absolute platter angle (deg). Uses simple integral during spin-up.
    _angle() {
      if (this.rpm >= RPM && this._spinDur === 0) {
        return (this._angleRef + (this.clock - this._angleRefTime) * DEG_PER_MS) % 360;
      }
      // during ramp: angle ~ integral of rpm; approximate with current rpm
      const dps = (this._rpmNow() / 60) * 360 / 1000;
      return (this.clock * dps) % 360;
    }
    get atSpeed() { return this.rpm >= RPM - 1 && this._spinDur === 0; }

    // ---- actuator ---------------------------------------------------------
    _seekTime(fromCyl, toCyl) {
      const d = Math.abs(toCyl - fromCyl);
      if (d === 0) return 0;
      let move;
      const peakTri = Math.sqrt(ACT.accel * d);
      if (peakTri <= ACT.vmax) {
        move = 2 * Math.sqrt(d / ACT.accel);            // triangular profile
      } else {
        const tRamp = ACT.vmax / ACT.accel;
        const dRamp = (ACT.vmax * ACT.vmax) / ACT.accel; // both ramps
        move = 2 * tRamp + (d - dRamp) / ACT.vmax;       // trapezoidal
      }
      // thermal expansion drift + tiny per-seek jitter (unit-specific)
      const drift = 1 + Math.max(0, this.tempC - THERM.idleFloorC) * THERM.seekDriftPerDeg;
      const jitter = 1 + (this.jitterRng() - 0.5) * 0.02;
      return (move + ACT.settleMs) * drift * jitter;
    }
    _cylNow() {
      if (!this._seek) return this.cylinder;
      const t = (this.clock - this._seek.start) / this._seek.dur;
      if (t >= 1) { this.cylinder = this._seek.to; this._seek = null; return this.cylinder; }
      return this._seek.from + (this._seek.to - this._seek.from) * t;
    }

    // ---- thermal + wear integration ---------------------------------------
    _integratePhysics(dt) {
      this._rpmNow(); this._cylNow();
      // heat: spindle friction + cooling toward a moving floor
      const floor = this.spinning ? THERM.idleFloorC : THERM.ambientC;
      if (this.spinning) this.tempC += THERM.spinHeatPerMs * dt * (this.rpm / RPM);
      this.tempC += (floor - this.tempC) * (1 - Math.exp(-THERM.coolPerMs * dt));
      if (this.spinning) this.headHoursMs += dt;

      // thermal recalibration trigger
      if (this.atSpeed && !this.op &&
          Math.abs(this.tempC - this._tempAtLastRecal) >= THERM.recalDeltaC) {
        this._triggerThermalRecal();
      }
    }
    _triggerThermalRecal() {
      const dur = THERM.recalMinMs + this.jitterRng() * (THERM.recalMaxMs - THERM.recalMinMs);
      this._tempAtLastRecal = this.tempC;
      this.recalCount++; this.stats.recals++; this.stats.thermalPauseMs += dur;
      // model as a blocking op that also re-references heads (seek 0 and back)
      this.op = { kind:'thermal-recal', phase:'busy', endsAt:this.clock + dur, restoreCyl:this.cylinder };
      this._beginSeek(this.cylinder, 0);
      this.reg.status = (this.reg.status & ~ST.DRDY) | ST.BSY;
    }

    _beginSeek(fromCyl, toCyl) {
      const dur = this._seekTime(fromCyl, toCyl);
      const dist = Math.abs(toCyl - fromCyl);
      this.seekTotal += dist; this.stats.seeks++;
      this.tempC += THERM.heatPerSeekDeg * dist;
      this._seek = { from:fromCyl, to:toCyl, start:this.clock, dur:Math.max(0.0001, dur) };
      return dur;
    }

    // ---- CHS / LBA --------------------------------------------------------
    lbaToCHS(lba) {
      const spt = this.geo.sectorsPerTrack, h = this.geo.heads;
      const sector = (lba % spt) + 1;
      const t = Math.floor(lba / spt);
      const head = t % h;
      const cyl = Math.floor(t / h);
      return { cyl, head, sector };
    }
    chsToLBA(cyl, head, sector) {
      return (cyl * this.geo.heads + head) * this.geo.sectorsPerTrack + (sector - 1);
    }

    // ---- register interface (authentic ATA surface) -----------------------
    // ports: 0=data,1=err/feat,2=count,3=secnum,4=cyllo,5=cylhi,6=drvhead,7=status/cmd
    readRegister(port) {
      this._service();
      switch (port) {
        case 0: return this._readData();
        case 1: return this.reg.error;
        case 2: return this.reg.sectorCount & 0xff;
        case 3: return this.reg.sectorNumber & 0xff;
        case 4: return this.reg.cylLow & 0xff;
        case 5: return this.reg.cylHigh & 0xff;
        case 6: return this.reg.drvHead & 0xff;
        case 7: this.irq = false; return this.reg.status & 0xff; // reading status clears IRQ
        default: return 0xff;
      }
    }
    writeRegister(port, val) {
      val &= 0xff;
      switch (port) {
        case 0: return this._writeData(val);
        case 1: this.reg.features = val; return;
        case 2: this.reg.sectorCount = val; return;
        case 3: this.reg.sectorNumber = val; return;
        case 4: this.reg.cylLow = val; return;
        case 5: this.reg.cylHigh = val; return;
        case 6: this.reg.drvHead = val; this.head = val & 0x0f; return;
        case 7: return this._startCommand(val);
      }
    }
    // 16-bit data port helpers (PIO moves 256 words/sector)
    _readData() {
      if (!this.xfer || this.xfer.dir !== 'read') return 0xffff;
      const p = this.xfer.pos;
      const lo = this.xfer.arr[p] || 0, hi = this.xfer.arr[p + 1] || 0;
      this.xfer.pos += 2;
      if (this.xfer.pos >= this.xfer.len) this._sectorDrained();
      return lo | (hi << 8);
    }
    _writeData(word) {
      if (!this.xfer || this.xfer.dir !== 'write') return;
      const p = this.xfer.pos;
      this.xfer.arr[p] = word & 0xff; this.xfer.arr[p + 1] = (word >> 8) & 0xff;
      this.xfer.pos += 2;
      if (this.xfer.pos >= this.xfer.len) this._sectorFilled();
    }

    // ---- command dispatch -------------------------------------------------
    _startCommand(cmd, internal) {
      if (!this.powered) return;
      this.reg.command = cmd;
      this.ctrlCycles += CTRL.cmdOverheadCycles;
      if (!internal) this.stats.commands++;
      this.reg.error = 0;
      this.reg.status = (this.reg.status & ~ST.ERR) | ST.BSY;

      // commands that need the drive at speed
      const c = this.geo, r = this.reg;
      const startCyl = ((r.cylHigh & 0xff) << 8) | (r.cylLow & 0xff);
      const startHead = r.drvHead & 0x0f;
      const startSec = r.sectorNumber & 0xff;
      const count = (r.sectorCount === 0) ? 256 : (r.sectorCount & 0xff);

      switch (cmd) {
        case CMD.IDENTIFY:
          this._cmdIdentify(); return;
        case CMD.RECALIBRATE:
          this.op = { kind:'recal', phase:'seek' };
          this._beginSeek(this._cylNow(), 0); return;
        case CMD.SEEK:
          this.op = { kind:'seek', phase:'seek', targetCyl:startCyl };
          this._beginSeek(this._cylNow(), startCyl); return;
        case CMD.INIT_PARAMS:
          // set logical geometry (sectors/track from count, heads from drvHead+1)
          this.geo.sectorsPerTrack = count;
          this.geo.heads = (r.drvHead & 0x0f) + 1;
          this._complete(); return;
        case CMD.DIAGNOSTIC:
          this.op = { kind:'diag', phase:'busy', endsAt:this.clock + 40 };
          this.reg.error = 1; return;
        case CMD.SPINDOWN:
          this.spinning = false; this._spinFrom = this.rpm; this._spinTarget = 0;
          this._spinStart = this.clock; this._spinDur = SPINDOWN_MS; this._complete(); return;
        case CMD.SPINUP:
          this._beginSpinUp(); this._complete(); return;
        case CMD.READ: case CMD.READ_NR:
        case CMD.WRITE: case CMD.WRITE_NR:
        case CMD.VERIFY: case CMD.VERIFY_NR: {
          const lba = this.chsToLBA(startCyl, startHead, startSec);
          if (lba < 0 || lba + count > this.totalSectors) { this._fail(ERR.IDNF); return; }
          const isWrite = (cmd === CMD.WRITE || cmd === CMD.WRITE_NR);
          const isVerify = (cmd === CMD.VERIFY || cmd === CMD.VERIFY_NR);
          const withRetry = (cmd === CMD.READ || cmd === CMD.WRITE || cmd === CMD.VERIFY);
          this.op = { kind:isWrite?'write':(isVerify?'verify':'read'),
                      lba, count, index:0, withRetry, phase:'seek',
                      startCHS:{startCyl,startHead,startSec} };
          const { cyl } = this.lbaToCHS(lba);
          this._beginSeek(this._cylNow(), cyl);
          return;
        }
        default:
          this._fail(ERR.ABRT); return;
      }
    }

    _cmdIdentify() {
      // build a 512-byte IDENTIFY DRIVE response (words little-endian)
      const b = new Uint8Array(512); const w = (i,v)=>{b[i*2]=v&0xff;b[i*2+1]=(v>>8)&0xff;};
      w(0, 0x045A); // fixed drive, soft sectored
      w(1, this.geo.cylinders);
      w(3, this.geo.heads);
      w(6, this.geo.sectorsPerTrack);
      w(21, Math.floor(CTRL.bufferBytes / 512)); // buffer size in 512B units
      const model = ('EMU CP3044 40MB IDE' + ' '.repeat(40)).slice(0,40);
      for (let i=0;i<40;i+=2){ b[54+i]=model.charCodeAt(i+1); b[54+i+1]=model.charCodeAt(i); }
      const caps = this.totalSectors;
      w(1,this.geo.cylinders); w(54,this.geo.cylinders); w(55,this.geo.heads); w(56,this.geo.sectorsPerTrack);
      // LBA capacity (words 60-61)
      b[120]=caps&0xff; b[121]=(caps>>8)&0xff; b[122]=(caps>>16)&0xff; b[123]=(caps>>24)&0xff;
      this._beginTransfer(b, 'read', 512);
      this.reg.status = (this.reg.status & ~ST.BSY) | ST.DRDY | ST.DRQ;
      this.irq = true;
      this.op = { kind:'identify', phase:'xfer' };
    }

    // ---- the running service state machine --------------------------------
    _service() {
      if (!this.powered) return;
      // become ready once spun up (clears the spin-up BSY)
      if (this.atSpeed && !this.op && !this.xfer) {
        this.reg.status = (this.reg.status & ~ST.BSY) | ST.DRDY | ST.DSC;
      }
      const op = this.op; if (!op) return;

      switch (op.kind) {
        case 'thermal-recal':
          if (this.clock >= op.endsAt && !this._seek) {
            // return heads to where they were and resume
            this._beginSeek(0, op.restoreCyl);
            op.kind = 'thermal-recal-return';
          }
          return;
        case 'thermal-recal-return':
          if (!this._seek) { this.op = null; this.reg.status = (this.reg.status & ~ST.BSY) | ST.DRDY | ST.DSC; }
          return;
        case 'diag':
          if (this.clock >= op.endsAt) this._complete();
          return;
        case 'recal':
          if (!this._seek) { this.head = 0; this._complete(ST.DSC); }
          return;
        case 'seek':
          if (!this._seek) this._complete(ST.DSC);
          return;
        case 'identify':
          return; // completes when host drains buffer (_sectorDrained)
      }

      // read / write / verify pipeline
      if (op.phase === 'seek') {
        if (!this._seek) {
          if (!this.atSpeed) return; // must be at speed to read media
          op.phase = 'rotate';
          op.rotateUntil = this.clock + this._rotLatencyTo(op.lba + op.index);
        }
        return;
      }
      if (op.phase === 'rotate') {
        if (this.clock >= op.rotateUntil) {
          const lba = op.lba + op.index;
          if (op.kind === 'read') {
            const sec = this._mediaRead(lba, op.withRetry);
            if (sec.error) { this._fail(sec.error, op.index); return; }
            this._beginTransfer(sec.data, 'read', 512);
            this.reg.status = (this.reg.status & ~ST.BSY) | ST.DRDY | ST.DRQ;
            this.irq = true; op.phase = 'xfer';
          } else if (op.kind === 'write') {
            this._beginTransfer(new Uint8Array(512), 'write', 512);
            this.reg.status = (this.reg.status & ~ST.BSY) | ST.DRQ;
            op.phase = 'xfer';
          } else { // verify: just read+ECC, no host transfer
            const sec = this._mediaRead(lba, op.withRetry);
            if (sec.error) { this._fail(sec.error, op.index); return; }
            op.index++;
            if (op.index >= op.count) this._complete(ST.DSC);
            else { op.phase = 'rotate'; op.rotateUntil = this.clock + this._rotLatencyTo(op.lba + op.index); }
          }
        }
        return;
      }
      // 'xfer' phase waits for host to drain/fill the data register
    }

    _rotLatencyTo(lba) {
      // rotational latency until the target sector passes under the head,
      // plus a head-switch/track cost if we crossed a track boundary.
      const { cyl, head, sector } = this.lbaToCHS(lba);
      let extra = 0;
      if (cyl !== Math.round(this._cylNow())) extra += this._beginSeek(this._cylNow(), cyl); // rare mid-op
      if (head !== this.head) { extra += ACT.headSwitchMs; this.head = head; }
      const target = (sector - 1) * SECTOR_ANGLE;
      const cur = this._angle();
      let delta = (target - cur) % 360; if (delta < 0) delta += 360;
      return delta / DEG_PER_MS + extra + (CTRL.eccCyclesPerSector / CTRL.mcuHz) * 1000;
    }

    _beginTransfer(arr, dir, len) { this.xfer = { arr, dir, len, pos:0 }; }

    _sectorDrained() { // finished pushing a read sector to host
      const op = this.op;
      this.reg.status &= ~ST.DRQ;
      if (op.kind === 'identify') { this.op = null; this.reg.status |= ST.DRDY; this.xfer = null; return; }
      this.stats.bytesRead += 512; this.readTotal++;
      this._afterSector();
    }
    _sectorFilled() { // finished receiving a write sector from host
      const op = this.op; const lba = op.lba + op.index;
      this.reg.status = (this.reg.status & ~ST.DRQ) | ST.BSY;
      this._mediaWrite(lba, this.xfer.arr);
      this.stats.bytesWritten += 512; this.writeTotal++;
      this.xfer = null;
      this._afterSector();
    }
    _afterSector() {
      const op = this.op; op.index++;
      if (op.index >= op.count) {
        this.xfer = null;
        this._complete(ST.DSC);
      } else {
        op.phase = 'rotate';
        this.reg.status = (this.reg.status & ~ST.DRQ) | ST.BSY;
        op.rotateUntil = this.clock + this._rotLatencyTo(op.lba + op.index);
      }
    }

    _complete(extra = 0) {
      this.op = null; this.xfer = null;
      this.reg.status = (ST.DRDY | ST.DSC | extra) & ~ST.BSY & ~ST.DRQ & ~ST.ERR;
      this.irq = true;
    }
    _fail(errBits, atIndex) {
      const op = this.op;
      if (op) {
        const lba = op.lba + (atIndex != null ? atIndex : op.index);
        const chs = this.lbaToCHS(lba);
        this.reg.sectorNumber = chs.sector; this.reg.cylLow = chs.cyl & 0xff;
        this.reg.cylHigh = (chs.cyl >> 8) & 0xff; this.reg.drvHead = (this.reg.drvHead & 0xf0) | chs.head;
        this.reg.sectorCount = op.count - (atIndex != null ? atIndex : op.index);
      }
      this.reg.error = errBits;
      this.reg.status = (ST.DRDY | ST.ERR) & ~ST.BSY & ~ST.DRQ;
      if (errBits & ERR.UNC) this.stats.uncErrors++;
      this.op = null; this.xfer = null; this.irq = true;
    }

    // ---- media access with ECC / retries / wear --------------------------
    _mediaRead(lba, withRetry) {
      this.ctrlCycles += CTRL.eccCyclesPerSector;
      if (this.badSectors.has(lba)) {
        // permanent defect: retries, then uncorrectable
        this.stats.retries += withRetry ? 7 : 0;
        return { error: ERR.UNC | ERR.BBK };
      }
      const weak = this.weakSectors.get(lba) || 0;
      if (weak > 0) {
        // soft error: ECC correctable with retries; count it
        const retries = Math.min(7, 1 + Math.floor(weak));
        this.stats.retries += retries;
        this.reg.status |= ST.CORR;
        if (weak >= 8 && !this._isProtected(lba)) {
          // degraded to permanent bad
          this.badSectors.add(lba); this.weakSectors.delete(lba);
          if (withRetry) { this.stats.retries += 7; }
          return { error: ERR.UNC | ERR.BBK };
        }
      }
      this._accrueWear(lba, 'read');
      const off = lba * 512;
      return { data: this.media.subarray(off, off + 512) };
    }
    _mediaWrite(lba, data) {
      this.ctrlCycles += CTRL.eccCyclesPerSector;
      const off = lba * 512;
      this.media.set(data.subarray(0, 512), off);
      this._accrueWear(lba, 'write');
    }
    _isProtected(lba) { return !this.brutal && lba < this.systemProtectLBA; }
    _accrueWear(lba, kind) {
      if (!this.enableWear) return;
      // stress rises with temperature and head-hours; deterministic per unit.
      const heatFactor = Math.max(0, this.tempC - THERM.idleFloorC) / 20; // 0..~1
      const base = (kind === 'write' ? 0.0016 : 0.0008);
      const stressChance = base * (0.4 + heatFactor);
      if (this._isProtected(lba)) return;
      // deterministic draw keyed by unit seed + lba + op counters
      const r = mulberry32((this.seed ^ (lba * 2654435761)) >>> 0)
                (); // single draw per (seed,lba) baseline defect susceptibility
      const susceptibility = 0.2 + r * 1.6; // some sectors weaker than others
      if (this.jitterRng() < stressChance * susceptibility) {
        this.weakSectors.set(lba, (this.weakSectors.get(lba) || 0) + 1);
      }
    }

    // ---- telemetry snapshot ----------------------------------------------
    telemetry() {
      return {
        clockMs: this.clock,
        powered: this.powered, spinning: this.spinning, atSpeed: this.atSpeed,
        rpm: Math.round(this._rpmNow()),
        cylinder: Math.round(this._cylNow()), head: this.head,
        seeking: !!this._seek,
        angleDeg: +this._angle().toFixed(1),
        tempC: +this.tempC.toFixed(2),
        status: this.reg.status, error: this.reg.error, command: this.reg.command,
        mcuCycles: this.ctrlCycles,
        badSectors: this.badSectors.size, weakSectors: this.weakSectors.size,
        recalCount: this.recalCount,
        seed: this.seed,
        stats: Object.assign({}, this.stats)
      };
    }

    // ---- convenience async layer (polls the register machine) -------------
    _pollUntil(pred, timeoutMs = 60000) {
      return new Promise((resolve, reject) => {
        const startClk = this.clock;
        const check = () => {
          this._service();
          if (pred()) return resolve();
          if (this.clock - startClk > timeoutMs) return reject(new Error('ATA timeout'));
          if (this.selfClock) setTimeout(check, 1);
          else { this.advance(1); check(); }
        };
        check();
      });
    }
    async waitReady() {
      await this._pollUntil(() => this.atSpeed && (this.reg.status & ST.DRDY) && !(this.reg.status & ST.BSY));
    }
    // high-level sector read using the authentic PIO handshake
    async readSectors(lba, count) {
      await this.waitReady();
      const chs = this.lbaToCHS(lba);
      this.writeRegister(2, count & 0xff);
      this.writeRegister(3, chs.sector);
