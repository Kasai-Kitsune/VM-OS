  // natively represent is journalled to a real on-disk file so a warm reboot
  // could rehydrate it. FAT16 stores the bytes; this stores the shape.
  async function writeIndex(root) {
    const idx = JSON.stringify(serialize(root));
    const bytes = new TextEncoder().encode(idx);
    try { await fs.deleteFile('VMOS.IDX'); } catch (e) {}
    await fs.createFile('VMOS.IDX', bytes);
  }
  function serialize(node) {
    if (node.type === 'dir') { const o = { type: 'dir', children: {} }; for (const [k, v] of Object.entries(node.children || {})) o.children[k] = serialize(v); return o; }
    const o = {}; for (const k of Object.keys(node)) { if (k === 'children' || k === '_sig') continue; o[k] = node[k]; } return o;
  }
  function quickHash(u8) {
    let h = 2166136261 >>> 0; const step = Math.max(1, u8.length >> 10);
    for (let i = 0; i < u8.length; i += step) { h ^= u8[i]; h = Math.imul(h, 16777619); }
    return (h >>> 0).toString(16);
  }

  // ---- real defragmentation: read every file, free the volume, rewrite in
  // order so first-fit lays them down contiguously. Every byte moves across
  // the real ATA bus, so the operation takes authentic, physically-modelled
  // time (this is why DEFRAG is slow — it really is moving the platter data).
  async function defrag(progress) {
    if (!ready) return null;
    const files = await bus(() => fs.list());
    const blobs = [];
    for (const f of files) { blobs.push({ name: f.name, data: await bus(() => fs.readFile(f.name)) }); }
    for (const f of files) { await bus(() => fs.deleteFile(f.name)); }
    for (let i = 0; i < blobs.length; i++) {
      await bus(() => fs.createFile(blobs[i].name, blobs[i].data));
      if (progress) progress((i + 1) / blobs.length, blobs[i].name);
    }
    return bus(() => fs.fragmentation());
  }

  // live cluster allocation map for the DEFRAG visualizer, sampled straight
  // from the FAT mirror + the drive's (empty) defect/weak maps
  function allocationMap(cells) {
    if (!ready || !fs || !fs.fatMirror) return null;
    const total = fs.bpb.clusters, out = new Array(cells);
    // build cluster->fragmented lookup by chaining each file
    const frag = new Set();
    return (async () => {
      const files = await bus(() => fs.list());
      for (const f of files) {
        let c = f.cluster, prev = -1, isFrag = false, chain = [];
        let g = 0; while (c >= 2 && c < 0xFFF8 && g++ < 100000) { if (prev >= 0 && c !== prev + 1) isFrag = true; chain.push(c); prev = c; c = fs.fatMirror[c]; }
        if (isFrag) for (const cc of chain) frag.add(cc);
      }
      for (let i = 0; i < cells; i++) {
        const c = 2 + Math.floor(i / cells * total);
        out[i] = (fs.fatMirror[c] !== 0) ? (frag.has(c) ? 'frag' : 'used') : 'free';
      }
      return out;
    })();
  }

  // ---- demand paging ------------------------------------------------------
  const BIN = t => t === 'img' || t === 'wav' || t === 'mp3';

  // Cold read: pull a file's bytes back off the platters. This AWAITS the real
  // head seek + rotational latency + transfer, so the first read of an evicted
  // file costs authentic time — exactly what it did on the physical hardware.
  async function readCold(path) {
    if (!ready) return null;
    const id = pathToId.get(path);
    if (!id) return null;                       // never persisted (shouldn't happen for a cold node)
    return bus(() => fs.readFile(id83(id)));    // real ATA read through the single bus
  }

  // Evict clean, persisted TEXT files from RAM back to cold (content = null),
  // preserving size metadata so capacity accounting stays exact. Binary media
  // is pinned (its faithful bytes live only in RAM for now); any dirty or
  // not-yet-persisted file is left resident so nothing is ever lost.
  function evictClean(root) {
    let freed = 0;
    for (const { path, node } of collect(root)) {
      if (node.content == null || BIN(node.type)) continue;      // already cold / pinned binary
      if (!pathToId.has(path) || !node._sig) continue;           // dirty / unpersisted -> keep resident
      if (node.size == null) node.size = toBytes(node).length;   // stamp size before dropping bytes
      freed += String(node.content).length;
      node.content = null;                                       // -> COLD (must be demand-read)
    }
    return freed;
  }

  return {
    boot, capacity, defrag, allocationMap,
    sync: requestSync,
    flush: () => syncPromise.then(() => bus(() => {})),   // resolves when the volume matches the cache
    read: readCold,                                       // demand-read a cold file's bytes
    evictClean,                                           // drop clean text pages -> cold
    isReady: () => ready,
    telemetry: () => drive && drive.telemetry(),
    fragmentation: () => (ready ? bus(() => fs.fragmentation()) : Promise.resolve(null)),
    get fs() { return fs; }, get drive() { return drive; }
  };
})();

</script>

<!-- ============= EMBEDDED VULP-33 CPU (cycle-accurate core, DOM-free) ============= -->
<script>
/* Vulp-33 32-bit CISC microprocessor, 486-class @ 33 MHz. Lifted verbatim
   from the standalone bench; the diagnostic UI was dropped - engine core only. */
/* =============================================================================
 * VULP-33 Microprocessor — cycle-accurate emulation core
 * -----------------------------------------------------------------------------
 * This file is the "chip": Bus + CPU + Assembler, with ZERO dependency on the
 * DOM or any front-end. It attaches a single object `VULP33` to the global
 * scope (window in a browser, module.exports under node) so it can be dropped
 * into another project unchanged.
 *
 * Design fidelity notes are inline. Everything routes through the Bus so that
 * memory/IO timing is a first-class, emergent property, exactly as the spec
 * demands (see spec §3 and §6).
 * ===========================================================================*/
(function (root) {
  'use strict';

  /* ------------------------------------------------------------------ *
   * Constants: FLAGS bits, CR0 bits, fault vectors, IRQ vector base
   * ------------------------------------------------------------------ */
  const FLAG = {
    CF: 0, PF: 1, ZF: 2, SF: 3, OF: 4, IF: 5, TF: 6, DF: 7, HF: 8,
  };
  const CR0 = {
    CACHE_EN: 0,          // bit 0  cache enable
    WAITSTATE_OVR: 1,     // bit 1  wait-state override (test/debug)
    HALT_ON_FAULT: 31,    // bit 31 halt-on-unhandled-fault
  };
  // Fault vectors occupy the low, fixed slots (spec §7: "fixed vectors 0-4").
  const VEC = { DE: 0, UD: 1, NM: 2, GP: 3, TRAP: 4 };
  // Hardware IRQ n vectors to (IRQ_BASE + n) — period-authentic PC convention
  // (IRQ0 -> INT 08h). Software INT imm8 uses vector = imm8 directly.
  const IRQ_BASE = 8;

  const IVT_BASE = 0x00000000;   // interrupt vector table, 32 entries * 4 bytes
  const IVT_ENTRIES = 32;

  // Special-register ids used by the MOV<->special encodings (opcodes 0x16/0x17)
  const SREG = { IP: 0, SP: 1, BP: 2, FLAGS: 3, INTM: 4, CR0: 5 };

  // A fault is signalled by throwing this so the current instruction unwinds
  // cleanly and step() can vector it, just like real silicon aborting a µ-op.
  class Fault {
    constructor(vector, detail) { this.vector = vector; this.detail = detail || ''; }
  }

  const signext8  = (b) => (b << 24) >> 24;
  const parity8   = (v) => { v &= 0xFF; v ^= v >> 4; v ^= v >> 2; v ^= v >> 1; return (~v) & 1; };

  /* ================================================================== *
   * Cache — single unified, direct-mapped, write-through (spec §1)
   * ------------------------------------------------------------------ *
   * We model tags/validity only (not data) because the authoritative bytes
   * always live in RAM under a write-through policy; the cache exists purely
   * to produce the real hit/miss cycle penalty the spec insists on.
   * ================================================================== */
  class Cache {
    constructor(sizeBytes, lineBytes) {
      this.lineBytes = lineBytes;
      this.numLines = (sizeBytes / lineBytes) | 0;
      this.tags = new Int32Array(this.numLines).fill(-1);
      this.hits = 0;
      this.misses = 0;
    }
    reset() { this.tags.fill(-1); this.hits = 0; this.misses = 0; }
    _index(addr) { const l = (addr / this.lineBytes) | 0; return { line: l % this.numLines, tag: l }; }
    // returns true on hit; on a miss the line is (re)filled.
    access(addr) {
      const { line, tag } = this._index(addr);
      if (this.tags[line] === tag) { this.hits++; return true; }
      this.tags[line] = tag; this.misses++; return false;
    }
    present(addr) { const { line, tag } = this._index(addr); return this.tags[line] === tag; }
    invalidate() { this.tags.fill(-1); }
  }

  /* ================================================================== *
   * Bus — the timed interface between core and the world (spec §3)
   * ------------------------------------------------------------------ *
   * Every access runs the two-state T1/T2 cycle and genuinely accumulates
   * cycles into `pending`, which the CPU drains after each transaction.
   * Peripherals may stretch a cycle via insertWaitStates(); a slow device is
   * ALLOWED to be slow and the core really stalls for it.
   * ================================================================== */
  class Bus {
    constructor(opts) {
      opts = opts || {};
      this.ramSize = opts.ramSize || 0x100000;          // 1 MiB flat RAM
      this.mem = new Uint8Array(this.ramSize);
      this.dv = new DataView(this.mem.buffer);
      this.cache = new Cache(opts.cacheSize || 2048, opts.lineBytes || 16);
      this.ports = new Map();                            // port -> {read, write}
      this.irqLines = 0;                                 // bit n set == IRQ n asserted
      this.pending = 0;                                  // cycles accrued this transaction
      this.cacheEnabled = false;                         // mirrors CR0.bit0
      this.waitOverride = false;                         // mirrors CR0.bit1
      this.onBusEvent = null;                            // optional trace hook
    }
    reset() {
      this.mem.fill(0);
      this.cache.reset();
      this.irqLines = 0;
      this.pending = 0;
    }
    // ---- cycle accounting helpers ----
    _spend(n) { this.pending += n; }
    insertWaitStates(n) { if (!this.waitOverride) this._spend(n); }  // spec: CR0.1 override
    takeCycles() { const c = this.pending; this.pending = 0; return c; }

    _addr(a) { return (a >>> 0) % this.ramSize; }

    // A single memory transaction: T1 (address out) + T2 (data). Cache hit
    // short-circuits the external bus; a miss pays the fill penalty; writes are
    // write-through so they always drive the bus.
    _memCycle(addr, isWrite) {
      if (this.cacheEnabled && !isWrite && this.cache.access(addr)) {
        this._spend(1);                 // cache hit: 0-1 additional cycles (spec §6)
        return;
      }
      if (this.cacheEnabled && isWrite) this.cache.access(addr); // write-through refill/keep
      this._spend(2);                   // T1 + T2 to external memory (miss/uncached/write)
    }

    // ---------- memory reads (little-endian) ----------
    read8 (a) { a = this._addr(a); this._memCycle(a, false); return this.dv.getUint8(a); }
    read16(a) { a = this._addr(a); this._memCycle(a, false); return this.dv.getUint16(a, true); }
    read32(a) { a = this._addr(a); this._memCycle(a, false); return this.dv.getUint32(a, true) >>> 0; }

    // ---------- memory writes (write-through) ----------
    // NOTE: writes are unchecked here; access-rule enforcement (kernel floor ->
    // #GP) lives in the CPU, which owns the protection policy (spec §7).
    write8 (a, v) { a = this._addr(a); this._memCycle(a, true); this.dv.setUint8 (a, v & 0xFF); }
    write16(a, v) { a = this._addr(a); this._memCycle(a, true); this.dv.setUint16(a, v & 0xFFFF, true); }
    write32(a, v) { a = this._addr(a); this._memCycle(a, true); this.dv.setUint32(a, v >>> 0, true); }

    // Loader path: bypasses timing + protection (used to place the image / IVT),
    // exactly like an external programmer writing the part before power-on.
    poke8 (a, v) { this.dv.setUint8 (this._addr(a), v & 0xFF); }
    poke32(a, v) { this.dv.setUint32(this._addr(a), v >>> 0, true); }
    peek8 (a)    { return this.dv.getUint8(this._addr(a)); }
    peek32(a)    { return this.dv.getUint32(this._addr(a), true) >>> 0; }

    // ---------- separate 16-bit I/O port space ----------
    mapPort(port, dev) { this.ports.set(port & 0xFFFF, dev); }
    ioRead(port) {
      port &= 0xFFFF;
      this._spend(2);                          // I/O bus cycle (slow by design)
      const d = this.ports.get(port);
      return d && d.read ? (d.read(port, this) & 0xFFFFFFFF) >>> 0 : 0xFFFFFFFF >>> 0;
    }
    ioWrite(port, val) {
      port &= 0xFFFF;
      this._spend(2);
      const d = this.ports.get(port);
      if (d && d.write) d.write(port, val >>> 0, this);
    }

    // ---------- interrupt lines ----------
    raiseIRQ(line) { this.irqLines |= (1 << (line & 7)); }
    ackIRQ(line)   { this.irqLines &= ~(1 << (line & 7)); }
  }

  /* ================================================================== *
   * ALU — one shared helper per op that computes result AND all flags
   * together, so every instruction that calls it inherits correct flag
   * behaviour automatically (spec §4).
   * ------------------------------------------------------------------ *
   * Each returns { r, cf, zf, sf, of, pf }. The dispatcher applies them.
   * ================================================================== */
  const ALU = {
    _std(r, cf, of) {
      r >>>= 0;
      return { r, cf: cf ? 1 : 0, zf: r === 0 ? 1 : 0, sf: (r >>> 31) & 1, of: of ? 1 : 0, pf: parity8(r) };
    },
    add(a, b, carry) {
      a >>>= 0; b >>>= 0; carry = carry ? 1 : 0;
      const sum = a + b + carry;
      const r = sum >>> 0;
      const cf = sum > 0xFFFFFFFF;
      const of = (~(a ^ b) & (a ^ r) & 0x80000000) !== 0;
      return this._std(r, cf, of);
    },
    sub(a, b, borrow) {
      a >>>= 0; b >>>= 0; borrow = borrow ? 1 : 0;
      const diff = a - b - borrow;
      const r = diff >>> 0;
      const cf = (b + borrow) > a;                     // unsigned borrow
      const of = ((a ^ b) & (a ^ r) & 0x80000000) !== 0;
      return this._std(r, cf, of);
    },
    and(a, b) { return this._std((a & b) >>> 0, false, false); },
    or (a, b) { return this._std((a | b) >>> 0, false, false); },
    xor(a, b) { return this._std((a ^ b) >>> 0, false, false); },
    not(a)    { return { r: (~a) >>> 0 }; },            // NOT does not affect flags
    shl(a, n) {
      a >>>= 0; n &= 31; if (n === 0) return this._std(a, (this._lastCF|0), false, false);
      const cf = ((a >>> (32 - n)) & 1) === 1;
      const r = (a << n) >>> 0;
      const of = n === 1 ? (((r >>> 31) & 1) ^ (cf ? 1 : 0)) === 1 : false;
      return this._std(r, cf, of);
    },
    shr(a, n) {
      a >>>= 0; n &= 31; if (n === 0) return this._std(a, false, false);
      const cf = ((a >>> (n - 1)) & 1) === 1;
      const r = a >>> n;
      const of = n === 1 ? ((a >>> 31) & 1) === 1 : false;
      return this._std(r, cf, of);
    },
    sar(a, n) {
      a |= 0; n &= 31; if (n === 0) return this._std(a >>> 0, false, false);
      const cf = ((a >>> (n - 1)) & 1) === 1;
      const r = (a >> n) >>> 0;                          // arithmetic (sign-propagating)
      return this._std(r, cf, false);
    },
    rol(a, n) {
      a >>>= 0; n &= 31; if (n === 0) return this._std(a, false, false);
      const r = ((a << n) | (a >>> (32 - n))) >>> 0;
      const cf = (r & 1) === 1;
      return this._std(r, cf, false);
    },
    ror(a, n) {
      a >>>= 0; n &= 31; if (n === 0) return this._std(a, false, false);
      const r = ((a >>> n) | (a << (32 - n))) >>> 0;
      const cf = ((r >>> 31) & 1) === 1;
      return this._std(r, cf, false);
    },
    mulu(a, b) {
      const p = BigInt(a >>> 0) * BigInt(b >>> 0);
      const lo = Number(p & 0xFFFFFFFFn) >>> 0;
      const hi = Number((p >> 32n) & 0xFFFFFFFFn) >>> 0;
      return { lo, hi, overflow: hi !== 0 };
    },
    muls(a, b) {
      const p = BigInt(a | 0) * BigInt(b | 0);
      const mask = (1n << 64n) - 1n;
      const u = p & mask;
      const lo = Number(u & 0xFFFFFFFFn) >>> 0;
      const hi = Number((u >> 32n) & 0xFFFFFFFFn) >>> 0;
      // overflow if the high half is not just sign-extension of the low half
      const signExt = (lo >>> 31) ? 0xFFFFFFFF : 0x00000000;
      return { lo, hi, overflow: hi !== signExt };
    },
  };

  /* ================================================================== *
   * CPU — register file, FLAGS, fetch/decode/execute, timing, faults
   * ================================================================== */
  class CPU {
    constructor(bus) {
      this.bus = bus;
      this.R = new Uint32Array(8);          // R0..R7
      this.IP = 0; this.SP = 0; this.BP = 0;
      this.FLAGS = 0; this.INTM = 0; this.CR0v = 0;
      this.halted = false;
      this.faulted = false;                 // set when halt-on-fault traps the core
      this.kernelFloor = 0;                 // writes below this -> #GP (0 disables)
      this.totalCycles = 0;
      this.instrCount = 0;
      this.stage = 'idle';                  // fetch/decode/execute — for the panel
      this.lastMnemonic = '';
      this.log = null;                      // optional (msg,kind)=>void hook
      this.table = this._buildTable();
      this._opStartIP = 0;
    }

    /* ---- convenience accessors ---- */
    getFlag(b) { return (this.FLAGS >>> b) & 1; }
    setFlag(b, v) { if (v) this.FLAGS |= (1 << b); else this.FLAGS &= ~(1 << b); this.FLAGS >>>= 0; }
    _syncCR0() {
      this.bus.cacheEnabled = ((this.CR0v >>> CR0.CACHE_EN) & 1) === 1;
      this.bus.waitOverride = ((this.CR0v >>> CR0.WAITSTATE_OVR) & 1) === 1;
    }

    reset(entry) {
      this.R.fill(0);
      this.IP = entry >>> 0; this.SP = 0; this.BP = 0;
      this.FLAGS = 0; this.INTM = 0; this.CR0v = 0;
      this.halted = false; this.faulted = false;
      this.totalCycles = 0; this.instrCount = 0;
      this.stage = 'idle'; this.lastMnemonic = '';
      this.bus.cache.invalidate();
      this._syncCR0();
    }

    /* ---- instruction stream fetch (advances IP, uses cache path) ---- */
    fetch8()  { const v = this.bus.read8(this.IP);  this.IP = (this.IP + 1) >>> 0; return v; }
    fetch16() { const v = this.bus.read16(this.IP); this.IP = (this.IP + 2) >>> 0; return v; }
    fetch32() { const v = this.bus.read32(this.IP); this.IP = (this.IP + 4) >>> 0; return v >>> 0; }

    /* ---- stack ---- */
    push32(v) { this.SP = (this.SP - 4) >>> 0; this._wr32(this.SP, v); }
    pop32()   { const v = this.bus.read32(this.SP); this.SP = (this.SP + 4) >>> 0; return v >>> 0; }

    /* ---- protected write (kernel-floor rule -> #GP) ---- */
    _wr8 (a, v) { if ((a >>> 0) < this.kernelFloor) throw new Fault(VEC.GP, 'write below kernel floor'); this.bus.write8 (a, v); }
    _wr16(a, v) { if ((a >>> 0) < this.kernelFloor) throw new Fault(VEC.GP, 'write below kernel floor'); this.bus.write16(a, v); }
    _wr32(a, v) { if ((a >>> 0) < this.kernelFloor) throw new Fault(VEC.GP, 'write below kernel floor'); this.bus.write32(a, v); }

    /* ---- mod-reg-rm decode (spec §4) ---- */
    readModRM() { const b = this.fetch8(); return { mode: (b >>> 6) & 3, reg: (b >>> 3) & 7, rm: b & 7 }; }
    // Resolve the *source* operand described by a modrm byte. Returns the value
    // and (for memory forms) its effective address. Consumes disp/imm bytes.
    resolveSrc(m) {
      switch (m.mode) {
        case 0: return { val: this.R[m.rm] >>> 0, addr: null };                 // reg
        case 1: { const d = signext8(this.fetch8()); const a = (this.R[m.rm] + d) >>> 0; return { val: this.bus.read32(a), addr: a }; }
        case 2: { const d = this.fetch32() | 0;      const a = (this.R[m.rm] + d) >>> 0; return { val: this.bus.read32(a), addr: a }; }
        case 3: return { val: this.fetch32() >>> 0, addr: null };               // imm32
      }
    }
    // Resolve just the effective address of a memory modrm operand (LEA / stores).
    resolveAddr(m) {
      if (m.mode === 1) { const d = signext8(this.fetch8()); return (this.R[m.rm] + d) >>> 0; }
      if (m.mode === 2) { const d = this.fetch32() | 0;      return (this.R[m.rm] + d) >>> 0; }
      throw new Fault(VEC.UD, 'memory operand required');
    }

    applyFlags(f) {
      if ('cf' in f) this.setFlag(FLAG.CF, f.cf);
      if ('pf' in f) this.setFlag(FLAG.PF, f.pf);
      if ('zf' in f) this.setFlag(FLAG.ZF, f.zf);
      if ('sf' in f) this.setFlag(FLAG.SF, f.sf);
      if ('of' in f) this.setFlag(FLAG.OF, f.of);
    }

    addCycles(n) { this._extra += n; }

    _readSReg(id) {
      switch (id) {
        case SREG.IP: return this.IP; case SREG.SP: return this.SP; case SREG.BP: return this.BP;
        case SREG.FLAGS: return this.FLAGS; case SREG.INTM: return this.INTM; case SREG.CR0: return this.CR0v;
      }
      throw new Fault(VEC.UD, 'bad sreg');
    }
    _writeSReg(id, v) {
      v >>>= 0;
      switch (id) {
        case SREG.IP: this.IP = v; break; case SREG.SP: this.SP = v; break; case SREG.BP: this.BP = v; break;
        case SREG.FLAGS: this.FLAGS = v; break; case SREG.INTM: this.INTM = v; break;
        case SREG.CR0: this.CR0v = v; this._syncCR0(); break;
        default: throw new Fault(VEC.UD, 'bad sreg');
      }
    }

    /* ================= single step ================= */
    step() {
      if (this.faulted) return 0;
      // Sample interrupts between instructions (also wakes a HLTed core).
      this._serviceInterrupts();
      if (this.halted) { this.totalCycles += 1; return 1; }  // idle clock while halted

      this._extra = 0;
      this._opStartIP = this.IP;
      this.stage = 'fetch';
      let cycles;
      try {
        const opcode = this.fetch8();
        const e = this.table[opcode];
        this.stage = 'decode';
        if (!e) throw new Fault(VEC.UD, 'opcode 0x' + opcode.toString(16));
        this.lastMnemonic = e.mnemonic;
        this.stage = 'execute';
        e.exec(this);
        cycles = e.cycles + this._extra + this.bus.takeCycles();
      } catch (err) {
        if (err instanceof Fault) {
          cycles = 6 + this.bus.takeCycles();   // fault detection/vector overhead
          this.IP = this._opStartIP;            // faulting IP is what gets pushed
          this._vector(err.vector, true, err.detail);
          cycles += this.bus.takeCycles();
        } else { throw err; }
      }
      this.totalCycles += cycles;
      this.instrCount++;
      return cycles;
    }

    /* ---- deliver an interrupt/fault through the vector table ---- */
    _vector(vector, isFault, detail) {
      const handler = this.bus.peek32(IVT_BASE + vector * 4);   // read IVT untimed
      if (handler === 0) {                                      // unhandled
        if (this.log) this.log('unhandled vector ' + vector + (detail ? ' (' + detail + ')' : ''), 'fault');
        if ((this.CR0v >>> CR0.HALT_ON_FAULT) & 1) {            // CR0.31 == 1 -> halt debuggable
          this.faulted = true; this.halted = true; this.stage = 'faulted';
        } else {                                                // CR0.31 == 0 -> reset core
          if (this.log) this.log('core reset by unhandled fault', 'fault');
          this.reset(this._opStartIP & 0);                      // reset to 0
        }
        return;
      }
      this.push32(this.FLAGS);
      this.push32(this.IP);
      this.setFlag(FLAG.IF, 0);           // interrupts off inside handler
      this.setFlag(FLAG.TF, 0);           // and single-step off
      this.setFlag(FLAG.HF, 0);           // clear halt-pending
      this.halted = false;
      this.IP = handler >>> 0;
      if (this.log) this.log((isFault ? 'fault ' : 'INT ') + 'vector ' + vector + ' -> 0x' + handler.toString(16), isFault ? 'fault' : 'irq');
    }

    _serviceInterrupts() {
      if (this.faulted) return;
      if (!this.getFlag(FLAG.IF)) return;
      const pending = this.bus.irqLines & this.INTM & 0xFF;
      if (!pending) return;
      // lowest line number == highest priority (spec §5)
      for (let line = 0; line < 8; line++) {
        if (pending & (1 << line)) {
          this.bus.ackIRQ(line);
          this._vector(IRQ_BASE + line, false, 'IRQ' + line);
          return;
        }
      }
    }

    /* =============================================================== *
     * Decode table — flat 256-entry dispatch (spec §4).
     * Each execute() pulls whatever operand bytes it needs from the
     * stream, so the table stays a pure {mnemonic, exec, cycles} map.
     * =============================================================== */
    _buildTable() {
      const t = new Array(256).fill(null);
      const def = (op, mnemonic, cycles, exec) => { t[op] = { mnemonic, cycles, exec }; };

      // Two-operand helper: dest = R[reg], src per modrm mode. `fn(dstVal,srcVal)`
      // returns {r, ...flags}; writeback controlled by `store`.
      const two = (op, mnemonic, base, fn, opts) => {
        opts = opts || {};
        def(op, mnemonic, base, (c) => {
          const m = c.readModRM();
          const s = c.resolveSrc(m);
          if (s.addr !== null) c.addCycles(2);        // register-memory ALU penalty (spec §6)
          const dst = c.R[m.reg] >>> 0;
          const res = fn(dst, s.val, c);
          if (res && 'cf' in res) c.applyFlags(res);
          if (!opts.noWrite && res && 'r' in res) c.R[m.reg] = res.r >>> 0;
        });
      };

      /* ---------------- misc / no-operand ---------------- */
      def(0x00, 'NOP',   1, () => {});
      def(0x01, 'HLT',   1, (c) => { c.halted = true; c.setFlag(FLAG.HF, 1); });
      def(0x02, 'CLC',   1, (c) => c.setFlag(FLAG.CF, 0));
      def(0x03, 'STC',   1, (c) => c.setFlag(FLAG.CF, 1));
      def(0x04, 'CMC',   1, (c) => c.setFlag(FLAG.CF, c.getFlag(FLAG.CF) ^ 1));
      def(0x05, 'CLI',   1, (c) => c.setFlag(FLAG.IF, 0));
      def(0x06, 'STI',   1, (c) => c.setFlag(FLAG.IF, 1));
      def(0x07, 'PUSHF', 3, (c) => c.push32(c.FLAGS));
      def(0x08, 'POPF',  3, (c) => { c.FLAGS = c.pop32(); });
      def(0x09, 'IRET', 12, (c) => { c.IP = c.pop32(); c.FLAGS = c.pop32(); });
      def(0x0A, 'RET',   5, (c) => { c.IP = c.pop32(); });
      def(0x0B, 'LEAVE', 4, (c) => { c.SP = c.BP >>> 0; c.BP = c.pop32(); });

      /* ---------------- data movement ---------------- */
      def(0x10, 'MOV', 1, (c) => {                     // MOV r, (r|[r+d]|imm)
        const m = c.readModRM(); const s = c.resolveSrc(m);
        if (s.addr !== null) c.addCycles(2);
        c.R[m.reg] = s.val >>> 0;
      });
      def(0x11, 'MOV', 2, (c) => {                     // MOV [r+d], r
        const m = c.readModRM(); const a = c.resolveAddr(m);
        c.addCycles(2); c._wr32(a, c.R[m.reg]);
      });
      def(0x12, 'LEA', 1, (c) => {                     // LEA r, [r+d]
        const m = c.readModRM(); const a = c.resolveAddr(m); c.R[m.reg] = a >>> 0;
      });
      def(0x13, 'XCHG', 2, (c) => {                    // XCHG r, r
        const m = c.readModRM(); const tmp = c.R[m.reg]; c.R[m.reg] = c.R[m.rm]; c.R[m.rm] = tmp;
      });
      def(0x14, 'PUSH', 3, (c) => { const r = c.fetch8() & 7; c.push32(c.R[r]); });
      def(0x15, 'POP',  3, (c) => { const r = c.fetch8() & 7; c.R[r] = c.pop32(); });
      def(0x16, 'MOV',  2, (c) => { const r = c.fetch8() & 7; const s = c.fetch8() & 7; c.R[r] = c._readSReg(s) >>> 0; }); // MOV r, sreg
      def(0x17, 'MOV',  2, (c) => { const s = c.fetch8() & 7; const r = c.fetch8() & 7; c._writeSReg(s, c.R[r]); });      // MOV sreg, r
      def(0x18, 'ENTER',5, (c) => { const sz = c.fetch32() >>> 0; c.push32(c.BP); c.BP = c.SP >>> 0; c.SP = (c.SP - sz) >>> 0; });
      def(0x1A, 'MOV',  3, (c) => { const r = c.fetch8() & 7; const a = c.fetch32() >>> 0; c.addCycles(2); c.R[r] = c.bus.read32(a) >>> 0; }); // MOV r, [abs]
      def(0x1B, 'MOV',  3, (c) => { const a = c.fetch32() >>> 0; const r = c.fetch8() & 7; c.addCycles(2); c._wr32(a, c.R[r]); });            // MOV [abs], r

      /* ---------------- arithmetic / logic ---------------- */
      two(0x20, 'ADD',  1, (a, b)    => ALU.add(a, b, 0));
      two(0x21, 'ADC',  1, (a, b, c) => ALU.add(a, b, c.getFlag(FLAG.CF)));
      two(0x22, 'SUB',  1, (a, b)    => ALU.sub(a, b, 0));
      two(0x23, 'SBB',  1, (a, b, c) => ALU.sub(a, b, c.getFlag(FLAG.CF)));
      two(0x24, 'CMP',  1, (a, b)    => ALU.sub(a, b, 0), { noWrite: true });
      two(0x25, 'AND',  1, (a, b)    => ALU.and(a, b));
      two(0x26, 'OR',   1, (a, b)    => ALU.or(a, b));
      two(0x27, 'XOR',  1, (a, b)    => ALU.xor(a, b));
      two(0x28, 'TEST', 1, (a, b)    => ALU.and(a, b), { noWrite: true });
      two(0x29, 'SHL',  1, (a, b)    => ALU.shl(a, b));
      two(0x2A, 'SHR',  1, (a, b)    => ALU.shr(a, b));
      two(0x2B, 'SAR',  1, (a, b)    => ALU.sar(a, b));
      two(0x2C, 'ROL',  1, (a, b)    => ALU.rol(a, b));
      two(0x2D, 'ROR',  1, (a, b)    => ALU.ror(a, b));

      def(0x30, 'INC', 1, (c) => { const r = c.fetch8() & 7; const f = ALU.add(c.R[r], 1, 0); c.R[r] = f.r; c.setFlag(FLAG.ZF, f.zf); c.setFlag(FLAG.SF, f.sf); c.setFlag(FLAG.OF, f.of); c.setFlag(FLAG.PF, f.pf); }); // INC preserves CF
      def(0x31, 'DEC', 1, (c) => { const r = c.fetch8() & 7; const f = ALU.sub(c.R[r], 1, 0); c.R[r] = f.r; c.setFlag(FLAG.ZF, f.zf); c.setFlag(FLAG.SF, f.sf); c.setFlag(FLAG.OF, f.of); c.setFlag(FLAG.PF, f.pf); });
      def(0x32, 'NOT', 1, (c) => { const r = c.fetch8() & 7; c.R[r] = (~c.R[r]) >>> 0; });

      // MUL/IMUL/DIV/IDIV use the register pair (reg, (reg+1)&7): low/hi & dividend.
      const muldivCycles = (a, b) => {
        const mag = Math.max(a >>> 0, b >>> 0);
        const bits = mag === 0 ? 1 : (32 - Math.clz32(mag));
        return Math.min(40, 13 + bits);                // 13..40 by operand magnitude (spec §6)
      };
      two(0x33, 'MUL', 13, (a, b, c) => {
        const m = ALU.mulu(a, b); c.addCycles(muldivCycles(a, b) - 13);
        c._mulPair(m); return { cf: m.overflow, of: m.overflow };
      }, { noWrite: true });
      two(0x34, 'IMUL', 13, (a, b, c) => {
        const m = ALU.muls(a, b); c.addCycles(muldivCycles(a, b) - 13);
        c._mulPair(m); return { cf: m.overflow, of: m.overflow };
      }, { noWrite: true });
      two(0x35, 'DIV', 13, (a, b, c) => { c._divPair(a, b, false); }, { noWrite: true });
      two(0x36, 'IDIV', 13, (a, b, c) => { c._divPair(a, b, true); }, { noWrite: true });

      /* ---------------- control flow ---------------- */
      // Relative branches: target = IP(after imm32) + disp32.
      const branch = (op, mnemonic, cond) => {
        def(op, mnemonic, 1, (c) => {
          const disp = c.fetch32() | 0;
          if (cond(c)) { c.IP = (c.IP + disp) >>> 0; c.addCycles(2); }  // taken adds pipeline refill -> 3 total
        });
      };
      branch(0x40, 'JMP', () => true);
      branch(0x41, 'JZ',  (c) => c.getFlag(FLAG.ZF));
      branch(0x42, 'JNZ', (c) => !c.getFlag(FLAG.ZF));
      branch(0x43, 'JC',  (c) => c.getFlag(FLAG.CF));
      branch(0x44, 'JNC', (c) => !c.getFlag(FLAG.CF));
      branch(0x45, 'JG',  (c) => !c.getFlag(FLAG.ZF) && (c.getFlag(FLAG.SF) === c.getFlag(FLAG.OF)));
      branch(0x46, 'JL',  (c) => c.getFlag(FLAG.SF) !== c.getFlag(FLAG.OF));
      branch(0x47, 'JGE', (c) => c.getFlag(FLAG.SF) === c.getFlag(FLAG.OF));
      branch(0x48, 'JLE', (c) => c.getFlag(FLAG.ZF) || (c.getFlag(FLAG.SF) !== c.getFlag(FLAG.OF)));
      branch(0x49, 'JO',  (c) => c.getFlag(FLAG.OF));
      branch(0x4A, 'JNO', (c) => !c.getFlag(FLAG.OF));
      branch(0x4B, 'JS',  (c) => c.getFlag(FLAG.SF));
      branch(0x4C, 'JNS', (c) => !c.getFlag(FLAG.SF));
      def(0x4D, 'CALL', 5, (c) => { const disp = c.fetch32() | 0; c.push32(c.IP); c.IP = (c.IP + disp) >>> 0; });
      def(0x4E, 'LOOP', 3, (c) => {                         // LOOP uses R7 as the count register
        const disp = c.fetch32() | 0; c.R[7] = (c.R[7] - 1) >>> 0;
        if (c.R[7] !== 0) { c.IP = (c.IP + disp) >>> 0; c.addCycles(1); }
      });

      /* ---------------- I/O ---------------- */
      def(0x50, 'IN',  4, (c) => { const r = c.fetch8() & 7; const p = c.fetch16(); c.R[r] = c.bus.ioRead(p) >>> 0; });
      def(0x51, 'OUT', 4, (c) => { const p = c.fetch16(); const r = c.fetch8() & 7; c.bus.ioWrite(p, c.R[r]); });

      /* ---------------- interrupts ---------------- */
      def(0x60, 'INT', 12, (c) => { const v = c.fetch8(); c._vector(v, false, 'INT ' + v); });

      /* ---------------- explicit FPU-class trap (spec §7 #NM) ---------------- */
      // A representative "FPU" opcode slot: attempting it on this FPU-less part
      // raises device-not-available, exactly as a soft-float stub would expect.
      def(0x70, 'FPUOP', 1, () => { throw new Fault(VEC.NM, 'no FPU present'); });

      return t;
    }

    _mulPair(m) {
      // low half -> current reg (written by dispatcher? no—MUL is noWrite), so
      // we write both halves here explicitly to the pair (reg, (reg+1)&7).
      // The dispatcher passed reg via closure? We recompute from _curReg.
      const d = this._curReg; const hi = (d + 1) & 7;
      this.R[d] = m.lo >>> 0; this.R[hi] = m.hi >>> 0;
    }
    _divPair(a, b, signed) {
      const d = this._curReg; const hi = (d + 1) & 7;
      if ((b >>> 0) === 0) throw new Fault(VEC.DE, 'divide by zero');
      const lo = BigInt(a >>> 0), high = BigInt(this.R[hi] >>> 0);
      let dividend, divisor, q, r;
      if (!signed) {
        dividend = (high << 32n) | lo; divisor = BigInt(b >>> 0);
        q = dividend / divisor; r = dividend % divisor;
        if (q > 0xFFFFFFFFn) throw new Fault(VEC.DE, 'quotient overflow');
      } else {
        const sHigh = BigInt(this.R[hi] | 0);
        dividend = (sHigh << 32n) | BigInt(a >>> 0); divisor = BigInt(b | 0);
        q = dividend / divisor; r = dividend % divisor;    // BigInt truncates toward zero
        if (q > 0x7FFFFFFFn || q < -0x80000000n) throw new Fault(VEC.DE, 'quotient overflow');
      }
      this.R[d] = Number(q & 0xFFFFFFFFn) >>> 0;
      this.R[hi] = Number(r & 0xFFFFFFFFn) >>> 0;
    }
  }

  // Patch: the two()/MUL/DIV helpers need reg index. Wrap readModRM path so the
  // multiply/divide handlers know their destination register. We stash it.
  const _origReadModRM = CPU.prototype.readModRM;
  CPU.prototype.readModRM = function () { const m = _origReadModRM.call(this); this._curReg = m.reg; return m; };

  /* ================================================================== *
   * Assembler — tiny two-pass mnemonic -> opcode-byte translator (spec §8)
   * ================================================================== */
  const REG = {}; for (let i = 0; i < 8; i++) REG['R' + i] = i;
  const SREG_NAME = { IP: SREG.IP, SP: SREG.SP, BP: SREG.BP, FLAGS: SREG.FLAGS, INTM: SREG.INTM, CR0: SREG.CR0 };

  class Assembler {
    constructor() { this.reset(); }
    reset() { this.labels = {}; this.bytes = []; this.fixups = []; this.listing = []; }

    static parseNum(tok, labels) {
      tok = tok.trim();
      if (tok in (labels || {})) return { val: labels[tok], label: null };
      if (/^-?0x[0-9a-fA-F]+$/.test(tok)) return { val: parseInt(tok, 16) >>> 0, label: null };
      if (/^-?\d+$/.test(tok)) return { val: (parseInt(tok, 10)) >>> 0, label: null };
      if (/^[A-Za-z_.][\w.]*$/.test(tok)) return { val: 0, label: tok };   // forward ref
      throw new Error('bad number/label: "' + tok + '"');
    }

    // returns one of:
    //  {kind:'reg', n}  {kind:'sreg', id}  {kind:'imm', val, label}
    //  {kind:'mem', base, disp, label}  {kind:'abs', val, label}
    parseOperand(tok, labels) {
      tok = tok.trim();
      const up = tok.toUpperCase();
      if (up in REG) return { kind: 'reg', n: REG[up] };
      if (up in SREG_NAME) return { kind: 'sreg', id: SREG_NAME[up] };
      if (tok[0] === '[') {
        const inner = tok.slice(1, tok.indexOf(']')).trim();
        const mreg = inner.match(/^(R[0-7])\s*([+-]\s*[^\]]+)?$/i);
        if (mreg) {
          const base = REG[mreg[1].toUpperCase()];
          let disp = 0, label = null;
          if (mreg[2]) {
            const sign = mreg[2].trim()[0] === '-' ? -1 : 1;
            const rest = mreg[2].trim().slice(1).trim();
            const p = Assembler.parseNum(rest, labels);
            if (p.label) label = p.label; else disp = sign * (p.val | 0);
          }
          return { kind: 'mem', base, disp, label };
        }
        const p = Assembler.parseNum(inner, labels);       // [abs] or [label]
        return { kind: 'abs', val: p.val, label: p.label };
      }
      const p = Assembler.parseNum(tok, labels);
      return { kind: 'imm', val: p.val, label: p.label };
    }

    // split "OP a, b" honoring [..] which may contain nothing tricky here
    static splitOperands(s) {
      if (!s.trim()) return [];
      return s.split(',').map((x) => x.trim()).filter((x) => x.length);
    }

    emit8(v) { this.bytes.push(v & 0xFF); }
    emit32(v) { v >>>= 0; this.bytes.push(v & 0xFF, (v >>> 8) & 0xFF, (v >>> 16) & 0xFF, (v >>> 24) & 0xFF); }
    emitModRM(mode, reg, rm) { this.emit8(((mode & 3) << 6) | ((reg & 7) << 3) | (rm & 7)); }
    // record a spot to patch a 32-bit value once labels are known
    fixup(label, pos, rel) { this.fixups.push({ label, pos, rel, from: rel ? pos + 4 : 0 }); }

    // Encode the "dest reg, src operand" family (ALU + MOV load form).
    encodeRegSrc(op, dst, src) {
      this.emit8(op);
      if (src.kind === 'reg')  { this.emitModRM(0, dst.n, src.n); return; }
      if (src.kind === 'imm')  { this.emitModRM(3, dst.n, 0); this._imm32(src); return; }
      if (src.kind === 'mem')  {
        const useD32 = src.label || src.disp > 127 || src.disp < -128;
        this.emitModRM(useD32 ? 2 : 1, dst.n, src.base);
        if (useD32) { const pos = this.bytes.length; if (src.label) this.fixup(src.label, pos, false); this.emit32(src.disp >>> 0); }
        else this.emit8(src.disp & 0xFF);
        return;
      }
      throw new Error('unsupported source operand');
    }
    _imm32(op) { const pos = this.bytes.length; if (op.label) this.fixup(op.label, pos, false); this.emit32(op.val >>> 0); }

    assemble(source, loadAddr) {
      this.reset();
      loadAddr = loadAddr >>> 0;
      this.loadAddr = loadAddr;
      const lines = source.split(/\r?\n/);

      // ---- PASS 1: strip comments, capture labels with provisional addresses ----
      const insns = [];
      let addr = loadAddr;
      for (let ln = 0; ln < lines.length; ln++) {
        let line = lines[ln].replace(/;.*$/, '').trim();
        if (!line) continue;
        // labels (possibly multiple leading "name:")
        let m;
        while ((m = line.match(/^([A-Za-z_.][\w.]*)\s*:\s*/))) {
          this.labels[m[1]] = addr;            // provisional; refined in pass 2 sizing
          line = line.slice(m[0].length).trim();
        }
        if (!line) continue;
        const sp = line.indexOf(' ');
        const mnem = (sp < 0 ? line : line.slice(0, sp)).toUpperCase();
        const rest = sp < 0 ? '' : line.slice(sp + 1);
        const size = this._sizeOf(mnem, rest);
        insns.push({ ln: ln + 1, mnem, rest, addr });
        addr += size;
      }

      // ---- PASS 2: emit, resolving labels ----
      for (const ins of insns) {
        const start = this.bytes.length;
        this._encode(ins);
        this.listing.push({ line: ins.ln, addr: ins.addr, mnem: ins.mnem, rest: ins.rest,
          bytes: this.bytes.slice(start) });
      }
      // resolve fixups
      for (const f of this.fixups) {
        if (!(f.label in this.labels)) throw new Error('undefined label: ' + f.label);
        const target = this.labels[f.label];
        let v;
        if (f.rel) v = (target - (loadAddr + f.from)) >>> 0;    // relative to next-IP
        else v = target >>> 0;                                  // absolute
        this.bytes[f.pos]     = v & 0xFF;
        this.bytes[f.pos + 1] = (v >>> 8) & 0xFF;
        this.bytes[f.pos + 2] = (v >>> 16) & 0xFF;
        this.bytes[f.pos + 3] = (v >>> 24) & 0xFF;
      }
      return { bytes: Uint8Array.from(this.bytes), labels: this.labels, listing: this.listing, loadAddr };
    }

    // compute encoded size without emitting (labels not needed for size except mem)
    _sizeOf(mnem, rest) {
      const ops = Assembler.splitOperands(rest);
      const NOARG = ['NOP','HLT','CLC','STC','CMC','CLI','STI','PUSHF','POPF','IRET','RET','LEAVE'];
      if (NOARG.includes(mnem)) return 1;
      if (['PUSH','POP','INC','DEC','NOT'].includes(mnem)) return 2;    // opcode + regbyte
      if (mnem === 'ENTER') return 5;                                  // opcode + imm32
      if (mnem === 'INT') return 2;                                    // opcode + imm8
      if (['JMP','JZ','JNZ','JC','JNC','JG','JL','JGE','JLE','JO','JNO','JS','JNS','CALL','LOOP'].includes(mnem)) return 5;
      if (mnem === 'IN')  return 4;   // op + regbyte + port16
      if (mnem === 'OUT') return 4;   // op + port16 + regbyte
      if (mnem === 'FPUOP') return 1;
      // MOV / ALU family — depends on operands
      if (mnem === 'MOV') return this._sizeMov(ops);
      if (['ADD','ADC','SUB','SBB','CMP','AND','OR','XOR','TEST','SHL','SHR','SAR','ROL','ROR','MUL','IMUL','DIV','IDIV'].includes(mnem))
        return this._sizeRegSrc(ops);
      if (['LEA'].includes(mnem)) return this._sizeMem(ops[1]);   // opcode+modrm(+disp)
      if (mnem === 'XCHG') return 2;
      throw new Error('unknown mnemonic "' + mnem + '"');
    }
    _memSize(opStr) {
      // returns bytes for modrm memory operand disp: mode1 -> 1, mode2 -> 4
      const o = this.parseOperand(opStr, this.labels);
      if (o.kind !== 'mem') return 0;
      const d32 = o.label || o.disp > 127 || o.disp < -128;
      return d32 ? 4 : 1;
    }
    _sizeMem(opStr) { return 1 + 1 + this._memSize(opStr); } // opcode + modrm + disp
    _sizeRegSrc(ops) {
      const src = this.parseOperand(ops[1], this.labels);
      if (src.kind === 'reg') return 2;                 // opcode + modrm
      if (src.kind === 'imm') return 6;                 // opcode + modrm + imm32
      if (src.kind === 'mem') return 2 + (src.label || src.disp > 127 || src.disp < -128 ? 4 : 1);
      throw new Error('bad ALU source');
    }
    _sizeMov(ops) {
      const dst = this.parseOperand(ops[0], this.labels);
      const src = this.parseOperand(ops[1], this.labels);
      if (dst.kind === 'reg' && src.kind === 'sreg') return 3;   // 0x16 op+r+s
      if (dst.kind === 'sreg' && src.kind === 'reg') return 3;   // 0x17
      if (dst.kind === 'reg' && src.kind === 'abs') return 6;    // 0x1A op+reg+imm32
      if (dst.kind === 'abs' && src.kind === 'reg') return 6;    // 0x1B op+imm32+reg
      if (dst.kind === 'reg') return this._sizeRegSrc(ops);      // 0x10 reg,(r|imm|mem)
      if (dst.kind === 'mem') return 2 + (dst.label || dst.disp > 127 || dst.disp < -128 ? 4 : 1); // 0x11
      if (dst.kind === 'sreg') throw new Error('cannot MOV an immediate/memory into a special register (' +
        ops[0] + '); load a GPR first, e.g. "MOV R0, ' + ops[1] + '" then "MOV ' + ops[0] + ', R0"');
      throw new Error('bad MOV form: ' + ops.join(', '));
    }

    _encode(ins) {
      const { mnem, rest } = ins;
      const ops = Assembler.splitOperands(rest);
      const P = (i) => this.parseOperand(ops[i], this.labels);
      const simple = {
        NOP:0x00,HLT:0x01,CLC:0x02,STC:0x03,CMC:0x04,CLI:0x05,STI:0x06,
        PUSHF:0x07,POPF:0x08,IRET:0x09,RET:0x0A,LEAVE:0x0B,FPUOP:0x70,
      };
      if (mnem in simple) { this.emit8(simple[mnem]); return; }

      const regOnly = { PUSH:0x14, POP:0x15, INC:0x30, DEC:0x31, NOT:0x32 };
      if (mnem in regOnly) { this.emit8(regOnly[mnem]); this.emit8(P(0).n & 7); return; }

      if (mnem === 'ENTER') { this.emit8(0x18); this._imm32(P(0)); return; }
      if (mnem === 'INT')   { this.emit8(0x60); this.emit8(P(0).val & 0xFF); return; }

      const branchOp = { JMP:0x40,JZ:0x41,JNZ:0x42,JC:0x43,JNC:0x44,JG:0x45,JL:0x46,

 *
 * The Vulp-33 is a cycle-accurate 32-bit CISC core (486-class, 33 MHz). This
 * bridge installs it as an always-on physical chip: from power-on it never
 * stops executing. Between jobs it runs a genuine firmware idle loop - STI then
 * HLT - waking ~100x/second on the timer IRQ, exactly like real silicon parked
 * in a halt state. Work the OS needs done (spinning up a program, its RAM
 * working set) is POSTED to the chip through a mailbox + interrupt, and the
 * wall-clock time it takes is dictated by the 33 MHz core, not the host.
 *
 * REAL-TIME BY DESIGN (same contract as the disk): 1 simulated second = 1 wall
 * second at 33 MHz. Idle is fast-forwarded (a halted core only counts cycles),
 * so parking is cheap, but every executed instruction costs its true cycles.
 * The physical RAM is sized to match the machine (VMRES pool), so the chip is
 * bound by the same memory the rest of the box advertises.

  'use strict';
  const HZ = 33_000_000;                 // 33 MHz
  const TIMER_HZ = 100;                  // 100 Hz system tick
  const TIMER_PERIOD = (HZ / TIMER_HZ) | 0;
  const MAX_FRAME_CYC = (HZ / 20) | 0;   // cap catch-up after a stall (<=50 ms)

  // shared mailbox (JS <-> firmware); addresses fixed in the memory map
  const CMD = 0xC00, ARG = 0xC04, DONE = 0xC08, TICKS = 0xC0C;
  const FW_ENTRY = 0x400, LOAD_AREA = 0x10000;
  const SETUP_WORDS_PER_KB = 256;        // a program's RAM working set = full footprint

  let bus = null, cpu = null, asm = null;
  let ready = false, running = false;
  let timerAcc = 0, pump = null, lastWall = 0;
  let ttySink = null, ttyBuffer = '';
  let jobQueue = [], activeJob = null;

  const now = () => (typeof performance !== 'undefined' ? performance.now() : Date.now());

  // ---- firmware: IVT + timer ISR + always-on dispatch/idle + load service --
  // Written in real Vulp-33 assembly and executed by the core itself. The
  // dispatch loop polls the mailbox; a non-zero CMD runs the requested service
  // (CMD 1 = initialize ARG words of program RAM at LOAD_AREA), signals DONE,
  // then returns to a HLT idle that the 100 Hz timer wakes.
  const FIRMWARE = `
reset:
      MOV   R0, 1
      MOV   CR0, R0            ; enable on-die cache
      MOV   R0, 0x8000
      MOV   SP, R0             ; stack top
      MOV   R0, 0xFF
      MOV   INTM, R0           ; unmask all 8 IRQ lines
      MOV   R0, timer_isr
      MOV   [0x20], R0         ; IVT[8] = timer_isr  (IRQ0 -> vector 8)
      STI                      ; interrupts on
dispatch:
      MOV   R0, [0xC00]        ; CMD
      OR    R0, R0             ; set ZF if no job
      JZ    go_idle
      MOV   R7, [0xC04]        ; ARG = word count
      MOV   R3, 0x10000        ; program RAM base
      MOV   R4, 0              ; init pattern
fill:
      MOV   [R3+0], R4         ; write one word of working set
      MOV   R5, 4
      ADD   R3, R5            ; advance pointer
      LOOP  fill              ; R7--, repeat while non-zero
      MOV   R0, 1
      MOV   [0xC08], R0        ; DONE = 1
      MOV   R0, 0
      MOV   [0xC00], R0        ; CMD = 0  (consume the job)
      JMP   dispatch
go_idle:
      HLT                      ; park until the timer IRQ
      JMP   dispatch
timer_isr:
      PUSH  R0
      MOV   R0, [0xC0C]
      INC   R0
      MOV   [0xC0C], R0        ; TICKS++
      POP   R0
      IRET

    const fw = asm.assemble(FIRMWARE, FW_ENTRY);

  function startPump() {

    timerAcc += c;

        bus.write32(DONE, 0);
        bus.write32(CMD, activeJob.cmd >>> 0);

        // spinning cycle-by-cycle. Then step once so a *serviceable* IRQ (IF=1)
        // can vector and wake the core; if interrupts are masked (IF=0, e.g. a
        // program's terminal HLT) it stays halted and we simply keep advancing
        // time - never a busy-spin, regardless of masked-pending IRQ lines.
        const toNext = TIMER_PERIOD - timerAcc;
        const jump = Math.max(1, Math.min(toNext, budget));
        cpu.totalCycles += jump; timerAcc += jump; budget -= jump;
        if (timerAcc >= TIMER_PERIOD) { timerAcc -= TIMER_PERIOD; bus.raiseIRQ(0); }
        const b = cpu.totalCycles; cpu.step(); budget -= (cpu.totalCycles - b);

  // Assembles `src`, loads it in the user area, and runs it to HLT on the same
  // physical core (time-sliced by the pump), capturing its console output.
  function runProgram(src, loadAddr) {
    if (!ready) return Promise.reject(new Error('CPU not ready'));
    let out;
    try { out = asm.assemble(src, loadAddr || LOAD_AREA); }
    catch (e) { return Promise.reject(e); }
    const at = (loadAddr || LOAD_AREA) >>> 0;
    for (let i = 0; i < out.bytes.length; i++) bus.write8(at + i, out.bytes[i]);
    const captured = [];
    const prevSink = ttySink;
    ttySink = (ch) => { captured.push(ch); if (prevSink) prevSink(ch); };

    running = false;                       // PAUSE the always-on pump; we drive the core
    cpu.faulted = false; cpu.halted = false; cpu.IP = at;
    return new Promise((resolve, reject) => {
      let wall = now(), guard = 0;
      const finish = (fn, arg) => {
        ttySink = prevSink;
        cpu.IP = FW_ENTRY; cpu.halted = false; cpu.setFlag(window.VULP33.FLAG.IF, 1);
        running = true; lastWall = now();    // hand the core back + resume the pump
        fn(arg);
      };
      const chunk = () => {
        const w = now();
        let budget = Math.min(((w - wall) / 1000) * HZ, MAX_FRAME_CYC) | 0;
        wall = w;
        while (budget > 0) {
          if (cpu.faulted) return finish(reject, new Error('program faulted: ' + (cpu.lastMnemonic || '')));

        }

      };
      setTimeout(chunk, 0);
    });
  }

  function onTTY(fn) { ttySink = fn; }
  function ttyText() { return ttyBuffer; }

  // ---- live telemetry ------------------------------------------------------
  function telemetry() {
    if (!ready) return null;
    const ch = bus.cache;
    const hits = ch.hits || 0, misses = ch.misses || 0, tot = hits + misses;
    const cyc = cpu.totalCycles, instrs = cpu.instrCount || 1;
    return {
      cycles: cyc,
      instrs: cpu.instrCount,
      cpi: cyc / instrs,
      ipc: instrs / cyc,
      cacheHits: hits, cacheMisses: misses,
      cacheRate: tot ? (hits / tot) : 0,
      ticks: bus.peek32(TICKS),
      uptimeSec: bus.peek32(TICKS) / TIMER_HZ,
      simMHz: HZ / 1e6,
      halted: cpu.halted, faulted: cpu.faulted,
      lastOp: cpu.lastMnemonic, stage: cpu.stage,
      ramBytes: bus.ramSize,
      busy: !!activeJob || jobQueue.length > 0
    };
  }

  return {
    boot, service, launch, runProgram, telemetry,
    onTTY, ttyText,
    isReady: () => ready,
    isBusy: () => !!activeJob || jobQueue.length > 0,
    assemble: (src, at) => asm.assemble(src, at || LOAD_AREA),
    get cpu() { return cpu; }, get bus() { return bus; },
    HZ, TIMER_HZ
  };
})();

const VFS = {
  root: freshTree(),
  cwd: ['C:'],
  env: { PATH:'C:\\PROGRAMS', TEMP:'C:\\TEMP', PROMPT:'$P$G', OPERATOR:'local' },
  recycle: [],
  listeners: new Set(),

  onChange(fn){ this.listeners.add(fn); return ()=>this.listeners.delete(fn); },
  clearListeners(){ this.listeners.clear(); },
  notify(){
    // flush the cache to the physical volume (write-back), then repaint UI
    if(typeof HDD!=='undefined' && HDD.isReady()) HDD.sync(this.root);
    this.listeners.forEach(fn=>{ try{ fn(); }catch(e){} });
  },

  join(parts){ return parts.join('\\') },
  parsePath(p){
    if(!p) return null;
    p = p.replace(/\//g,'\\');
    let parts = p.split('\\').filter(Boolean);
    if(!/^C:/i.test(parts[0])) parts = [...this.cwd, ...parts];
    return parts;
  },
  resolve(parts){
    if(!parts) return null;
    let node = this.root;
    if(parts[0].toUpperCase()!=='C:') return null;
    for(let i=1;i<parts.length;i++){
      const seg = parts[i];
      if(seg==='..') continue;
      if(!node.children) return null;
      const key = Object.keys(node.children).find(k=>k.toLowerCase()===seg.toLowerCase());
      if(!key) return null;
      node = node.children[key];
    }
    return node;
  },
  ls(parts){
    const node = this.resolve(parts);
    if(!node || node.type!=='dir') return null;
    return Object.entries(node.children).map(([n,v])=>({name:n, ...v}));
  },
  read(parts){ return this.resolve(parts); },
  // canonical (real-case) path so a cold-read key matches the bridge's blob
  // map even when the user typed the path in a different case (e.g. c:\docs\..)
  diskPath(parts){
    let node=this.root; const out=[(parts[0]&&parts[0].toUpperCase()==='C:')?'C:':parts[0]];
    for(let i=1;i<parts.length;i++){ if(!node.children) break; const key=Object.keys(node.children).find(k=>k.toLowerCase()===String(parts[i]).toLowerCase()); if(!key) return parts.join('\\'); out.push(key); node=node.children[key]; }
    return out.join('\\');
  },
  // Demand-read a file's content. A RAM cache HIT (resident page) returns
  // instantly — a warm read, authentically fast. A cache MISS (cold/evicted
  // page) AWAITS a real platter read through the drive: head seek + rotational
  // latency + transfer all elapse in true time, so the FIRST open of a file
  // costs what it physically should. Binary media is pinned resident, so this
  // path only ever misses on text.
  async readContent(parts){
    const node = this.resolve(parts);
    if(!node || node.type==='dir') return null;
    if(node.content != null){ if(typeof FCACHE!=='undefined') FCACHE.touch(node); return node.content; }  // warm hit
    if(typeof HDD!=='undefined' && HDD.isReady()){
      const bytes = await HDD.read(this.diskPath(parts));        // COLD MISS -> real seek + latency
      if(bytes){
        node.content = new TextDecoder().decode(bytes);
        // page it into the RAM cache, evicting least-recently-used clean pages
        // if memory is tight; a resident page stays warm until pressure reclaims it
        if(typeof FCACHE!=='undefined') FCACHE.admit(node);
        return node.content;
      }
    }
    return node.content ?? '';
  },
  write(parts, content, opts={}){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const name = parts[parts.length-1];
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===name.toLowerCase());
    const existing = key ? parent.children[key] : null;
    if(existing && existing.type==='sys') return {ok:false, reason:'protected system object'};
    if(existing && existing.type==='dir') return {ok:false, reason:'target is a directory'};
    const type = opts.type || existing?.type || 'txt';
    const useName = key || name;
    // real capacity enforcement against the emulated ~40 MB FAT16 volume
    if(typeof HDD!=='undefined' && HDD.isReady()){
      const node = { type, content, ...(opts.extra||{}) };
      const prevBytes = existing ? (existing.size || (existing.content!=null?String(existing.content).length:0)) : 0;
      const newBytes  = node.size || (content!=null?String(content).length:0);
      const cap = HDD.capacity(this.root);
      const spc = cap.clusterBytes||2048;
      const delta = Math.ceil(newBytes/spc)*spc - Math.ceil(prevBytes/spc)*spc;
      if(delta > 0 && delta > cap.freeBytes){
        return {ok:false, reason:`insufficient disk space on C: (need ${(delta/1024).toFixed(0)}K, ${(cap.freeBytes/1024).toFixed(0)}K free of ${(cap.totalBytes/1048576).toFixed(0)}MB)`};
      }
    }
    parent.children[useName] = { type, content, ...(opts.extra||{}) };
    const node = parent.children[useName];
    // Cache bookkeeping: release the overwritten node's RAM, then admit the new
    // one as DIRTY (pinned resident until the write-back flush persists it, so
    // its bytes can never be evicted out from under an unflushed write).
    if(typeof FCACHE!=='undefined'){
      if(existing && existing!==node) FCACHE.forget(existing);
      node._dirty = true;
      FCACHE.admit(node);
    }
    this.notify();
    return {ok:true, name:useName};
  },
  remove(parts, opts={}){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===parts[parts.length-1].toLowerCase());
    if(!key) return {ok:false, reason:'not found'};
    const node = parent.children[key];
    if(node.type==='sys') return {ok:false, reason:'protected system object'};
    if(parts.length===2 && key.toUpperCase()==='SYSTEM') return {ok:false, reason:'protected system directory'};
    const isBootCfg = parts.length===3 && parts[1].toUpperCase()==='SYSTEM' && key.toUpperCase()==='BOOT.VMCFG';
    const origin = [...parts.slice(0,-1), key];
    delete parent.children[key];
    // release any RAM the file's resident page held; its content stays on the
    // node object so the recycle bin can still restore it
    if(typeof FCACHE!=='undefined') FCACHE.forget(node);
    if(!opts.permanent){ this.recycle.push({ name:key, node, origin, when:Date.now() }); }
    this.notify();
    if(isBootCfg && typeof triggerGSOD==='function'){ triggerGSOD('BOOT.VMCFG'); }
    return {ok:true};
  },
  restoreRecycle(idx){
    const item = this.recycle[idx];
    if(!item) return {ok:false, reason:'not found'};
    let path = item.origin.slice(0,-1);
    for(let i=2;i<=path.length;i++){ const seg = path.slice(0,i); if(!this.resolve(seg)) this.mkdir(seg); }
    const parent = this.resolve(item.origin.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'origin gone'};
    let name = item.name;
    while(parent.children[name]) name = name.replace(/(\.[^.]+)?$/, '_RESTORED$1');
    parent.children[name] = item.node;
    this.recycle.splice(idx,1);
    this.notify();
    return {ok:true, name};
  },
  purgeRecycle(idx){ if(idx==null){ this.recycle = []; } else this.recycle.splice(idx,1); this.notify(); return {ok:true}; },
  mkdir(parts){
    if(!parts || parts.length<2) return {ok:false, reason:'invalid path'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent || parent.type!=='dir') return {ok:false, reason:'parent not found'};
    const name = parts[parts.length-1];
    if(parent.children[name]) return {ok:false, reason:'already exists'};
    parent.children[name] = { type:'dir', children:{} };
    this.notify();
    return {ok:true};
  },
  rename(parts, newName){
    if(!parts || parts.length<2 || !newName) return {ok:false, reason:'invalid'};
    const parent = this.resolve(parts.slice(0,-1));
    if(!parent) return {ok:false, reason:'parent not found'};
    const key = Object.keys(parent.children).find(k=>k.toLowerCase()===parts[parts.length-1].toLowerCase());
    if(!key) return {ok:false, reason:'not found'};
    if(parent.children[key].type==='sys') return {ok:false, reason:'protected system object'};
    if(parent.children[newName] && newName.toLowerCase()!==key.toLowerCase()) return {ok:false, reason:'name already exists'};
    parent.children[newName] = parent.children[key];
    if(newName!==key) delete parent.children[key];
    this.notify();
    return {ok:true};
  },
  clone(node){
    if(node.type==='dir'){ const c={type:'dir',children:{}}; for(const[k,v] of Object.entries(node.children||{})) c.children[k]=this.clone(v); return c; }
    return JSON.parse(JSON.stringify(node));
  },
  copy(srcParts, dstDirParts, newName){
    const src = this.resolve(srcParts);
    if(!src) return {ok:false, reason:'source not found'};
    const dstDir = this.resolve(dstDirParts);
    if(!dstDir || dstDir.type!=='dir') return {ok:false, reason:'destination not a directory'};
    let name = newName || srcParts[srcParts.length-1];
    while(dstDir.children[name]) name = name.replace(/(\.[^.]+)?$/, '_COPY$1');
    dstDir.children[name] = this.clone(src);
    this.notify();
    return {ok:true, name};
  },
  move(srcParts, dstDirParts){
    const src = this.resolve(srcParts);
    if(!src) return {ok:false, reason:'source not found'};
    if(src.type==='sys') return {ok:false, reason:'protected system object'};
    const dstDir = this.resolve(dstDirParts);
    if(!dstDir || dstDir.type!=='dir') return {ok:false, reason:'destination not a directory'};
    const srcParent = this.resolve(srcParts.slice(0,-1));
    const key = Object.keys(srcParent.children).find(k=>k.toLowerCase()===srcParts[srcParts.length-1].toLowerCase());
    let name = key;
    while(dstDir.children[name] && this.resolve([...dstDirParts,name])!==src) name = name.replace(/(\.[^.]+)?$/, '_MOVED$1');
    dstDir.children[name] = srcParent.children[key];
    delete srcParent.children[key];
    this.notify();
    return {ok:true, name};
  }
};

async function bootSequence(soft){
  $('#desktop').classList.remove('on');
  $('#windows').innerHTML='';
  $('#tasks').innerHTML='';
  if(typeof WM!=='undefined'){ WM.wins.clear(); WM.active=null; WM.z=100; }

  boot.style.display='';
  boot.innerHTML = '';

  const haveBoot = !!VFS.resolve(['C:','SYSTEM','BOOT.VMCFG']);
  const lines = soft ? BOOT_LINES.slice(10) : BOOT_LINES;
  for(const [text, delay, sfx] of lines){
    // Cold boot: power on the real Vulp-33 CPU and run a genuine POST self-test.
    // From here the chip never stops - it idles in a firmware HLT loop woken by
    // the 100 Hz timer, and every OS job is executed by it in real time.
    if(!soft && /^Detecting CPU/.test(text) && typeof VCPU!=='undefined' && !VCPU.isReady()){
      const ln = el('div','line','Detecting CPU ............... Vulp-33 powering on'); boot.appendChild(ln);
      boot.scrollTop = boot.scrollHeight;
      const ramBytes=((typeof VMRES!=='undefined'?VMRES.ramKB:33408))*1024;
      VCPU.boot(ramBytes);
      // POST: exercise ALU (triangular sum), a variable-latency multiply, the
      // divider and the on-die cache, then print the core signature to console.
      const POST=`MOV R0,1
      MOV CR0,R0
      MOV R1,0
      MOV R2,100
psum: ADD R1,R2
      DEC R2
      JNZ psum
      MOV R3,60000
      MOV R4,60000
      MUL R3,R4
      MOV R5,1000000
      MOV R6,0
      MOV R0,7
      DIV R5,R0
      MOV R0,86
      OUT 1,R0
      MOV R0,51
      OUT 1,R0
      MOV R0,51
      OUT 1,R0
      HLT`;
      let post; try{ post=await VCPU.runProgram(POST); }catch(e){ post={output:'',cycles:0}; }
      const mhz=(VCPU.HZ/1e6).toFixed(0);
      ln.textContent=`Detecting CPU ............... Vulp-33 "${post.output||'V33'}" 32-bit CISC @ ${mhz} MHz [OK]`;
      boot.appendChild(el('div','line',`  * POST: ${post.instrs||0} instr / ${post.cycles||0} cyc \u00B7 on-die cache OK \u00B7 ${(((typeof VMRES!=='undefined'?VMRES.ramKB:33408))/1024).toFixed(1)}MB RAM`));
      boot.scrollTop = boot.scrollHeight;
      await sleep(delay);
      continue;
    }
    // Cold boot: the storage-scan line really spins up + low-level formats the
    // emulated IDE drive (soft/warm reboot keeps the already-mounted volume).
    if(!soft && /^Scanning storage/.test(text) && typeof HDD!=='undefined' && !HDD.isReady()){
      const ln = el('div','line','Detecting IDE fixed disk ..... spinning up'); boot.appendChild(ln);
      boot.scrollTop = boot.scrollHeight;
      const cap = await HDD.boot((phase,drv)=>{
        if(phase==='ready'){ const t=drv.telemetry(); ln.textContent=`Detecting IDE fixed disk ..... 0->${t.rpm} RPM in ${(drv.clock/1000).toFixed(1)}s [OK]`; }
        if(phase==='formatted') beep(660,0.04);
      });
      const mb=(cap.totalBytes/1048576).toFixed(0);
      boot.appendChild(el('div','line',`Scanning storage ............ C: ${mb}MB FAT16 (Conner CP3044-class IDE) [OK]`));
      boot.scrollTop = boot.scrollHeight;
      await sleep(delay);
      continue;
    }
    boot.appendChild(el('div','line', text));
    if(sfx==='beep') beep(660,0.04);
    boot.scrollTop = boot.scrollHeight;
    await sleep(soft?Math.min(delay,60):delay);
  }
  // First cold boot: prime the write-back cache so the initial tree is laid
  // down on the real platters (files now occupy genuine clusters), then empty
  // the page cache — a freshly-booted machine has nothing paged into RAM yet,
  // so the first open of any text file pays a real, cold platter read.
  if(!soft && typeof HDD!=='undefined' && HDD.isReady()){
    HDD.sync(VFS.root);
    HDD.flush().then(()=>{ if(typeof FCACHE!=='undefined') FCACHE.boot(VFS.root); else HDD.evictClean(VFS.root); });
  }
  if(!haveBoot){
    boot.appendChild(el('div','line',''));
    const e = el('div','line'); e.innerHTML = '<span class="err">C:\\SYSTEM\\BOOT.VMCFG not found.</span>';
    boot.appendChild(e);
    boot.appendChild(el('div','line','Non-system disk or configuration error.'));
    boot.appendChild(el('div','line','HALT.'));
    beep(120,0.5,'sawtooth');
    return;
  }
  const cur = el('span','cursor',' ');
  boot.appendChild(cur);
  await new Promise(resolve=>{
    const done = ()=>{ document.removeEventListener('keydown',done); document.removeEventListener('pointerdown',done); resolve(); };
    document.addEventListener('keydown',done);
    document.addEventListener('pointerdown',done);
  });
  beep(880,0.06); await sleep(50); beep(1320,0.08);
  boot.innerHTML = '\nVMOS 9.7\n\nStarting up ...\n\n';
  const bar = el('div','line','[                              ]');
  boot.appendChild(bar);
  for(let i=0;i<=30;i++){ bar.textContent='['+'\u2588'.repeat(i)+' '.repeat(30-i)+']'; await sleep(soft?18:30); }
  await sleep(100);
  boot.style.display='none';
  $('#desktop').classList.add('on');

  renderDesktop();
  buildStartMenu();
  VFS.onChange(()=>{ renderDesktop(); buildStartMenu(); });
  if(!SHELL_WIRED){ wireShellOnce(); SHELL_WIRED=true; }
  startClock();
  updateNetStatus();
  VMRES.startGovernor();
  BOOTED = true;
  if(!soft){
    showInfo('WELCOME, OPERATOR','Your session is provisioned and the host bridge is live.\n\nKasai Kitsune Corp. thanks you for your continued trust. Rest\neasy: nothing you do in here can reach the machine outside, and\nnothing outside can reach in to you. We would never allow that.*\n\nTo begin:\n  * Double-click PROGRAMS on the desktop.\n  * Open TERMINAL.VMXE and type `help` for the command list.\n  * Right-click the desktop or EXPLORER for menus.\n\nEnjoy your stay. You are perfectly safe here.\n\n* Continued use of this shell constitutes acceptance.');
  }
}
